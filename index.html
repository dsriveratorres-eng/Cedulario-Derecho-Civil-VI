/* ===== TESTAMENTO ===== */
K('t01','t','Defina la sucesión testada y el testamento.',
`**Sucesión testada**: la transmisión que hace el causante de sus bienes, derechos y obligaciones transmisibles a las personas que designa en su **testamento** (art. 952).
**Testamento** (art. **999**): "un acto **más o menos solemne**, en que **una persona** dispone del todo o de una parte de sus bienes para que tenga **pleno efecto después de sus días**, conservando la **facultad de revocar** las disposiciones contenidas en él, mientras viva".
Fundamento discutido: teoría **naturalista** (derivación del dominio) vs. **positivista** (facultad conferida por la ley, Claro Solar).`,
'Naranjo p. 41 · Manual §77–80 · art. 999');

K('t02','t','¿Qué críticas se formulan a la definición del art. 999?',
`1. "**Más o menos solemne**": sugiere que podría no ser solemne. En realidad **siempre es solemne**; la expresión alude a la clasificación en testamentos **solemnes y menos solemnes o privilegiados**.
2. "**Dispone de sus bienes**": el testamento puede contener también **declaraciones** sin contenido patrimonial (reconocer un hijo, art. 187; nombrar partidor, art. 1324; albacea; guardador). Disponer de los bienes es su objeto **fundamental, pero no único**.`,
'Naranjo p. 42 · Manual §80');

K('t03','t','¿Cuáles son las características del testamento?',
`Según la profesora:
1. **Acto jurídico**.
2. **Unilateral**: basta la voluntad del testador.
3. **Personalísimo** (art. 1003): obra de una sola persona.
4. **Solemne** (arts. 999, 1000).
5. **Gratuito**.
6. **Dispositivo** (con posible contenido declarativo).
7. **Por causa de muerte**: en vida es solo un proyecto; puede disponer de bienes futuros (a diferencia de la donación).
8. **Esencialmente revocable** (arts. 999, 1001).
9. **Se basta a sí mismo**: las cédulas o papeles a que se refiera no forman parte de él (art. 1002).`,
'Manual §80 · Naranjo pp. 41–42');

K('t04','t','¿Qué consecuencias derivan del carácter unilateral y personalísimo del testamento?',
`Son **nulos**:
- Los **testamentos conjuntos o de hermandad**: "Serán nulas todas las disposiciones contenidas en el testamento otorgado por dos o más personas a un tiempo, ya sean en beneficio recíproco de los otorgantes, o de una tercera persona" (art. **1003** inc. 2º).
- La **delegación**: "La facultad de testar es **indelegable**" (art. **1004**, el más breve del Código). No cabe la representación.
- Las **disposiciones captatorias** (art. **1059**).
- La elección del asignatario por el **puro arbitrio ajeno** (art. **1063**).
Los **relativamente incapaces** pueden testar libremente.`,
'Naranjo pp. 41–42 · Manual §80');

K('t05','t','¿Por qué se dice que el testamento es esencialmente revocable? ¿Qué cláusulas se tienen por no escritas?',
`Art. **1001**: "Todas las disposiciones testamentarias son esencialmente revocables, sin embargo de que el testador exprese en el testamento la determinación de no revocarlas."
Se tienen **por no escritas**:
- las **cláusulas derogatorias** de disposiciones futuras, aunque se confirmen con **juramento**;
- la cláusula de un testamento anterior que ordena que no valga su revocación si no se hace con **ciertas palabras o señales**.
La revocabilidad es la medida más eficaz para asegurar la **libertad de testar**.
Solo son revocables las **disposiciones**; las **declaraciones** son irrevocables (el reconocimiento de un hijo, art. 189 inc. 2º).`,
'Naranjo p. 42 · art. 1001');

K('t06','t','¿Puede el testamento producir efectos en vida del testador?',
`Produce sus plenos efectos a la muerte, pero excepcionalmente produce efectos en vida:
1. El **reconocimiento de un hijo** hecho en el testamento.
2. Las **donaciones revocables** y los **legados entregados en vida**: el donatario o legatario adquiere los derechos de **usufructuario** (art. 1140).`,
'Naranjo pp. 42–43');

K('t07','t','¿Qué es el Registro Nacional de Testamentos y qué sanción tiene la falta de inscripción?',
`La Ley 18.181 creó un registro a cargo del Archivero Judicial de Santiago; la **Ley 19.903** lo radicó en el **Registro Civil** (Registro Nacional de Testamentos). Deben inscribirse los testamentos **abiertos, cerrados y protocolizados**.
Finalidad: **publicidad**; impedir que por desconocimiento o mala fe se tramite como intestada una sucesión testada.
**Sanción**: la omisión **no afecta la validez** del testamento; solo genera responsabilidad del notario o funcionario (art. 439 COT).`,
'Naranjo p. 43');

K('t08','t','¿Qué clases de requisitos tiene el testamento y qué sanción tiene su omisión?',
`1. **Internos**: **capacidad** del testador y **voluntad exenta de vicios**. Comunes a todo testamento. Su falta: **nulidad total**.
2. **Externos o solemnidades**: varían según la clase de testamento. Su omisión: **nulidad del testamento** ("no tendrá valor alguno", art. 1026).
3. **Requisitos de las disposiciones testamentarias**: su infracción solo anula **la cláusula** respectiva; las demás pueden valer.`,
'Naranjo p. 43 · Manual §81');

K('t09','t','¿Quiénes no son hábiles para testar (art. 1005)?',
`1. (Derogado.)
2. El **impúber** (incapaz absoluto).
3. El que se halla **bajo interdicción por causa de demencia** (la interdicción exime de probar la demencia, art. 465).
4. El que **actualmente** no está en su sano juicio por **ebriedad u otra causa** (aquí cabe el demente no interdicto).
5. Todo el que **no pudiere expresar su voluntad claramente**.
"Las personas no comprendidas en esta enumeración son hábiles para testar": la enumeración es **taxativa**; por eso el **menor adulto** y el **disipador interdicto** pueden testar.`,
'Naranjo p. 44 · Manual §83 · art. 1005');

K('t10','t','¿En qué momento debe existir la capacidad para testar (art. 1006)?',
`Al momento de **otorgar** el testamento:
- El testamento otorgado durante una causa de inhabilidad es **nulo, aunque después cese** la causa (el impúber que fallece adulto sin otorgar uno nuevo).
- El testamento válido **no deja de serlo** si después sobreviene una causa de inhabilidad.
Determinar si alguien estaba en su sano juicio es **cuestión de hecho** (CS).`,
'Naranjo p. 44 · art. 1006');

K('t11','t','¿Cómo opera la fuerza como vicio en el testamento (art. 1007)?',
`"El testamento en que **de cualquier modo** haya intervenido la fuerza, es **nulo en todas sus partes**." Además, quien la ejerce es **indigno** (art. 968 Nº 4).
- "**De cualquier modo**": para Somarriva y la CS, la fuerza debe reunir los requisitos generales (**grave, injusta y determinante**, arts. 1456–1457); la frase alude a que puede provenir del beneficiado o de un **tercero**. Domínguez: interpretar con más laxitud; P. Rodríguez: incluye el temor reverencial.
- "**Nulo en todas sus partes**": se anula **todo el testamento**, no solo la cláusula obtenida por fuerza (el proyecto de 1853 anulaba solo la cláusula).
- **Sanción**: discutido si es nulidad **relativa** (regla general) o **absoluta** (máxima sanción por la letra).`,
'Naranjo pp. 44–45 · Manual §85');

K('t12','t','¿Qué efecto tiene el dolo en el testamento?',
`La ley no lo regula como vicio del testamento; solo lo menciona en el art. **968 Nº 4** (es indigno el que por fuerza o dolo obtuvo una disposición o impidió testar).
- **Naranjo/Somarriva**: rigen las reglas generales, con la salvedad de que, siendo acto unilateral, el dolo puede provenir de **cualquier tercero**.
- **Profesora**: el dolo es necesariamente obra de un tercero que se beneficia; su consecuencia **no es la nulidad del testamento, sino la indignidad** de quien lo fraguó. Si con dolo se impidió testar en beneficio de un tercero, este no tiene sanción (la indignidad no se aplica por analogía).
Además, impedir testar con fuerza o dolo es causal de **desheredamiento** (art. 1208 Nº 3).`,
'Naranjo p. 45 · Manual §87',
'Prima la postura de la profesora: dolo → indignidad, no nulidad.');

K('t13','t','¿Cómo opera el error en el testamento?',
`No tiene regulación general; se trata a propósito de las **asignaciones**, porque solo vicia la **cláusula** en que incide:
- Art. **1057**: el error en el **nombre o calidad** del asignatario **no vicia** la disposición si no hay duda acerca de la persona.
- Art. **1058**: la asignación que pareciere **motivada por un error de hecho**, de manera que sea claro que **sin ese error no habría tenido lugar**, se tiene **por no escrita**.
Requisitos del 1058: error **de hecho** (no de derecho), **determinante**, y que el motivo aparezca del testamento.`,
'Naranjo pp. 57–58 · Manual §86');

K('t14','t','¿Qué requisitos de objeto y causa exige el testamento?',
`**Objeto**: debe ser **lícito** (art. 1105), **posible**, **determinado o determinable** (art. 1066) y recaer, por regla general, sobre **bienes del causante** (salvo art. 1107). La cosa futura vale si llega a existir (art. 1113).
**Causa**: su exigencia es discutida (Elorriaga). La **profesora** sostiene que el testamento, como acto jurídico, debe ser **causado**, con doble función: proteger la **verdadera voluntad** del causante (art. 1058) y evitar **ilícitos** (anular cláusulas que destinen recursos a fines delictivos).`,
'Manual §110–112');

/* ===== FORMAS ===== */
K('f01','f','¿Cómo se clasifican los testamentos según sus solemnidades?',
`Siempre son solemnes; se clasifican por el **grado** de solemnidad (art. 1008):
I. **Solemnes**: se observan todas las solemnidades que la ley **ordinariamente** requiere.
- Otorgados **en Chile**: **abierto** (nuncupativo o público: el testador hace sabedores de sus disposiciones a los testigos) y **cerrado** (secreto: no es necesario que los testigos las conozcan).
- Otorgados **en el extranjero**: conforme a la **ley extranjera** (art. 1027) o a la **ley chilena** (art. 1028).
II. **Menos solemnes o privilegiados**: pueden omitirse algunas solemnidades por circunstancias particulares determinadas por la ley: **verbal, militar y marítimo** (art. 1030).
Las solemnidades se rigen por la ley **vigente al otorgamiento**.`,
'Naranjo pp. 45–46 · art. 1008');

K('f02','f','¿Qué requisitos son comunes a todo testamento solemne otorgado en Chile?',
`1. **Escrituración**: "El testamento solemne es **siempre escrito**" (art. 1011). Chile no admite el testamento ológrafo interno.
2. **Testigos hábiles** (art. 1012), en número de **3** (regla general) o **5** (abierto sin funcionario).
Además: **dos** testigos al menos deben estar **domiciliados en la comuna** o agrupación de comunas del otorgamiento, y deben **saber leer y escribir** al menos **uno** (si son tres) o **dos** (si son cinco).`,
'Naranjo pp. 46–47 · arts. 1011, 1012');

K('f03','f','¿Quiénes no pueden ser testigos en un testamento solemne otorgado en Chile (art. 1012)?',
`1. (Derogado.)
2. Los **menores de 18 años**.
3. Los **interdictos por demencia**.
4. Los que **actualmente** están privados de la razón.
5. Los **ciegos**.
6. Los **sordos**.
7. Los **mudos**.
8. Los **condenados** a ciertas penas y, en general, los inhabilitados por sentencia ejecutoriada para ser testigos.
9. Los **amanuenses** del escribano que autoriza.
10. Los **extranjeros no domiciliados** en Chile.
11. Las personas que **no entiendan el idioma** del testador (salvo art. 1024).
No hay inhabilidad por **parentesco** (pero los parientes del testigo no pueden ser asignatarios, art. 1061).`,
'Naranjo p. 46 · art. 1012');

K('f04','f','¿Qué es la habilidad putativa de los testigos (art. 1013)?',
`No se invalida el testamento por la **inhabilidad real** de un testigo si:
- la inhabilidad **no se manifiesta en su aspecto o comportamiento**;
- se **ignora generalmente** en el lugar donde se otorga; y
- la opinión contraria (de habilidad) se funda en **hechos positivos y públicos**.
Solo puede servir a **un solo** testigo.
Es aplicación del principio **"el error común constituye derecho"** y de la **teoría de la apariencia**. En los privilegiados también basta la habilidad putativa (art. 1031).
Sobre la habilidad putativa del **funcionario**, la CS ha fallado en ambos sentidos; Somarriva la acepta por el error común.`,
'Naranjo pp. 46, 52 · art. 1013');

K('f05','f','¿Qué es el testamento abierto y de qué formas puede otorgarse?',
`Es aquel en que el testador **hace sabedores de sus disposiciones** al escribano, si lo hay, y a los testigos: eso es lo que **lo constituye esencialmente** (art. **1015**).
Formas (art. **1014**):
a) Ante **competente escribano** (notario) **y tres testigos**; puede hacer las veces de escribano el **juez de letras** del lugar. Es instrumento público.
b) Ante **cinco testigos**, sin funcionario. Requiere **publicación** (art. 1020) antes de ejecutarse.
Ante notario puede otorgarse **en protocolo** (es además escritura pública) o **en hoja suelta**; en este caso debe **protocolizarse** a más tardar el **primer día hábil siguiente** para valer como instrumento público (art. 420 COT).`,
'Naranjo p. 47 · arts. 1014, 1015');

K('f06','f','¿Qué solemnidades tiene el otorgamiento del testamento abierto ante notario?',
`1. **Unidad y continuidad**: presenciado en todas sus partes por el testador, un mismo escribano y unos mismos testigos (art. 1015 inc. 2º).
2. **Menciones** del art. **1016** (nombre, nacimiento, nacionalidad, domicilio, edad, que está en su entero juicio, cónyuges e hijos, testigos, lugar y fecha) + **hora** y lugar (art. 414 COT).
3. **Lectura en alta voz** por el **escribano** (o, a falta de este, por un testigo designado por el testador), estando el testador a la vista y oyendo todos (art. **1017**). No es necesario dejar constancia de la lectura (Somarriva: solemnidad ≠ prueba de la solemnidad; arg. del art. 1019).
4. **Firmas** del testador, testigos y escribano; si el testador no sabe o no puede firmar, se menciona la causa; si un testigo no puede, firma otro por él y a su ruego (art. **1018**).`,
'Naranjo pp. 48–49 · arts. 1015–1018');

K('f07','f','¿Quiénes solo pueden otorgar testamento abierto y qué reglas especiales rigen?',
`1. El que **no sabe leer y escribir**: no puede otorgar testamento cerrado (art. **1022**).
2. **Ciego, sordo o sordomudo** que puedan darse a entender claramente, aunque no por escrito: solo pueden testar **nuncupativamente** y **ante escribano** o funcionario (no ante 5 testigos) (art. **1019**):
- **Ciego**: el testamento se lee **dos veces**: por el escribano y por un testigo elegido por el testador.
- **Sordo o sordomudo**: ambas lecturas se hacen además ante un **perito o especialista en lengua de señas**, que da a conocer simultáneamente su contenido.
- Debe hacerse **mención especial** de estas solemnidades.`,
'Naranjo p. 49 · arts. 1019, 1022');

K('f08','f','¿En qué consiste la publicación del testamento otorgado ante cinco testigos (art. 1020)?',
`Como no interviene ministro de fe, antes de ejecutarse debe publicarse ante el **juez del último domicilio** del testador (art. 1009), a petición de cualquier persona capaz de parecer en juicio:
1. El juez verifica la **muerte** del testador (partida de defunción).
2. Cita a los **testigos** para que **reconozcan sus firmas y la del testador**; si alguno falta, los presentes abonan su firma (y puede pedirse declaración jurada).
3. El juez **rubrica** el testamento al principio y fin de cada hoja y ordena su **protocolización**.
La publicación **no le da validez**: quedan a salvo las acciones de nulidad. El plazo de un día del art. 420 COT no se aplica a este testamento.`,
'Naranjo pp. 47–48 · art. 1020');

K('f09','f','¿Qué es el testamento cerrado y cómo se otorga?',
`Aquel en que **no es necesario que los testigos conozcan** sus disposiciones. Se otorga **siempre ante escribano** (o juez letrado) **y tres testigos** (art. **1021**).
Lo que lo **constituye esencialmente** (art. **1023**): el acto en que el testador **presenta** al escribano y testigos una **escritura cerrada**, declarando **de viva voz**, de manera que lo vean, oigan y entiendan, que en ella se contiene su testamento (los mudos, por escrito).
Etapas:
1. El testamento debe estar **escrito o al menos firmado** por el testador.
2. Se introduce en un **sobre cerrado** que no pueda abrirse sin romper la cubierta.
3. El notario redacta la **carátula** ("testamento"), que firman testador, testigos y notario.
El acto es **continuo**, ante un mismo escribano y unos mismos testigos.`,
'Naranjo pp. 49–50 · arts. 1021, 1023');

K('f10','f','¿Quiénes solo pueden otorgar testamento cerrado (art. 1024)?',
`"Cuando el testador **no pudiere entender o ser entendido de viva voz**, sólo podrá otorgar testamento cerrado" (p. ej., el mudo o quien solo habla un idioma que no entienden notario y testigos).
El testador escribirá **de su letra**, sobre la cubierta, la palabra "**testamento**" (o su equivalente en otro idioma) y su **nombre, apellido, domicilio y nación**.
La profesora estima que el art. 1019 (ciego, sordo y sordomudo que se dan a entender) es excepción al 1024: esos deben testar en forma abierta.`,
'Naranjo pp. 49–50 · Manual §99 · art. 1024');

K('f11','f','¿Cómo se abre el testamento cerrado (art. 1025)?',
`Ante el **juez del último domicilio** del testador:
- Se cita al **notario y testigos**, que deponen: (1) reconocen **su firma y la del testador**; (2) declaran si el testamento está **cerrado, sellado o marcado** como al entregarse.
- Si no comparecen todos, basta el notario y los testigos presentes, y pueden abonarse firmas por declaración jurada de personas fidedignas.
- Se abre el sobre, el juez **rubrica** cada hoja y ordena **protocolizarlo** (ante el notario que lo autorizó o el que designe). Desde la protocolización es instrumento público.
Los vicios de la apertura **no anulan** el testamento.`,
'Naranjo p. 50 · art. 1025');

K('f12','f','¿Cuándo es nulo el testamento solemne (art. 1026)?',
`"El testamento solemne, abierto o cerrado, en que se omitiere **cualquiera de las formalidades** a que deba respectivamente sujetarse... **no tendrá valor alguno**" → **nulidad absoluta**.
**Excepción** (inc. 2º): la omisión de las **designaciones** del art. 1016, del inc. 5º del 1023 y del inc. 2º del 1024 **no anula** si no hay duda sobre la **identidad** del testador, escribano o testigos.
Causales típicas: no escrito; menos testigos hábiles que los exigidos (más testigos no anula); funcionario no autorizado; abierto no leído o leído por un testigo habiendo notario; no constar por qué el testador no firmó; falta de doble lectura del ciego; cubierta violada; otorgar abierto debiendo ser cerrado o viceversa.
La omisión de la **hora**: Somarriva: no anula; solo responsabilidad del notario. La del **lugar**: se aplica el 1026.`,
'Naranjo p. 51 · art. 1026');

K('f13','f','¿Cuándo vale en Chile el testamento otorgado en el extranjero conforme a la ley extranjera (art. 1027)?',
`Requisitos:
1. Que sea **escrito** (no vale el verbal extranjero).
2. Que se acredite su **conformidad con las solemnidades** de la ley del país donde se otorgó (*locus regit actum*).
3. Que se pruebe la **autenticidad** del instrumento en la forma ordinaria (art. 17).
**Ológrafo** (escrito, fechado y firmado de puño y letra): no vale otorgado en Chile, pero la doctrina mayoritaria y la CS aceptan el otorgado en el extranjero si la ley de ese país lo admite.`,
'Naranjo p. 52 · art. 1027');

K('f14','f','¿Qué requisitos tiene el testamento otorgado en el extranjero conforme a la ley chilena (art. 1028)?',
`1. Solo puede otorgarlo un **chileno o un extranjero domiciliado en Chile**.
2. Debe autorizarlo un **ministro plenipotenciario, encargado de negocios, secretario de legación** o **cónsul** (no un vicecónsul), con mención del cargo.
3. **Testigos chilenos** o extranjeros **domiciliados en la ciudad** del otorgamiento.
4. En lo demás, las reglas del testamento solemne otorgado en Chile (puede ser abierto o cerrado), con el **sello** de la legación o consulado.
Si no se otorgó ante el jefe de legación, lleva su **visto bueno**; se remite copia al **Ministerio de Relaciones Exteriores**, que la envía al juez del último domicilio en Chile para su protocolización (art. 1029).`,
'Naranjo pp. 52–53 · arts. 1028, 1029');

K('f15','f','¿Qué es el testamento privilegiado y qué solemnidades comunes tiene?',
`Aquel en que pueden **omitirse algunas solemnidades** por circunstancias particulares determinadas expresamente por la ley (art. 1008). Son el **verbal, militar y marítimo** (art. 1030).
Solemnidades comunes:
1. **Testigos** (art. 1031): toda persona de **sano juicio**, mayor de **18 años**, que **vea, oiga y entienda** al testador y no tenga la inhabilidad del Nº 8 del art. 1012. En los privilegiados **escritos**, **todos** deben saber leer y escribir. Basta la habilidad putativa.
2. Art. **1032**: el testador debe **declarar expresamente que su intención es testar**; las mismas personas de principio a fin; acto **continuo**.
Característica propia: además de la revocación, terminan por **caducidad** (art. 1212 inc. 2º).`,
'Naranjo p. 53 · arts. 1030–1032');

K('f16','f','¿Qué es el testamento verbal, cuáles son sus requisitos y cuándo caduca?',
`Otorgado por una persona en **peligro inminente** de su vida, ante **tres testigos**, haciendo **de viva voz** sus declaraciones y disposiciones (arts. 1033–1035).
**Requisitos**: peligro tan inminente que parezca no haber modo o tiempo de otorgar testamento solemne; 3 testigos; declaraciones a viva voz.
**Caducidad** (art. **1036**): no tendrá valor si el testador fallece **después de los 30 días** siguientes al otorgamiento, o si, fallecido antes, **no se pone por escrito** dentro de los **30 días** siguientes a la muerte.
Puesta por escrito: **examen de los testigos** → **resolución judicial** que manda tener esas declaraciones como testamento → **protocolización**. El testamento así consignado puede impugnarse como cualquier otro (art. 1040).`,
'Naranjo p. 54 · arts. 1033–1040');

K('f17','f','¿Qué es el testamento militar y cuándo caduca?',
`El que se otorga **en tiempo de guerra** por los militares y demás individuos empleados en un cuerpo de tropas de la República, voluntarios, rehenes, prisioneros y quienes los acompañan (art. 1041). Requiere hallarse en una **expedición de guerra** en marcha o campaña, o en una plaza **sitiada** (art. 1043).
Lo reciben un **capitán** u oficial superior, intendente de ejército, comisario o auditor de guerra; si el testador está enfermo o herido, el capellán, médico o cirujano; en un destacamento, el oficial que lo mande.
Puede ser **abierto, cerrado o verbal**.
**Caducidad**: el abierto y el cerrado, si el testador sobrevive **90 días** a que cesen las circunstancias habilitantes (art. 1044); el **verbal**, si sobrevive al **peligro** (art. 1046).`,
'Naranjo pp. 54–55 · arts. 1041–1047');

K('f18','f','¿Qué es el testamento marítimo y cuándo caduca?',
`El que se otorga **en alta mar** a bordo de un **buque chileno de guerra** o de un **buque mercante** bajo bandera chilena. Puede usarlo **cualquier persona a bordo**, no solo la tripulación (art. 1051); se aplica en **tiempo de paz**.
- **Buque de guerra**: abierto (ante el comandante o su segundo y **3 testigos**; se extiende duplicado; se anota en el diario), cerrado o verbal (en peligro inminente).
- **Buque mercante**: solo en la forma **abierta** del art. 1048, ante el **capitán, su segundo o el piloto** (art. 1055).
**Caducidad**: vale solo si el testador fallece **antes de desembarcar** o dentro de los **90 días** siguientes al desembarque (art. 1052); el verbal caduca si sobrevive al peligro (art. 1053).`,
'Naranjo p. 55 · arts. 1048–1055');

/* ===== INTERPRETACIÓN ===== */
K('v01','v','¿Cuál es la regla fundamental de interpretación del testamento (art. 1069)?',
`"Sobre las reglas dadas en este título acerca de la inteligencia y efecto de las disposiciones testamentarias, **prevalecerá la voluntad del testador claramente manifestada**, con tal que **no se oponga a los requisitos o prohibiciones legales**.
Para conocer la voluntad del testador se estará **más a la substancia de las disposiciones que a las palabras** de que se haya servido."
Busca proteger la **voluntad real** (como el art. 1560 en los contratos). Se complementa con el principio de **coherencia**: el testamento se interpreta como un todo armónico.`,
'Naranjo p. 58 · Manual §114 · art. 1069');

K('v02','v','¿Qué es la interpretación del testamento, cuándo procede la judicial y cuál es su naturaleza?',
`Proceso intelectual por el cual el intérprete se sitúa donde estaba el causante al testar, para determinar su **verdadera voluntad**.
- **Interpretación testamentaria**: existe **siempre** (para ejecutar hay que comprender).
- **Interpretación judicial**: requiere (a) texto **dudoso u oscuro** y (b) **controversia** entre interesados o terceros.
**Naturaleza**: la jurisprudencia estima que determinar la voluntad del testador es **cuestión de hecho** (no revisable por casación en el fondo); pero la **calificación jurídica** de una disposición (herencia o legado, heredero universal o de cuota) es **cuestión de derecho** (procede casación).`,
'Manual §113–115');

K('v03','v','¿Qué normas especiales de interpretación contiene el Código?',
`- Art. **1056**: valen las asignaciones a **objetos de beneficencia** aunque no sean para personas determinadas; lo dejado al **alma** del testador se asimila; lo dejado a los **pobres** se aplica a los de la parroquia del testador.
- Art. **1064**: lo dejado indeterminadamente a los **parientes** se entiende para los consanguíneos de **grado más próximo** según el orden de la sucesión intestada, con **derecho de representación**; salvo que **a la fecha del testamento** haya habido un solo pariente en el grado más próximo, pues entonces se entienden llamados también los del **grado inmediato**.
- Art. **1066** inc. 2º: si la asignación a beneficencia no determina cuota, la fija el **juez**.
- Art. **1069**: prevalece la voluntad claramente manifestada.`,
'Naranjo pp. 56–58 · Manual §116');

/* ===== REQUISITOS DE LAS ASIGNACIONES ===== */
K('s01','s','¿Qué son las asignaciones testamentarias y qué requisitos deben reunir?',
`Las que hace el **testamento** de una persona difunta para suceder en sus bienes (art. 953).
**Requisitos subjetivos** (en la persona del asignatario): ser **capaz**, **digno** y persona **cierta y determinada** (art. 1056).
**Requisitos objetivos** (en la asignación misma): que el objeto asignado sea **determinado o determinable** (art. 1066).
Además, la voluntad debe expresarse en forma **libre, clara y personal** (arts. 1059, 1060, 1061, 1063).`,
'Naranjo p. 56 · Manual §121–124');

K('s02','s','¿Qué significa que el asignatario deba ser persona cierta y determinada (arts. 1056 y 1065)?',
`- **Cierta**: que **exista** (arts. 962, 963), con las excepciones legales (concebido, personas que se espera que existan, premio, fundaciones).
- **Determinada**: individualizada por su **nombre** o por **indicaciones claras** del testamento (determinable). Si no, la asignación se tiene **por no escrita** (art. 1056).
- Si la asignación está escrita de modo que **no se sabe a cuál de dos o más personas** quiso designar el testador, **ninguna** tiene derecho a ella (art. **1065**).
- El **error en el nombre o calidad** no vicia la disposición si no hay duda sobre la persona (art. 1057).`,
'Naranjo pp. 56–57 · arts. 1056, 1057, 1065');

K('s03','s','¿En qué casos admite la ley la indeterminación del asignatario?',
`1. Asignaciones a **objetos de beneficencia**, aunque no sean para personas determinadas (art. 1056 inc. 2º); se asimilan las dejadas al **alma** del testador. Hoy su inversión corresponde a FONASA.
2. Asignaciones a los **pobres**: se aplican a los de la **parroquia** del testador.
3. Asignaciones indeterminadas a los **parientes** (art. **1064**): a los consanguíneos de **grado más próximo** según la sucesión intestada, con **representación**; si a la fecha del testamento había uno solo en ese grado, concurren también los del **grado inmediato**.`,
'Naranjo pp. 56–57 · Manual §123 · arts. 1056, 1064');

K('s04','s','¿Qué grado de determinación exige el art. 1066 respecto del objeto de la asignación?',
`"Toda asignación deberá ser o a **título universal**, o de **especies determinadas** o que por las indicaciones del testamento puedan claramente determinarse, o de **géneros y cantidades** que igualmente lo sean o puedan serlo. De otra manera se tendrá **por no escrita**."
- Universales: basta determinar el patrimonio.
- Legados de especie: determinación **máxima**.
- Legados de género: determinación genérica y en cantidad, o determinables.
**Excepción** (inc. 2º): asignación a un **objeto de beneficencia** sin determinar cuota: la fija el **juez**, oyendo al defensor de obras pías y a los herederos, según la naturaleza del objeto y las fuerzas de la parte de libre disposición. Somarriva: al menos el asignatario debe estar determinado.`,
'Naranjo p. 57 · art. 1066');

K('s05','s','¿Qué disposiciones testamentarias prohíbe la ley para proteger la voluntad libre del testador?',
`1. **Captatorias** (art. 1059): asignar bienes a condición de que el asignatario deje por testamento parte de los suyos.
2. Voluntad no manifestada claramente: no vale la disposición dada a conocer solo por **sí o no** o por una **señal** de afirmación o negación contestando una pregunta (art. **1060**; también art. 1005 Nº 5).
3. Elección del asignatario por el **puro arbitrio ajeno** (art. **1063**), aplicación de la indelegabilidad (art. 1004).
4. Disposiciones a favor del **notario, testigos** y sus parientes (art. 1061).
5. Asignación cuyo cumplimiento se deja **al arbitrio** de un heredero o legatario (art. **1067**): si a este le **aprovecha rehusarla**, debe cumplirla salvo justo motivo; si no le aprovecha, no necesita justificar. El provecho de su ascendiente, descendiente, cónyuge, hermano o cuñado se reputa provecho suyo. Somarriva: ante el conflicto con el 1063, prima el 1063.`,
'Naranjo p. 58 · Manual §125');

K('s06','s','¿Cómo se clasifican las asignaciones testamentarias?',
`1. Según sus **efectos**: **puras y simples** o **sujetas a modalidad** (condición, plazo o modo).
2. Según su **objeto**: a **título universal** (herencias) o a **título singular** (legados).
3. Según su **obligatoriedad**: **voluntarias** (el testador es libre de hacerlas) o **forzosas** (está obligado a hacerlas y la ley las suple aun en perjuicio de sus disposiciones expresas).`,
'Naranjo p. 59 · Manual §126');

/* ===== MODALIDADES ===== */
K('s07','s','¿Qué es una asignación condicional y qué reglas la rigen?',
`Art. **1070**: aquella que depende de una **condición**, es decir, de un suceso **futuro e incierto**, de manera que, según la intención del testador, no valga la asignación si el suceso positivo no acaece o si acaece el negativo.
Se rige por las reglas de las **obligaciones condicionales** (art. 1493), con las excepciones del título de las asignaciones, y por las de la **propiedad fiduciaria** si establece un fideicomiso (art. 1079).
La muerte no es condición (es cierta): de ahí la diferencia entre plazo y condición.`,
'Naranjo p. 59 · Manual §128 · art. 1070');

K('s08','s','¿Qué ocurre si la condición consiste en un hecho presente o pasado (arts. 1071 y 1072)?',
`Art. **1071**: no suspende el cumplimiento. **Si existe o ha existido**, se mira **como no escrita**; si **no existe ni ha existido**, **no vale** la disposición. Pasado, presente y futuro se miran respecto del **momento de testar**.
Art. **1072**: si se impone como para tiempo futuro un hecho que ya ocurrió en vida del testador:
- lo **supo** y el hecho **puede repetirse** → se presume que exige su **repetición**;
- lo **supo** y el hecho **no puede repetirse** → la condición se mira **cumplida**;
- **no lo supo** → se mira **cumplida**, cualquiera sea la naturaleza del hecho.`,
'Naranjo pp. 59–60 · arts. 1071, 1072');

K('s09','s','¿Qué condiciones testamentarias relativas al matrimonio son válidas y cuáles no?',
`- **No contraer matrimonio**: se tiene **por no escrita**, salvo que se limite a no contraerlo **antes de los 18 años** o menos (art. **1074**).
- **Permanecer en viudedad**: se tiene **por no puesta**, salvo que el asignatario tenga **hijos del anterior matrimonio** al tiempo de deferírsele (art. **1075**).
- Proveer a la **subsistencia** de alguien mientras permanezca soltero o viudo (usufructo, uso, habitación o pensión) **vale** (art. **1076**).
- **Casarse o no casarse con persona determinada**, y **abrazar un estado o profesión** permitido por la ley, aunque sea incompatible con el matrimonio, **valen** (art. **1077**).
Fundamento: el interés en la libre constitución de la familia.`,
'Naranjo p. 60 · arts. 1074–1077');

K('s10','s','¿Qué efecto tiene la condición de no impugnar el testamento (art. 1073)?',
`"La condición de no impugnar el testamento, impuesta a un asignatario, **no se extiende a las demandas de nulidad por algún defecto en su forma**."
El legislador ampara las **solemnidades**: el asignatario puede demandar la nulidad formal sin perder su asignación.`,
'Naranjo p. 60 · art. 1073');

K('s11','s','¿Qué efectos produce la asignación bajo condición suspensiva según su estado?',
`**Pendiente** (art. **1078**): no confiere derecho alguno, salvo **implorar providencias conservativas**. Consecuencias:
- el asignatario debe **existir al cumplirse** la condición (art. 962 inc. 2º);
- la **delación** se produce al cumplirse (art. 956);
- si muere antes, **no transmite** nada (art. 1078 inc. 2º; a diferencia del acreedor condicional, art. 1492);
- **no puede pedir la partición** (art. 1319); los demás pueden hacerla asegurándole su porción.
**Cumplida**: nace el derecho, pero **sin los frutos** del tiempo intermedio, salvo que el testador los conceda (art. 1078 inc. final): la condición no opera retroactivamente en esto.
**Fallida**: se extingue la expectativa; se alzan las medidas conservativas.`,
'Naranjo pp. 60–61 · art. 1078');

K('s12','s','¿Qué efectos produce la asignación bajo condición resolutoria?',
`- **Pendiente**: el asignatario es **propietario** de lo asignado y puede ejercer sus derechos (con limitaciones semejantes a las del propietario fiduciario).
- **Fallida**: su dominio se **consolida**; pasa a ser puro y simple.
- **Cumplida**: se **extingue** la asignación; debe restituir lo recibido, pero **conserva los frutos** salvo que el testador o la ley dispongan otra cosa. Las enajenaciones se rigen por los arts. **1490 y 1491**.
La condición resolutoria **no posterga la delación**.`,
'Naranjo p. 60 · Manual §128');

K('s13','s','¿Cómo se clasifican las asignaciones a día según su certidumbre y determinación (art. 1081)?',
`- **Certidumbre**: si es seguro que el día llegará. **Determinación**: si se sabe cuándo.
1. **Cierto y determinado**: llega y se sabe cuándo (una fecha).
2. **Cierto e indeterminado**: llega, no se sabe cuándo (la muerte de una persona).
3. **Incierto y determinado**: puede llegar o no, pero si llega se sabe cuándo (que X cumpla 25 años).
4. **Incierto e indeterminado**: no se sabe si llega ni cuándo.
Desde que hay **incertidumbre**, hay **condición**: la asignación "a día" puede ser a plazo o condicional.`,
'Naranjo p. 61 · art. 1081');

K('s14','s','¿Cuándo una asignación "desde tal día" es a plazo y cuándo condicional?',
`- **Desde día cierto y determinado**: **plazo**. Da la **propiedad desde la muerte** y el derecho de **enajenarla y transmitirla**, pero no de reclamarla antes del día (art. **1084**). Si el testador impone expresamente la condición de existir ese día, es condicional.
- **Desde día cierto e indeterminado**: **condicional** (envuelve la condición de existir el asignatario ese día); salvo que se sepa que existirá (un **establecimiento permanente**): entonces es plazo (art. **1085**).
- **Desde día incierto** (determinado o no): **siempre condicional** (art. **1086**).
Si el día llega antes de la muerte del testador, la asignación se entiende para después de sus días y se debe desde la apertura (art. **1082**).
Regla: las asignaciones **desde** tal día son **condicionales**, salvo las dos excepciones de plazo.`,
'Naranjo p. 62 · arts. 1082, 1084–1086');

K('s15','s','¿Qué son las asignaciones "hasta tal día" y por qué importa distinguirlas para el usufructo y el fideicomiso?',
`- **Hasta día cierto** (determinado o no) y **hasta día incierto pero determinado**: constituyen **usufructo** a favor del asignatario (art. **1087**, **1088**; la asignación por toda la vida del asignatario es usufructo).
- **Hasta día incierto e indeterminado**: es **condición** (art. **1083**).
Regla: las asignaciones **hasta** tal día son a **plazo** (usufructo), salvo la de día incierto e indeterminado.
**Importancia**: si hay **plazo** → **usufructo**; si hay **condición** → **fideicomiso**. La jurisprudencia atiende además a la **intención** del testador: si quiso dejar la propiedad, fideicomiso; si el goce, usufructo.`,
'Naranjo p. 62 · arts. 1083, 1087, 1088');

K('s16','s','¿Qué es una asignación modal y qué características tiene?',
`Art. **1089**: si se asigna algo a una persona **para que lo tenga por suyo** con la obligación de aplicarlo a un **fin especial** (hacer ciertas obras o sujetarse a ciertas cargas), esta aplicación es un **modo** y no una condición suspensiva: **no suspende la adquisición**.
Modo: carga impuesta a quien recibe una liberalidad; para la doctrina es una **obligación**.
Características:
- Puede afectar una **herencia o un legado**.
- El asignatario modal **adquiere a la muerte** del causante; la delación es a la apertura.
- No se exige **caución** de restitución (art. **1091**).
- La obligación modal es **transmisible**, salvo que solo el asignatario pueda ejecutarla (art. **1095**).
- Intervienen el **asignatario modal** y el **beneficiario del modo**; según la CS, los requisitos para suceder solo se exigen al asignatario (riesgo de fraude por interpósita persona, art. 966).`,
'Naranjo pp. 62–63 · Manual §130 · arts. 1089–1095');

K('s17','s','¿Qué es la cláusula resolutoria en las asignaciones modales y qué efectos tiene?',
`Art. **1090**: la que impone la obligación de **restituir la cosa y los frutos** si no se cumple el modo. **No se presume**: no se entiende envuelta si el testador no la expresa (diferencia con la condición resolutoria tácita del art. 1489). Excepción: se subentiende cuando el asignatario es un **banco**.
Incumplido el modo, el beneficiario puede pedir el **cumplimiento forzado** o, si hay cláusula, la **resolución**.
Efectos de la resolución (art. **1096**): el asignatario restituye la cosa **y los frutos**; se entrega al beneficiario del modo una **suma proporcionada** al objeto y el resto **acrece a la herencia**, sin que el asignatario modal goce de este beneficio.
Pueden pedirla el beneficiario y los demás asignatarios. Prescribe en **5 años** desde el incumplimiento (art. 2515).`,
'Naranjo p. 63 · arts. 1090, 1096');

K('s18','s','¿Cómo debe cumplirse el modo y cuándo puede dejar de cumplirse?',
`Si el testador no determina suficientemente el **tiempo o la forma**, los fija el **juez**, consultando su voluntad y dejando al asignatario modal un beneficio de **al menos la quinta parte** del valor de la cosa (art. **1094**).
Puede dejar de cumplirse:
1. **Modo imposible o ilícito** (art. **1093**): si es por naturaleza imposible, inductivo a hecho ilegal o inmoral, o ininteligible, **no vale la disposición**; si solo es imposible en la **forma especial** prescrita, sin culpa del asignatario, puede cumplirse en otra **análoga** aprobada por el juez; si se vuelve imposible después sin su culpa, subsiste la asignación sin el gravamen.
2. **Modo en beneficio exclusivo del asignatario** (art. **1092**): no impone obligación, salvo cláusula resolutoria.`,
'Naranjo pp. 63–64 · arts. 1092–1094');

/* ===== HERENCIAS ===== */
K('s19','s','¿Qué características tienen las asignaciones a título universal?',
`Art. **1097**: los asignatarios a título universal, con cualesquiera palabras que se les llame, son **herederos**: representan la persona del testador para sucederle en todos sus derechos y obligaciones transmisibles, y están obligados a las **cargas testamentarias**.
1. Pueden ser **testamentarias o abintestato**.
2. Adquieren la herencia y la **posesión legal** a la muerte.
3. Pueden adquirir **personalmente o por transmisión o representación**.
4. Tienen las acciones de **petición de herencia** y, si son legitimarios, de **reforma**.
5. Si son varios, se forma una **indivisión** que termina por la **partición**.
6. Suceden en el **activo y el pasivo**.
7. **Representan** al causante: les alcanza la **cosa juzgada** de los juicios del causante; no pueden alegar la nulidad absoluta si el causante no podía (art. 1683); contra ellos procede la acción **personal** hipotecaria, no la de desposeimiento.`,
'Naranjo pp. 64–65 · art. 1097');

K('s20','s','¿Cómo se clasifican los herederos?',
`1. **Universales**, **de cuota** o **del remanente** (según el llamamiento).
2. **Testamentarios** o **abintestato** (según los nombre el testador o la ley).
3. **Voluntarios** (libremente elegidos) o **forzosos** (los **legitimarios**, cuyos derechos el testador debe respetar).
No es lo mismo heredero forzoso que abintestato: el Fisco es heredero abintestato pero no forzoso.`,
'Naranjo pp. 65, 67');

K('s21','s','Distinga heredero universal y heredero de cuota. ¿Por qué importa?',
`- **Universal** (art. **1098**): llamado **sin designación de cuota** ("Sea Fulano mi heredero", "Dejo mis bienes a Fulano"). Puede haber **varios**; dividen por partes iguales. Si concurre con herederos de cuota, lleva la cuota que **complete la unidad**.
- **De cuota**: llamado a una **porción determinada** (un tercio, la mitad).
Se distingue por la **forma del llamamiento**, no por lo que en definitiva lleva (un heredero de cuota puede llevar más). El estatuto es el mismo, con una diferencia: el **derecho de acrecimiento** solo opera entre **herederos universales**. Si falta un heredero de cuota, su parte va a los herederos **abintestato** (el testador limitó claramente su parte).`,
'Naranjo pp. 65–66 · art. 1098');

K('s22','s','¿Qué es el heredero del remanente y qué clases hay (arts. 1099 y 1100)?',
`El llamado por el testador o la ley a **lo que queda** después de cumplidas las disposiciones testamentarias. No es una especie aparte: será universal o de cuota.
1. **Testamentario universal**: solo hay legados y se dispone del resto ("mi casa a X, el resto a Z") (art. 1099).
2. **Testamentario de cuota**: hay asignaciones de cuota y se deja el resto ("1/3 a Pedro, el resto a Juan") (art. 1099).
3. **Abintestato universal**: el testamento solo contiene legados y nada dice del resto: los herederos abintestato son **herederos universales** (art. 1100 inc. 2º).
4. **Abintestato de cuota**: solo hay herederos de cuota que no completan la unidad: los abintestato son herederos del **remanente** (art. 1100 inc. 1º).`,
'Naranjo p. 66 · arts. 1099, 1100');

K('s23','s','¿Qué ocurre si las cuotas designadas completan o exceden la unidad y hay además otro heredero (arts. 1101 y 1102)?',
`- Si el otro es **heredero del remanente**: **nada tendrá** (art. 1101).
- Si es **heredero universal**: se entiende instituido en una cuota cuyo **numerador es 1** y cuyo **denominador es el número total de herederos** (art. 1101). Luego se reducen todas las cuotas a **común denominador**; la herencia se representa por la **suma de los numeradores** y cada cuota efectiva por su numerador (art. 1102).
Ejemplo: 1/2 a A, 1/3 a B, 1/4 a C y D universal → D = 1/4; en doceavos: 6 + 4 + 3 + 3 = 16 → A **6/16**, B **4/16**, C **3/16**, D **3/16**.
Todo sin perjuicio de la **acción de reforma** (art. 1103).`,
'Naranjo pp. 66–67 · Manual §133 · arts. 1101–1103');

/* ===== LEGADOS ===== */
K('s24','s','¿Qué características tienen los legados y los legatarios?',
`1. El legatario **no representa** al causante; no tiene más derechos ni cargas que los que se le confieran o impongan (art. **1104**).
2. Sucede en **bienes determinados** (especie o género).
3. Los legados son **siempre testamentarios**: no hay legatarios abintestato ni representación a su favor.
4. Pueden adquirirse por **transmisión** (art. 957), pero el **transmitido** debe ser **heredero**: un legatario no adquiere por transmisión.
5. Son una **carga testamentaria** (art. 1360) y se pagan con la parte de **libre disposición**.
6. Solo pueden legarse, por regla general, cosas del causante.
7. Hay un sistema de **preferencias** para su pago.`,
'Naranjo p. 67 · Manual §134 · art. 1104');

K('s25','s','¿Qué posesión tiene el legatario y qué inscripciones requiere el legado de inmueble?',
`No hay **posesión legal ni efectiva** de los legados (arts. 688 y 722 solo se refieren a la herencia): solo la posesión del **art. 700** (corpus y animus), y solo en los legados de **especie**.
El legado de **inmueble** **no requiere inscripción especial de herencia**: no forma parte de la indivisión, sale de la herencia a la muerte. Para conservar la historia de la propiedad raíz se inscribe **directamente a nombre del legatario** (en la práctica, con una escritura de **entrega** del legado). Esa inscripción **no es tradición**: el legatario adquirió por sucesión. Mujica: ni siquiera es necesaria (basta inscribir testamento y posesión efectiva).`,
'Naranjo p. 68');

K('s26','s','Distinga el legado de especie y el legado de género en cuanto a su adquisición, frutos y acciones.',
`**Especie o cuerpo cierto** (determinación máxima):
- Se adquiere el **dominio a la muerte** del causante, en el estado en que exista entonces, con sus utensilios (art. 1118) y cargas reales (art. 1125).
- **Frutos** desde la muerte (art. 1338 Nº 1).
- Si no se le entrega, tiene **acción reivindicatoria**; su derecho se extingue cuando otro adquiere por prescripción.
**Género**:
- A la muerte solo adquiere un **crédito** (derecho personal) contra los obligados; se hace dueño por **tradición**. Si vende su asignación, cede un crédito (notificación al deudor).
- **Frutos** desde que el obligado se constituye en **mora** (art. 1338 Nº 2); el plazo del testador no es "estipulación" (art. 1551 Nº 1): requiere interpelación judicial.
- Solo tiene **acción personal**.`,
'Naranjo pp. 68–69 · Manual §136');

K('s27','s','¿Qué cosas pueden y no pueden legarse?',
`**Pueden**: cosas **corporales e incorporales** (derechos y acciones, art. 1127); **muebles e inmuebles**; **cosas futuras** si llegan a existir (art. 1113); **cuotas**; universalidades (un establecimiento de comercio); excepcionalmente **cosas ajenas**.
**No pueden** (art. **1105**): cosas **incapaces de apropiación** (art. 585); cosas de **propiedad nacional o municipal y de uso público**; las que **forman parte de un edificio** y no pueden separarse sin deteriorarlo (salvo que la causa cese antes de deferirse); las del **culto divino** (aunque pueden legarse los derechos de particulares sobre ellas). Además: cosas de objeto ilícito y el usufructo, uso o habitación del causante (se extinguen con su muerte).`,
'Naranjo p. 69 · Manual §135 · art. 1105');

K('s28','s','¿Cuándo vale el legado de cosa ajena?',
`Regla (art. **1107**): el legado de **especie** que no es del testador ni del asignatario obligado a darla es **nulo**. Excepciones:
1. Que del testamento aparezca que el testador **sabía** que la cosa no era suya o del asignatario.
2. Que se legue a un **descendiente, ascendiente o cónyuge** del testador.
En ambos casos el obligado debe **adquirir** la cosa y, si no puede o el dueño pide un precio excesivo, dar su **justo precio** (art. 1106).
Además: si la cosa pasó al dominio del testador o del obligado **antes de la muerte**, se debe el legado (art. **1108**); si el obligado la adquiere **después**, la debe al legatario, quien la reclama restituyendo lo recibido (art. **1109**).
El legado de una especie de la **sociedad conyugal** se rige por el art. 1743.`,
'Naranjo p. 70 · arts. 1106–1109');

K('s29','s','¿Qué reglas determinan qué se debe cuando el legado no está bien determinado?',
`- **Especie con lugar designado** que no está allí: se debe si se encuentra en otra parte; si no se encuentra en ninguna, se debe una de **mediana calidad** del mismo género, pero **solo** a ascendientes, descendientes o cónyuge (art. 1111).
- **Cosa fungible**: si no se determina su cantidad de algún modo, **no vale** (art. 1112); con lugar, se debe lo que allí haya (hasta la cantidad fijada); si no hay nada, nada se debe, salvo las limitaciones del artículo.
- **Una especie entre muchas** del patrimonio: se debe una de **mediana calidad o valor** (art. 1114); lo mismo en los legados de género no limitados al patrimonio (art. 1115).
- **Cosa entre varias que creyó tener** y dejó una: se debe esa; si no dejó ninguna, solo vale para ascendientes, descendientes o cónyuge (art. 1116).
- **Elección** concedida al obligado, al legatario o a un tercero (art. 1117).`,
'Naranjo p. 69 · arts. 1111–1117');

K('s30','s','¿Qué ocurre con el legado de una especie gravada con prenda o hipoteca, o con cláusula de no enajenar?',
`**Prenda o hipoteca**: no extingue el legado, pero lo **grava** (art. 1135 inc. 3º); la especie pasa con sus cargas reales (art. 1125).
- Si el testador **quiso gravar** al legatario (expresa o tácitamente, constituyendo la garantía después del legado): este soporta el pago sin repetición.
- Si no: y la garantía cauciona una **deuda del causante**, el legatario que paga se **subroga** contra los herederos (art. 1366); si cauciona una deuda de **un tercero**, solo puede dirigirse contra ese deudor (art. 2429).
**Cláusula de no enajenar** (art. **1126**): si la enajenación no compromete ningún derecho de tercero, se tiene **por no escrita**.`,
'Naranjo p. 70 · arts. 1125, 1126, 1135, 1366');

K('s31','s','Explique el legado de crédito, de condonación y de cosa empeñada al deudor.',
`- **Legado de crédito** (art. **1127**): por legar el título se entiende legado el crédito. Somarriva: notificado el deudor, debe pagar al legatario (aplicación analógica de la cesión). Se **revoca tácitamente** si el testador cobra o recibe el pago; si es parcial, subsiste en lo no pagado.
- **Legado de condonación** (art. **1129**): si después de condonar el testador **demanda** al deudor o **acepta el pago**, el deudor no puede aprovecharse de la condonación; si se pagó sin noticia del testador, el legatario reclama lo pagado. Sin determinar suma, solo comprende las deudas existentes a la **fecha del testamento** (art. 1130).
- **Cosa empeñada legada al deudor** (art. **1128**): no se extingue la deuda, sino el **derecho de prenda**, salvo que conste la voluntad de extinguir la deuda.`,
'Naranjo pp. 70–71 · arts. 1127–1130');

K('s32','s','Explique el legado de confesión de deuda, el legado al acreedor y el legado en pago de lo no debido.',
`- **Confesión de deuda** (art. **1133**): si **no hay principio de prueba por escrito**, se tiene como **legado gratuito** (se paga con la libre disposición y paga impuesto); si lo hay, es una **deuda hereditaria** (baja general). Evita burlar las asignaciones forzosas.
- **Legado a un acreedor** (art. **1131**): no se entiende a cuenta de su crédito, salvo que se exprese o aparezca claramente esa intención; en tal caso, el acreedor elige cobrar en los términos de la deuda o del testamento.
- **Pago de lo no debido** (art. **1132**): si el testador manda pagar lo que **cree deber y no debe**, la disposición se tiene **por no escrita**; si manda pagar más de lo debido, el exceso no se debe salvo intención de donarlo.`,
'Naranjo p. 71 · arts. 1131–1133');

K('s33','s','¿Cómo se determina el legado de alimentos voluntarios (art. 1134)?',
`Si se legan alimentos **voluntarios** sin determinar forma y cuantía, se deben en la forma y cuantía en que el testador **acostumbraba suministrarlos**; a falta de ella, según la **necesidad** del legatario, sus **relaciones** con el testador y las **fuerzas** de la parte de libre disposición.
Si no se fija su duración, se entienden por **toda la vida** del legatario.
La pensión anual para la **educación** dura hasta que cumpla **18 años** y cesa si muere antes.
(Los alimentos voluntarios no son asignación forzosa: se imputan a la libre disposición, art. 1171.)`,
'Naranjo p. 71 · art. 1134');

K('s34','s','¿Cómo se extinguen los legados y con qué parte de la herencia se pagan?',
`**Extinción** (art. **1135**):
1. **Revocación** del testamento o del legado.
2. **Enajenación** de la especie legada por acto entre vivos (revocación tácita): no revive aunque la enajenación sea nula o la cosa vuelva al testador.
3. **Alteración sustancial** de la cosa mueble (de la madera hace un carro).
4. **Destrucción** de la especie.
5. Formas especiales: legado de crédito (pago) y de condonación (demanda o aceptación del pago).
**Pago**: con la parte de **libre disposición**: el **100%** si no hay legitimarios; la **cuarta** de libre disposición si los hay (art. 1184).`,
'Naranjo p. 72 · Manual §138 · art. 1135');

/* ===== DONACIONES REVOCABLES ===== */
K('y01','y','Distinga donación revocable e irrevocable. ¿Por qué se regulan en el Libro III?',
`- **Revocable** o por causa de muerte: la que el donante puede **revocar a su arbitrio** (art. **1136**). Es en el fondo un **testamento** (art. 1000).
- **Irrevocable** o entre vivos: acto por el cual una persona **transfiere gratuita e irrevocablemente** una parte de sus bienes a otra que la **acepta** (art. **1386**). Es un **contrato**.
Se regulan en el Libro III por razón **histórica** (Código francés) y porque, como la sucesión, son títulos **gratuitos**.
Las revocables tienen escasa aplicación práctica: para favorecer a alguien basta un testamento o una donación irrevocable.`,
'Naranjo p. 72 · Manual §184 · arts. 1136, 1386');

K('y02','y','Defina la donación revocable y señale sus requisitos externos.',
`**Concepto**: acto jurídico unilateral por el cual una persona da o promete dar a otra una cosa o derecho **para después de su muerte**, conservando la facultad de **revocarlo** mientras viva.
**Solemnidades** (art. **1137**): puede otorgarse
a) con las solemnidades del **testamento**: se **confirma ipso jure** por la muerte del donante sin haberla revocado (art. 1144);
b) con las solemnidades de las **donaciones entre vivos**, reservándose el donante la facultad de revocar: para subsistir tras su muerte debe **confirmarse expresamente en un acto testamentario**, salvo que sea **entre cónyuges**.
Las donaciones de que no se otorgó instrumento valen como donaciones **entre vivos** en lo que fuere de derecho, salvo entre cónyuges.`,
'Naranjo p. 72 · Manual §186 · art. 1137');

K('y03','y','¿Qué régimen tienen las donaciones entre cónyuges?',
`Las donaciones entre cónyuges **valen como donaciones revocables** (art. **1138** inc. 2º) y pueden hacerse bajo la forma de los contratos entre vivos (art. 1000) sin necesidad de confirmación (art. 1137).
Se concluye que los cónyuges **no pueden celebrar donaciones irrevocables** entre sí (pueden celebrar los demás contratos no prohibidos).
Fundamento: proteger a los **terceros acreedores** (especialmente en sociedad conyugal) y, históricamente, los intereses de la mujer.`,
'Naranjo pp. 72–73 · Manual §186 · arts. 1000, 1137, 1138');

K('y04','y','¿Qué capacidad se exige en las donaciones revocables (art. 1138)?',
`"Son nulas las donaciones revocables de personas que **no pueden testar o donar entre vivos**. Son nulas asimismo las entre personas que **no pueden recibir asignaciones testamentarias o donaciones entre vivos** una de otra."
- **Doctrina mayoritaria**: **doble capacidad**: el donante debe poder testar **y** donar entre vivos; el donatario, recibir por testamento **y** por donación.
- **Somarriva** (minoritaria): según la forma usada (art. 1137) basta la capacidad de **una** de ellas; además el artículo usa la disyuntiva "o". Importa, p. ej., para el menor adulto (puede testar, no donar).`,
'Naranjo p. 73 · Manual §186 · art. 1138');

K('y05','y','¿Qué efectos producen las donaciones revocables?',
`- **A título singular** (art. **1141**): son **legados anticipados** y se rigen por las reglas de los legados. Recíprocamente, si el testador da en vida al legatario el **goce** de la cosa legada, el legado es una donación revocable.
- Si hubo **entrega**: el donatario adquiere los derechos y obligaciones de **usufructuario**, sin obligación de rendir caución salvo que la exija el donante (art. **1140**). Es un usufructo especial, revocable en cualquier momento.
- Las donaciones revocables y legados con goce entregado en vida **prefieren** a los demás legados cuando los bienes no alcanzan (art. 1141 inc. 3º).
- **A título universal** (art. **1142**): se miran como **institución de heredero** con efecto desde la muerte; el donatario puede ejercer el usufructo de las especies entregadas.`,
'Naranjo p. 73 · Manual §187 · arts. 1140–1142');

K('y06','y','¿Cuándo se confirman y cuándo se extinguen las donaciones revocables?',
`**Confirmación** (art. **1144**): se confirman y dan la **propiedad** por el mero hecho de morir el donante **sin haberlas revocado** y sin que sobrevenga al donatario incapacidad o indignidad; salvo las otorgadas con forma de entre vivos, que requieren **confirmación testamentaria** (art. 1137 inc. 2º).
**Extinción (caducidad)**:
1. **Revocación** expresa o tácita, como la de las herencias o legados (art. **1145**).
2. **Muerte del donatario** antes que el donante (art. **1143**).
3. **Incapacidad o indignidad** sobreviniente del donatario (art. 1144).
4. Falta de confirmación de la otorgada como entre vivos.
Están sujetas a las **asignaciones forzosas** (art. **1146**).`,
'Naranjo p. 74 · Manual §188 · arts. 1143–1146');

/* ===== ACRECIMIENTO ===== */
K('x01','x','¿Cuáles son los cuatro derechos que concurren en materia sucesoria y dónde operan?',
`1. **Transmisión** (art. 957): aplicación general (testada e intestada).
2. **Representación** (art. 984): propio de la sucesión **intestada** (y de la mitad legitimaria, art. 1183).
3. **Acrecimiento** (arts. 1147 y ss.): sucesión **testada**.
4. **Sustitución** (arts. 1156 y ss.): sucesión **testada**.`,
'Naranjo p. 74 · Manual §139');

K('x02','x','Defina el derecho de acrecimiento y explique por qué es una excepción.',
`Derecho en virtud del cual, existiendo **dos o más asignatarios llamados a un mismo objeto sin designación de cuota**, la parte del asignatario que **falta** se junta y aumenta la de los otros (arts. **1147** y **1148**).
Art. 1147: "Destinado un mismo objeto a dos o más asignatarios, la porción de uno de ellos, que por falta de éste se junta a las porciones de los otros, se dice acrecer a ellas."
Es **excepción**: la regla es que la falta de un asignatario beneficia a quienes la asignación **perjudicaba** (p. ej., el heredero que debía pagar el legado) o a los **herederos abintestato**.
**Fundamento**: interpretación de la **voluntad presunta** del testador, que al llamar a varios a una cosa sin cuotas quiso beneficiarlos con el todo.`,
'Naranjo pp. 74–75 · Manual §140');

K('x03','x','¿Cuáles son los requisitos del derecho de acrecimiento?',
`1. Que se trate de una sucesión **testamentaria**.
2. Que existan **dos o más asignatarios**.
3. Que sean llamados a un **mismo objeto** (toda la herencia, una cuota, uno o más bienes o una cuota de un bien; opera en **herencias y legados**).
4. Que sean llamados **sin designación de cuota** (art. 1148).
5. Que **falte** algún asignatario.
6. Que el testador **no haya designado sustituto**.
7. Que el testador **no haya prohibido** el acrecimiento (art. **1155**).`,
'Naranjo pp. 75–77 · Manual §141');

K('x04','x','¿Por qué no hay acrecimiento entre asignatarios de cuota? ¿Cuáles son las excepciones aparentes del art. 1148?',
`Si el testador **asignó cuotas**, limitó claramente el beneficio de cada uno: "Dejo 1/3 a Pedro, 1/3 a Juan y 1/3 a Diego"; si falta Diego, su tercio va a los **herederos abintestato**. Art. 1148: cada parte o cuota se considera un **objeto separado**.
Excepciones **aparentes** (Somarriva, la profesora):
a) Asignatarios llamados **por partes iguales**: "dejo mis bienes por iguales partes a Juan, Diego y Pedro" → **hay** acrecimiento (art. 1148 inc. 2º), aunque la diferencia sea solo de palabras.
b) Coasignatarios de **una misma cuota** sin determinar la parte de cada uno: "1/3 a A, 1/3 a B y el resto a C y D" → hay acrecimiento entre C y D.
En ninguno hay realmente llamamiento con designación de cuota.`,
'Naranjo p. 75 · Manual §145 · art. 1148');

K('x05','x','¿Qué clases de conjunción existen y en cuáles opera el acrecimiento?',
`- **Verbal o labial**: misma cláusula, **distintos objetos** ("la casa X a Juan y la casa Y a Pedro"), o mismo objeto con cuotas → **no** hay acrecimiento.
- **Real**: **mismo objeto** en **cláusulas distintas** del mismo testamento → **sí** hay (art. 1149 inc. 1º).
- **Mixta**: mismo objeto en la **misma cláusula** ("lego mi auto a Pedro y a Juan") → **sí** hay.
Si el llamamiento está en **dos testamentos distintos**, el anterior se presume **revocado** en lo que no sea común con el posterior (art. 1149 inc. 2º).
Art. **1150**: los conjuntos se llaman con la copulativa "**y**" o con una **denominación colectiva** ("los hijos de Pedro"); se reputan **una sola persona** para concurrir con otros, y la persona colectiva solo falta cuando **faltan todos**.`,
'Naranjo p. 76 · Manual §145 · arts. 1149, 1150');

K('x06','x','¿Cuándo "falta" un asignatario para que opere el acrecimiento?',
`El Código no lo dice para el acrecimiento; se aplica por analogía el art. **1156** (sustitución). Falta cuando:
1. **Fallece antes** que el testador.
2. Es **incapaz o indigno**.
3. **Repudia**.
4. Siendo asignatario bajo **condición suspensiva**, esta **falla**.
Si fallece **después** del causante sin pronunciarse, no hay acrecimiento sino **transmisión**: "El derecho de transmisión establecido por el artículo 957, excluye el derecho de acrecer" (art. **1153**).`,
'Naranjo p. 76 · Manual §146');

K('x07','x','¿Qué características y efectos tiene el derecho de acrecimiento?',
`**Características**:
1. **Accesorio**: se puede conservar la porción propia y **repudiar** la que acrece, pero **no** repudiar la propia y aceptar la que acrece (art. **1151**).
2. **Renunciable** (art. 12).
3. **Transferible**: pasa al **cesionario** de derechos hereditarios, salvo pacto (art. 1910).
**Efectos**:
- La porción del que falta se **agrega** a las de los otros.
- Lleva consigo **todos sus gravámenes**, excepto los que suponen una **calidad o aptitud personal** del que falta (arts. **1152**, 1068).
- En el **usufructo, uso, habitación o pensión periódica**, los coasignatarios conservan el derecho de acrecer **mientras gozan** de ellos (art. **1154**): no pasa al nudo propietario hasta que falte el último.`,
'Naranjo p. 77 · Manual §149–150');

K('x08','x','¿Qué prevalece en la mitad legitimaria: la representación o el acrecimiento?',
`La **representación**. Los legitimarios "concurren, y son excluidos y representados" según las reglas de la intestada (art. 1183), y el art. **1190** solo hace acrecer la legítima del que falta a los demás legitimarios si **no tiene descendencia con derecho a representarle**.
Ejemplo: mitad legitimaria para Pedro, Juan y Diego; Diego muere antes que el padre dejando dos hijos: su porción la llevan **sus hijos por representación**, no acrece a Pedro y Juan.
Por la ficción de la representación, el legitimario **no falta** (lo representan sus descendientes); por eso tampoco opera la **sustitución** en la mitad legitimaria.`,
'Naranjo pp. 76–77, 80 · art. 1190');

/* ===== SUSTITUCIÓN ===== */
K('x09','x','¿Qué es la sustitución y qué clases hay (art. 1156)?',
`Permite al testador designar a quién o quiénes ocuparán el lugar del asignatario.
- **Vulgar**: se nombra un asignatario para que ocupe el lugar de otro que **no acepte**, o que **antes de deferírsele** la asignación **llegue a faltar** por fallecimiento u otra causa que extinga su derecho eventual. ("Dejo mi casa a X y, si no puede llevarla, a Y.")
- **Fideicomisaria** (art. **1164**): se llama a un **fideicomisario** que, en el evento de una **condición**, se hace dueño absoluto de lo que otra persona poseía en **propiedad fiduciaria**. ("Lego mi casa a X, que pasará a Y si este se recibe de abogado.") Se rige por el título de la propiedad fiduciaria.`,
'Naranjo p. 78 · Manual §151–152 · arts. 1156, 1164');

K('x10','x','¿Cuáles son los requisitos de la sustitución vulgar?',
`1. Sucesión **testamentaria** (ubicación y necesidad de voluntad expresa).
2. Sustitución **expresa**: no hay sustituciones tácitas ni legales. Los descendientes del asignatario descendiente **no** se entienden sustituidos, salvo voluntad expresa (art. **1162**).
3. Que **falte** el asignatario: no acepta, fallece **antes** que el causante, es incapaz o indigno, falla la condición suspensiva o cualquier causa que extinga su derecho eventual. No se entiende faltar el que **una vez aceptó**, salvo que se invalide la aceptación (art. 1156 inc. 2º).
Si se designa sustituto para **un** caso de falta, se entiende para **todos**, salvo voluntad contraria (art. **1157**).
Si el asignatario muere **después** del causante, opera la **transmisión**, que excluye la sustitución (art. 1163).`,
'Naranjo pp. 78–79 · Manual §153 · arts. 1156, 1157, 1162');

K('x11','x','¿En qué formas puede designarse sustituto?',
`- **De varios grados** (art. **1158**): se nombra un sustituto al asignatario directo y otro al primer sustituto (directa o indirecta).
- **Uno a muchos y muchos a uno** (art. **1159**).
- Si se sustituyen **recíprocamente** tres o más asignatarios y falta uno, su porción se divide entre los otros **a prorrata** de sus asignaciones (art. **1160**).
- El **sustituto de un sustituto** se entiende llamado en los mismos casos y con las mismas cargas que este, salvo disposición del testador (art. **1161**).`,
'Naranjo p. 78 · Manual §154 · arts. 1158–1161');

K('x12','x','¿Qué reglas especiales tiene la sustitución fideicomisaria?',
`- **No se presume**: en caso de duda, la sustitución se entiende **vulgar** (art. **1166**: solo es fideicomisaria cuando el tenor excluye manifiestamente la vulgar).
- Si para el caso de faltar el fideicomisario antes de cumplirse la condición se le nombran sustitutos, estas sustituciones se entienden **vulgares** (art. **1165**).
- Ni el fideicomisario ni sus sustitutos **transmiten** su expectativa si faltan (art. 1165): se prohíben los **fideicomisos sucesivos** (art. 745).`,
'Naranjo p. 79 · Manual §155 · arts. 1165, 1166');

K('x13','x','¿Cómo concurren entre sí los derechos de transmisión, representación, acrecimiento y sustitución?',
`1. La **transmisión excluye** al acrecimiento y a la sustitución; la **sustitución excluye** al acrecimiento (arts. **1153** y **1163**). Razón: acrecimiento y sustitución suponen que el asignatario falte **antes** de la muerte del causante; si muere después sin pronunciarse, transmite. Y si hay sustituto, el asignatario jurídicamente no falta.
2. **Transmisión y representación no concurren**: la transmisión exige que el transmisor muera **después** del causante; la representación supone que el representado falte **al abrirse** la sucesión (y la transmisión solo opera por fallecimiento).
3. **Representación** frente a acrecimiento y sustitución: en principio no chocan (intestada vs. testada); en la **mitad legitimaria** prima la **representación**.`,
'Naranjo pp. 79–80 · Manual §156');

/* ===== ASIGNACIONES FORZOSAS ===== */
K('z01','z','¿Qué principios entran en pugna al establecer asignaciones forzosas y qué sistema sigue Chile?',
`Se oponen la **libertad de testar** (correlato de la libertad de disponer entre vivos) y la **sucesión familiar** o protección de la familia.
- **Derecho anglosajón**: libertad de testar **casi absoluta**.
- **Chile**: libertad **restringida**. Bello era partidario de la libertad, pero se conservó la tradición española. Con legitimarios, el causante solo dispone libremente de la **cuarta parte**; las otras tres cuartas pasan por ley a los asignatarios forzosos. Solo quien **no tiene asignatarios forzosos** dispone libremente de todo.
La profesora destaca que el sistema protege el **interés familiar**: la familia contribuyó a formar el patrimonio.`,
'Naranjo pp. 81–82 · Manual §157');

K('z02','z','Defina las asignaciones forzosas y enumérelas (art. 1167).',
`"Asignaciones forzosas son las que el testador **es obligado a hacer**, y que **se suplen** cuando no las ha hecho, **aun con perjuicio de sus disposiciones testamentarias expresas**."
Son:
1. Los **alimentos** que se deben por ley a ciertas personas.
2. Las **legítimas**.
3. La **cuarta de mejoras** en la sucesión de los descendientes, de los ascendientes y del cónyuge (y conviviente civil).
Son una **limitación a la libertad de testar**. Si se vulneran, el testamento se **reforma**, no se anula.`,
'Naranjo p. 81 · Manual §158 · art. 1167');

K('z03','z','¿Se aplican las asignaciones forzosas en la sucesión intestada?',
`**Sí**. Del art. 1167 podría creerse que solo rigen en la testada, pero el legislador se refirió al testamento porque es el único caso en que pueden ser **desconocidas** por el causante.
Prueba: los legitimarios concurren, son excluidos y representados según la **intestada** (art. 1183), y el art. 988 se remite a la **legítima rigorosa** y a la **mitad legitimaria**.
**Excepción**: la **cuarta de mejoras**, que supone una declaración **expresa** del testador; sin ella, acrece a las legítimas (art. 1191).`,
'Naranjo p. 82 · Manual §159');

K('z04','z','¿Qué medios protegen las asignaciones forzosas?',
`**Directo**: la **acción de reforma del testamento** (art. **1216**).
**Indirectos**:
1. **Interdicción** por demencia o disipación (protege también a los futuros asignatarios).
2. **Insinuación** de las donaciones irrevocables (art. **1401**): el juez solo autoriza si el patrimonio del donante no perjudica a los asignatarios forzosos.
3. Límite a las **donaciones por causa de matrimonio** entre esposos: no más de la **cuarta parte** de los bienes que aporta el donante (art. **1788**).
4. **Acervos imaginarios** (arts. 1185–1187): el medio indirecto más eficaz.
5. **Prohibición de modalidades** en la legítima rigorosa (art. **1192**).
6. La **partición** hecha por el causante vale en cuanto no sea contraria a derecho ajeno (art. **1318**).
7. El testador puede **señalar** las especies con que se paga la legítima, pero **no tasarlas** (art. **1197**).
Otros: arts. 1103, 1104, 1146, 1363.`,
'Naranjo pp. 82–83 · Manual §160');

K('z05','z','¿En qué casos el asignatario forzoso pierde su asignación?',
`1. **Desheredamiento** del legitimario por causa legal (arts. 1207, 1208): "válvula de escape" frente a la falta de libertad de testar.
2. **Indignidad** del asignatario.
3. **Cónyuge** que dio lugar a la **separación judicial por su culpa** (arts. 994, 1182).
4. **Alimentos**: cesan por **injuria atroz** (arts. 324, 979).
5. **Ascendientes** cuya paternidad o maternidad fue **determinada judicialmente contra su oposición**, salvo restablecimiento (arts. 203, 1182).`,
'Naranjo p. 83 · Manual §161');

K('z06','z','¿Qué ley rige las asignaciones forzosas en el tiempo?',
`Art. **18 LERL**: las disposiciones testamentarias se rigen por la ley vigente al **fallecimiento** del testador; prevalecen sobre las leyes anteriores a su muerte las que reglan la **incapacidad o indignidad**, las **legítimas, mejoras**, porción conyugal y **desheredaciones**.
Por ello, las leyes que modifican las asignaciones forzosas rigen para todas las sucesiones que **se abran después** de su publicación (aunque el testamento sea anterior).`,
'Naranjo pp. 83–84');

K('z07','z','¿Qué son los alimentos forzosos y cómo se distinguen de los voluntarios?',
`Asignación forzosa del art. 1167 Nº 1: los **alimentos que se deben por ley** a ciertas personas (Título XVIII del Libro I, arts. 321 y ss.).
- **Forzosos**: el testador está obligado por ley; si no los asigna, la ley los suple.
- **Voluntarios**: los que el testador deja a quien no tiene derecho legal, o el **exceso** sobre lo debido: son un **legado** (art. 1134) y se imputan a la **libre disposición** (art. 1171). A ellos no se aplican las reglas de los alimentos legales (art. 337).`,
'Naranjo p. 84 · Manual §163 · arts. 1134, 1171');

K('z08','z','¿Quién soporta el pago de los alimentos forzosos (art. 1168)?',
`"Los alimentos que el difunto ha debido por ley a ciertas personas, **gravan la masa hereditaria**; menos cuando el testador haya impuesto esa obligación a uno o más partícipes de la sucesión."
- Regla: son **baja general** (art. 959 Nº 4); se separa un **capital** con cuyas rentas se pagan, antes de calcular legítimas. La obligación **no pasa** a los herederos como carga personal.
- Excepción: el testador la impone a un **partícipe**; deja de ser baja general. Si el gravado repudia, se aplica el art. 1068 (la asignación se defiere en último lugar al alimentario).
- Solo puede gravarse con ellos al asignatario de la **libre disposición** o al de **mejoras** si el alimentario es mejorero (art. 1195): no la legítima rigorosa (art. 1192).`,
'Naranjo p. 84 · Manual §164–165 · art. 1168');

K('z09','z','¿Cuándo los alimentos que debía el causante constituyen asignación forzosa?',
`1. Causante **condenado** por sentencia ejecutoriada (o transacción aprobada) a pagarlos: **sí**.
2. Demanda en vida y **sentencia posterior** a la muerte: **sí** (los alimentos se deben desde la primera demanda, art. 331; efecto declarativo).
3. Causante que los pagaba **voluntariamente** a quien tenía título legal, sin demanda: discutido. Naranjo (Somarriva) los considera forzosos; la **profesora** señala que la doctrina y la jurisprudencia se inclinan, aunque no unánimemente, por **no** calificarlos como forzosos.
4. Quien tenía título pero **no los recibía ni los demandó**: la tendencia jurisprudencial es **rechazar** la demanda contra los herederos (interpretación restrictiva).
Para la profesora, la obligación requiere **determinación en sentencia o transacción**.`,
'Naranjo p. 84 · Manual §163',
'Diferencia de fuentes en el caso 3: prima la posición del manual.');

K('z10','z','¿Cómo inciden las deudas hereditarias en los alimentos forzosos?',
`Art. **1170**: los asignatarios de alimentos **no están obligados a devolución alguna** por las deudas o cargas que graven el patrimonio, pero **pueden rebajarse los alimentos futuros** que parezcan **desproporcionados** a las fuerzas del patrimonio efectivo.
Art. 1363: los legados estrictamente alimenticios a que el testador es obligado por ley **contribuyen al último** al pago de las deudas.
**Impuesto**: las cantidades periódicas para alimentar a quienes el causante debía alimentar están **exentas** (art. 18 Nº 3 Ley 16.271); si la pensión parece excesiva, el SII puede pedir al juez que fije la parte exenta.`,
'Naranjo p. 84 · Manual §165 · arts. 1170, 1363');
