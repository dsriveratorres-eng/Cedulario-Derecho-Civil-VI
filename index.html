/* ===== LEGÍTIMAS ===== */
K('l01','l','Defina la legítima y señale la naturaleza de los legitimarios.',
`Art. **1181**: "Legítima es aquella **cuota** de los bienes de un difunto que la ley asigna a ciertas personas llamadas **legitimarios**." Inc. 2º: "Los legitimarios son por consiguiente **herederos**."
- Es la asignación forzosa **más importante**.
- Al ser una **cuota**, es asignación a **título universal**: el legitimario es siempre **heredero** (heredero forzoso).
- **Todo legitimario es asignatario forzoso, pero no todo asignatario forzoso es legitimario** (también lo son el alimentario y el mejorero).`,
'Naranjo p. 85 · Manual §166 · art. 1181');

K('l02','l','¿Quiénes son legitimarios (art. 1182)?',
`Enumeración **taxativa**:
1. Los **hijos**, personalmente o **representados** por su descendencia.
2. Los **ascendientes**.
3. El **cónyuge** sobreviviente.
Más el **conviviente civil** sobreviviente (art. 16 LAUC).
**No son legitimarios**:
- los ascendientes cuya paternidad o maternidad (que constituye o de la que **deriva** su parentesco) fue determinada judicialmente **contra la oposición** del padre o madre, salvo restablecimiento (art. 203): la sanción alcanza también a los abuelos, a diferencia del art. 994;
- el cónyuge que por su **culpa** dio ocasión a la **separación judicial** (solo la reconciliación lo restituye; si no, solo puede recibir con cargo a la libre disposición).
Tampoco el cónyuge **divorciado** ni aquel cuyo matrimonio se **anuló** (aun putativo).`,
'Naranjo p. 85 · Manual §167 · art. 1182');

K('l03','l','¿Cómo concurren los legitimarios a la legítima (art. 1183)?',
`"Los legitimarios concurren y son excluidos y representados según el orden y reglas de la **sucesión intestada**."
- Solo los **legitimarios** se reparten la mitad legitimaria; no concurren los demás herederos abintestato.
- Rige la **representación** en la mitad legitimaria.
- Las reglas de la intestada se aplican a la **mitad legitimaria** (y a la legítima efectiva), **no** a la cuarta de mejoras ni a la libre disposición, que se reparten según el testador.
Situaciones: descendientes excluyen a ascendientes y concurren con el cónyuge (doble de cada hijo; igual si es uno; mínimo 1/4 de la mitad legitimaria); sin descendencia, cónyuge 2/3 y ascendientes 1/3.`,
'Naranjo pp. 86–87 · Manual §167 · art. 1183');

K('l04','l','¿Cómo se divide la masa cuando hay legitimarios y cuando no (art. 1184)?',
`Previas las **deducciones** del art. 959 y las **agregaciones** (acervos imaginarios):
- **Con** descendientes, cónyuge (o conviviente civil) o ascendientes: la masa se divide en **cuatro partes**:
  - **dos** (la mitad) para las **legítimas rigorosas**;
  - **una cuarta** para las **mejoras** con que el difunto quiso favorecer a su cónyuge o a uno o más descendientes o ascendientes, **sean o no legitimarios**;
  - **una cuarta** de **libre disposición**.
- **Sin** legitimarios: la mitad restante (en verdad, el **100%**) es de libre disposición, salvo los alimentos forzosos.`,
'Naranjo p. 87 · art. 1184');

K('l05','l','¿Qué es la legítima rigorosa?',
`Art. **1184** inc. 1º: "La mitad de los bienes, previas las deducciones indicadas en el artículo 959, y las agregaciones que en seguida se expresan, se dividirá **por cabezas o estirpes** entre los respectivos legitimarios, según las reglas de la sucesión intestada; lo que cupiere a cada uno en esa división será su **legítima rigorosa**."
Es la parte que toca a cada legitimario en la **mitad legitimaria**. Se llama rigorosa por su **inviolabilidad**: es el mínimo que el testador no puede disminuir (Meza Barros).`,
'Naranjo p. 87 · Manual §170 · art. 1184');

K('l06','l','¿Cuáles son las características de la legítima rigorosa?',
`1. Es **asignación forzosa** (art. 1167). Es nulo el permiso de un legitimario para que el causante teste sin considerar su legítima (art. 1226 inc. 3º).
2. **No admite modalidades** ni gravámenes (art. **1192**).
3. El testador puede **señalar las especies** con que se paga, pero **no delegar** esa facultad ni **tasarlas** (art. **1197**).
4. Tiene **preferencia absoluta** de pago (arts. **1189, 1193, 1194**).
5. **Acrece** a las demás legítimas rigorosas cuando falta un legitimario sin representantes (art. **1190**).`,
'Naranjo pp. 87–88 · Manual §171');

K('l07','l','¿Qué dispone el art. 1192 y cuáles son sus excepciones?',
`"La legítima rigorosa **no es susceptible de condición, plazo, modo o gravamen alguno**." Sobre lo demás que se deje a los legitimarios, salvo lo dado por **donación entre vivos**, el testador puede imponer los gravámenes que quiera, sin perjuicio del art. 1195. Fundamento: su **inviolabilidad** (evitar que una modalidad haga ilusoria la legítima). La disposición que la contraríe es **nula**.
**Excepciones**:
1. **Ley General de Bancos** (art. 86 Nº 7): la legítima rigorosa de un **legitimario incapaz** puede quedar **administrada por un banco** durante la incapacidad.
2. **Art. 1337 regla 10ª**: la adjudicación preferente al cónyuge (o conviviente) y los derechos de **uso y habitación** sobre la vivienda familiar pueden, en los hechos, **gravar** la legítima de los hijos (parte de la doctrina).`,
'Naranjo pp. 87–88 · Manual §171 · art. 1192');

K('l08','l','¿Qué facultad da el art. 1197 al testador y cómo se concilia con el art. 1318?',
`Art. **1197**: "El que deba una legítima podrá en todo caso **señalar las especies** en que haya de hacerse su pago; pero **no podrá delegar** esta facultad a persona alguna, **ni tasar** los valores de dichas especies."
- Es facultad **personalísima**; no puede tasar para no burlar la legítima con una tasación excesiva.
- Los legitimarios siguen siendo **herederos**, no legatarios.
**Conflicto con el art. 1318** (el causante puede hacer la partición, que exige tasar): la doctrina (Somarriva, Elorriaga, Domínguez) entiende que el testador **sí puede tasar al hacer la partición**, siempre que no afecte las legítimas (protegidas por la acción de reforma).`,
'Naranjo p. 88 · Manual §171 · art. 1197');

K('l09','l','¿Cuándo acrece la legítima rigorosa a las demás (art. 1190)?',
`"Si un legitimario no lleva el todo o parte de su legítima por **incapacidad, indignidad o exheredación**, o porque la ha **repudiado**, y **no tiene descendencia con derecho de representarle**, dicho todo o parte se agrega a la mitad legitimaria y contribuirá a formar las legítimas rigorosas de los otros."
Requisitos: (a) que **falte** un legitimario; (b) que **no tenga descendencia** con derecho a representarlo: **la representación excluye al acrecimiento**.
El acrecimiento opera **solo dentro de la mitad legitimaria** y solo entre legitimarios; la legítima así aumentada **sigue siendo rigorosa**.`,
'Naranjo pp. 88–89 · Manual §171 · art. 1190');

K('l10','l','¿Qué es la legítima efectiva (art. 1191)?',
`"Acrece a las legítimas rigorosas toda aquella porción de los bienes de que el testador ha podido disponer **a título de mejoras, o con absoluta libertad**, y **no ha dispuesto**, o si lo ha hecho, **ha quedado sin efecto** la disposición. Aumentadas así las legítimas rigorosas se llaman **legítimas efectivas**."
- Se distribuye según las reglas de la **intestada** (art. 1183).
- Corresponde a todos los legitimarios (también al cónyuge).
- Inc. 3º: si concurren como herederos legitimarios con quienes no lo son, prevalecen las reglas de la **intestada** (Título II). Tras la Ley 19.585 es casi imposible: en cada orden **todos son legitimarios o ninguno** (Elorriaga).`,
'Naranjo p. 89 · Manual §172–173 · art. 1191');

K('l11','l','Distinga el acrecimiento del art. 1190 del acrecimiento del art. 1191.',
`- **Art. 1190**: la legítima del legitimario que **falta** sin representantes acrece **dentro de la mitad legitimaria** a las de los otros legitimarios. Las legítimas siguen siendo **rigorosas**.
- **Art. 1191**: la porción de **mejoras o libre disposición** de que el testador **no dispuso** (o cuya disposición quedó sin efecto) acrece a las legítimas, que pasan a ser **efectivas**.`,
'Naranjo pp. 88–89 · Manual §171–172');

/* ===== MEJORAS ===== */
K('l12','l','¿Qué es la cuarta de mejoras y a quiénes puede beneficiar?',
`Asignación forzosa (art. 1167 Nº 3) que el testador puede distribuir **como quiera** entre ciertas personas para mejorar su situación. Art. **1195**: "De la cuarta de mejoras puede hacer el donante o testador la distribución que quiera entre sus **descendientes, su cónyuge y sus ascendientes**; podrá pues asignar a uno o más de ellos toda la dicha cuarta con exclusión de los otros."
También el **conviviente civil** (art. 16 inc. 2º LAUC).
Los beneficiarios pueden **no ser legitimarios**: p. ej., un **nieto** aunque viva su padre, o un ascendiente aunque haya descendientes. El mejorero puede ser **heredero** (cuota) o **legatario** (bienes determinados).`,
'Naranjo p. 99 · Manual §174–175 · art. 1195');

K('l13','l','¿Qué características tiene la cuarta de mejoras?',
`1. Es **asignación forzosa**: favorece la formación de los acervos imaginarios y, si el testador la deja a otras personas, procede la **reforma** (art. **1220**).
2. **No se presume**: requiere **declaración expresa** (arts. 1198, 1203). Supone **testamento**; sin él, acrece a la mitad legitimaria (legítima efectiva, art. 1191).
3. Se distribuye **según el testador**: no opera la **representación**.
4. Admite **modalidades** (p. ej., administración por un **banco** aunque el asignatario no sea incapaz), pero los **gravámenes** solo pueden ser **en favor** del cónyuge o de descendientes o ascendientes (art. 1195 inc. 2º).
5. Su cuantía: **1/4** del acervo líquido o del 1º o 2º acervo imaginario.`,
'Naranjo pp. 99–100 · Manual §176–177');

K('l14','l','¿Existen las "mejoras tácitas"?',
`- **Domínguez**: sí; la ley presume la voluntad de mejorar en el art. **1193 inc. 1º** (el exceso de lo dado en razón de legítimas se imputa a mejoras) y en el art. **1203 inc. 2º** (pago de deudas declarado no imputable a la legítima se considera mejora).
- **Somarriva** y la **profesora**: no; en esos casos **hay** una declaración de voluntad del testador y no es necesario presumirla. Las mejoras **no se presumen**.`,
'Manual §176',
'La profesora adhiere a Somarriva.');

K('l15','l','¿Qué es el pacto de no mejorar (art. 1204)?',
`Única excepción a la prohibición de pactos sobre sucesión futura (art. 1463).
"Si el difunto hubiere prometido por **escritura pública** entre vivos a su **cónyuge** o a alguno de sus **descendientes o ascendientes**, que **a la sazón era legitimario**, **no donar, ni asignar por testamento parte alguna de la cuarta de mejoras**, y después contraviniere a su promesa, el favorecido con ésta tendrá derecho a que los asignatarios de esa cuarta le enteren lo que le habría valido el cumplimiento de la promesa, **a prorrata** de lo que su infracción les aprovechare."
Inc. 2º: cualesquiera otras estipulaciones sobre la sucesión futura entre un legitimario y el que le debe la legítima son **nulas**.
Finalidad: asegurar al legitimario una **legítima efectiva**.`,
'Naranjo p. 100 · Manual §178 · art. 1204');

K('l16','l','¿Cuáles son los requisitos y características del pacto de no mejorar?',
`1. **Contrato solemne**: **escritura pública**; su omisión acarrea **nulidad absoluta** (art. 1682).
2. Partes: el causante y su **cónyuge** (o conviviente civil), **descendiente o ascendiente** que **a la sazón era legitimario** (p. ej., un ascendiente no puede celebrarlo si hay descendientes).
3. **Objeto**: solo la obligación de **no hacer**: **no disponer** de la cuarta de mejoras (por donación o testamento). No es prometer la cuarta a alguien, ni comprende la libre disposición.
4. **Puro y simple**.
**Efectos**: cumplido, la cuarta acrece a la mitad legitimaria y beneficia a **todos** los legitimarios (arts. 1191, 1204); violado, el favorecido exige a los asignatarios de la cuarta lo que le habría valido, **a prorrata** del provecho.`,
'Naranjo p. 100 · Manual §178');

K('l17','l','¿Cuándo se resuelve una donación hecha a título de mejora (art. 1201)?',
`Se resuelve la donación revocable o irrevocable a título de mejora:
1. Hecha a quien se **creía descendiente o ascendiente** y no lo era.
2. Si el donatario descendiente o ascendiente **llega a faltar** por incapacidad, indignidad, desheredación o repudiación.
3. La **revocable** hecha a quien se **creía cónyuge** y no lo era, o que ha llegado a faltar por incapacidad, indignidad o repudiación (solo revocable, porque entre cónyuges no hay irrevocables).
El precepto omite el desheredamiento del cónyuge (antes no era legitimario); Somarriva agrega la filiación determinada contra oposición y la separación por culpa.`,
'Naranjo p. 101 · art. 1201');

/* ===== CÓNYUGE ===== */
K('l18','l','¿Qué cambió la Ley 19.585 respecto del cónyuge sobreviviente?',
`Antes el cónyuge solo tenía **porción conyugal** (art. 1172 antiguo): asignación de carácter **alimentario**, que exigía no tener bienes suficientes (gananciales), por lo que en la práctica casi nunca recibía nada.
Con la **Ley 19.585** (1998) se **eliminó la porción conyugal** y el cónyuge pasó a ser **legitimario** y heredero para todos los efectos:
- su cuota **nunca baja de 1/4** de la herencia o de la mitad legitimaria (art. 988);
- se **paga con preferencia** (art. 1193 inc. 2º);
- puede llevar a la vez **gananciales y legítima**, con independencia del régimen;
- tiene **adjudicación preferente** de la vivienda familiar (art. 1337 regla 10ª);
- es asignatario potencial de **mejoras y libre disposición**: puede llegar a **3/4** de la herencia.`,
'Naranjo p. 38 · Manual §180–181');

K('l19','l','¿Qué derechos sucesorios tiene el conviviente civil sobreviviente (Ley 20.830)?',
`Art. **16 LAUC**: "Cada conviviente civil será **heredero intestado y legitimario** del otro y concurrirá en su sucesión de la misma forma y gozará de los mismos derechos que corresponden al cónyuge sobreviviente. El conviviente civil podrá también ser asignatario de la **cuarta de mejoras**."
- Concurre en el **1º y 2º orden**; puede pedir la posesión efectiva y ejercer petición de herencia.
- Art. **19**: tiene el derecho de **adjudicación preferente** y los derechos de **uso y habitación** del art. 1337 regla 10ª.
- Art. **17**: puede ser **desheredado** por las tres primeras causales del art. 1208.
- Art. **18**: pierde sus derechos si el AUC ha **expirado** a la fecha de la **delación**. Crítica de la profesora: debió decir "a la **muerte** del causante" (apertura ≠ delación).
- La LAUC no reguló su **indignidad** (para la profesora, no puede ser indigno).`,
'Manual §182 · Ley 20.830 arts. 16–19');

/* ===== ACERVOS IMAGINARIOS ===== */
K('w01','w','¿Qué son los acervos imaginarios y por qué la denominación es inexacta?',
`Son el medio indirecto **más eficaz** de proteger las asignaciones forzosas: buscan **reconstruir imaginariamente** el patrimonio del causante al tiempo de las liberalidades, sumando al acervo las **donaciones** hechas en vida.
- **1º acervo** (art. **1185**): protege a un legitimario frente a donaciones hechas a **otros legitimarios**: igualdad entre ellos (**colación**).
- **2º acervo** (art. **1186**): protege las legítimas y mejoras frente a donaciones **excesivas a extraños** (con la **acción de inoficiosa donación**, art. 1187).
Inexactitud: la acumulación **no es imaginaria sino real**: funciona como un **crédito** de la sucesión contra el donatario (Somarriva). Los nombres "primer y segundo acervo" se deben a **Amunátegui**; el Código no los usa.`,
'Naranjo pp. 89–90 · Manual §197–198');

K('w02','w','¿Qué es la colación y cómo se forma el primer acervo imaginario (art. 1185)?',
`Art. **1185**: "Para computar las cuartas de que habla el artículo precedente, se **acumularán imaginariamente al acervo líquido** todas las **donaciones revocables e irrevocables, hechas en razón de legítimas o de mejoras**, según el **estado** en que se hayan encontrado las cosas donadas **al tiempo de la entrega**, pero cuidando de **actualizar prudencialmente su valor** a la época de la apertura de la sucesión."
**Colación** (Somarriva): acto por el cual el heredero que concurre con otros devuelve a la masa las cosas con que el donante lo benefició en vida, para compartirlas con sus coherederos como si nunca las hubiera tenido.
Objetivo: **igualdad entre los legitimarios**.`,
'Naranjo p. 90 · Manual §199 · art. 1185');

K('w03','w','¿Qué requisitos tiene el primer acervo imaginario y qué se acumula?',
`**Requisitos**:
1. Que al **abrirse la sucesión** existan **legitimarios** (cualesquiera).
2. Que el causante haya hecho **donaciones a legitimarios**, a título de **legítima o mejora**.
**Se acumulan**:
- **Todas** las donaciones **irrevocables** a título de legítima o mejora.
- Las **revocables**, solo si las cosas se **entregaron en vida** (si no, siguen en el patrimonio).
- Los **desembolsos** para pagar deudas de un legitimario **descendiente**, en cuanto **útiles** (art. 1203).
- Los **legados** cuyo goce se entregó en vida (son donaciones revocables).
**No** se acumulan las donaciones con cargo a la **libre disposición** (procedería el 2º acervo, como si fuera un extraño).`,
'Naranjo pp. 90–91 · Manual §200');

K('w04','w','¿Qué no se acumula ni se imputa a las legítimas?',
`- **Regalos moderados** autorizados por la costumbre y **dones manuales** de poco valor (art. **1188**).
- **Gastos de educación** de un descendiente, **aunque** el testador los haya hecho con calidad de imputables: no se toman en cuenta para nada (art. **1198** inc. 2º).
- **Presentes** a un descendiente con ocasión de su **matrimonio** y otros regalos de costumbre (art. 1198 inc. 3º).
- Los **frutos** de las cosas donadas, si se **entregaron** en vida (art. **1205**).
- Lo que se considera donación es lo que reste **deducido el gravamen** pecuniario (art. 1188).`,
'Naranjo pp. 91, 96 · Manual §202 · arts. 1188, 1198, 1205');

K('w05','w','Distinga acumulación e imputación.',
`- **Acumulación**: se **agrega** al acervo lo que **no está** en el patrimonio, para determinar el monto que se repartirá (forma los acervos imaginarios).
- **Imputación**: se **carga** a lo que el legitimario debe recibir lo que ya recibió (anticipo), para evitar un doble desembolso.
Por regla general se imputa lo mismo que se acumula, pero no siempre: las **donaciones revocables no entregadas** no se acumulan (siguen en el patrimonio) pero **sí se imputan** al pagar la legítima.`,
'Naranjo p. 90 · Manual §210');

K('w06','w','¿A quiénes aprovecha la acumulación del primer acervo? (art. 1185 vs. art. 1199)',
`Art. **1199**: la acumulación de lo dado **irrevocablemente** en razón de legítimas o mejoras **no aprovecha a los acreedores hereditarios ni a los asignatarios a otro título** que el de legítima o mejora.
- **Somarriva** (y Naranjo): la acumulación de las **irrevocables no aprovecha a la libre disposición**; la de las **revocables** sí. En el ejemplo, se descuenta de la libre disposición la parte que le tocaría de la donación irrevocable y se reparte entre la mitad legitimaria y las mejoras (2:1).
- **Mayoría** de la doctrina (Elorriaga), según el manual: prima el art. 1185 ("para computar **las cuartas**"): la colación sirve para calcular las **tres** porciones, incluida la libre disposición.`,
'Naranjo pp. 91–92 · Manual §201');

K('w07','w','Resuelva: acervo líquido 1.000, bajas 100, cinco hijos; donación irrevocable de 50 al hijo 1 y revocable entregada de 50 al hijo 2.',
`- Acervo líquido real: 1.000 − 100 = **900**.
- 1º acervo imaginario: 900 + 50 + 50 = **1.000**.
- Mitad legitimaria **500**; mejoras **250**; libre disposición **250**.
- Cada hijo: **100** de legítima rigorosa. A los hijos 1 y 2 se les **imputan** los 50 recibidos: reciben **50** en efectivo; los hijos 3, 4 y 5 reciben **100**.
(Variante de Somarriva por el art. 1199: la libre disposición no aprovecha la donación irrevocable; se le restan 12,5 que pasan a legítimas y mejoras: mitad legitimaria 508,33; mejoras 254,17; libre 237,5.)`,
'Naranjo pp. 91–92 · Manual §203');

K('w08','w','¿Qué es el segundo acervo imaginario (art. 1186)?',
`"Si el que tenía **a la sazón legitimarios** hubiere hecho **donaciones entre vivos a extraños**, y el valor de todas ellas juntas **excediere a la cuarta parte de la suma formada por este valor y el del acervo imaginario**, tendrán derecho los legitimarios para que **este exceso** se agregue también imaginariamente al acervo, para la computación de las legítimas y mejoras."
Objeto: **defender las legítimas y mejoras** frente a donaciones excesivas a terceros (evitar que el causante vacíe su patrimonio en vida). No protege la igualdad entre legitimarios (eso lo hace el 1º), sino la **integridad** de las asignaciones forzosas.`,
'Naranjo p. 92 · Manual §204 · art. 1186');

K('w09','w','¿Cuáles son los requisitos del segundo acervo imaginario?',
`1. Que existan **legitimarios al hacerse las donaciones** ("el que tenía a la sazón legitimarios"). Si los tuvo después, no procede: al donar no perjudicaba a nadie.
2. Que existan **legitimarios al fallecer** el causante. (Fabres exigía que fueran los mismos; la mayoría, no.)
3. Que sean donaciones **irrevocables** (entre vivos).
4. Hechas a **terceros** extraños (o a legitimarios con cargo a la libre disposición).
5. Que sean **excesivas**: su valor supera **1/4 de la suma** del acervo (líquido o 1º imaginario, si se formó) más las donaciones, actualizadas a la apertura.`,
'Naranjo p. 93 · Manual §205');

K('w10','w','¿Qué situaciones pueden darse con las donaciones a extraños? (con ejemplos)',
`1. **No excesivas**: no se forma el 2º acervo. (Acervo 150 + donación 50 = 200; 1/4 = 50: no excede.)
2. **Excesivas** sin lesionar legítimas: se forma el 2º acervo y se **reduce la libre disposición**. (Acervo 100 + donación 60 = 160; 1/4 = 40; exceso **20**; 2º acervo **120**: mitad legitimaria 60, mejoras 30, libre 30; solo hay 100 → legítimas y mejoras se pagan íntegras (90) y la libre disposición queda en **10**; los legados se reducen, primero los no preferentes y luego a prorrata.)
3. **Tan excesivas que lesionan legítimas o mejoras**: además nace la **acción de inoficiosa donación** (art. 1187). (Acervo 120 + donaciones 220 = 340; 1/4 = 85; exceso **135**; 2º acervo **255**: mitad legitimaria 127,5, mejoras 63,75, libre 63,75; solo hay 120 → faltan 7,5 de legítimas y 63,75 de mejoras = **71,25**, que se reclaman a los donatarios empezando por la donación más reciente.)`,
'Naranjo pp. 93–94 · Manual §206');

/* ===== PAGO ===== */
K('w11','w','¿Qué se imputa a la legítima (arts. 1198 y 1203)?',
`Art. **1198** inc. 1º: "Todos los **legados**, todas las **donaciones**, sean revocables o irrevocables, hechas a un legitimario, que tenía entonces la calidad de tal, se **imputarán a su legítima**, a menos que en el testamento o en la respectiva escritura o en **acto posterior auténtico** aparezca que el legado o la donación ha sido **a título de mejora**."
Se imputan:
a) Las **donaciones** revocables e irrevocables (todas las revocables, entregadas o no), según su estado al tiempo de la entrega, actualizadas.
b) Los **legados** al legitimario (la jurisprudencia no imputa las asignaciones a título universal; Somarriva cree que sí).
c) Los **desembolsos** para pagar deudas de un legitimario **descendiente**, en cuanto **útiles** (art. **1203**).
Es una **presunción simplemente legal** de que se hicieron a título de legítima; se desvirtúa solo con los instrumentos que señala (no testigos).`,
'Naranjo p. 96 · Manual §210 · arts. 1198, 1203');

K('w12','w','¿Se imputan a la legítima de una persona las donaciones hechas a otra (art. 1202)?',
`**No**: "No se imputarán a la legítima de una persona las donaciones o las asignaciones testamentarias que el difunto haya hecho a otra, **salvo el caso del artículo 1200, inciso 3º**."
Excepción (aplicación de la **representación**): si el donatario legitimario **llega a faltar** por incapacidad, indignidad, desheredamiento o repudiación, las donaciones imputables a su legítima se **imputan a la de sus descendientes** que lo representan.`,
'Naranjo p. 97 · Manual §210 · arts. 1200, 1202');

K('w13','w','¿Cuándo se resuelve una donación hecha a título de legítima (art. 1200)?',
`1. Hecha a quien **no era legitimario** del donante y **no adquirió después** esa calidad (p. ej., a un nieto cuyo padre sigue vivo al morir el causante).
2. Hecha a quien **era legitimario** pero **dejó de serlo** por incapacidad, indignidad, desheredación o repudiación, o por **sobrevenir otro legitimario de mejor derecho** (p. ej., donación a los padres y después nace un hijo).
Las donaciones a título de legítima se entienden hechas bajo la **condición** de que el donatario sea legitimario al abrirse la sucesión.
Excepción (inc. 3º): si el donatario falta y tiene **descendientes con derecho de representación**, lo donado se imputa a la legítima de estos. La profesora estima que el indigno, desheredado o repudiante debe **restituir** lo donado a su representante.`,
'Naranjo p. 98 · Manual §210 · art. 1200');

K('w14','w','¿Qué situaciones pueden darse al pagar las legítimas?',
`1. Las imputaciones **calzan** o son menores que la legítima: se paga el **saldo** con **preferencia** a toda otra inversión (art. **1189**).
2. **Exceden** la legítima: el exceso se imputa a la **cuarta de mejoras** (art. **1193** inc. 1º).
3. **Déficit** para completar la porción mínima del **cónyuge** (art. 988): la diferencia se paga con cargo a la **cuarta de mejoras** (art. 1193 inc. 2º) y, si no alcanza, a la libre disposición.
4. Si las mejoras (con el exceso o la diferencia) no caben en la cuarta: se imputan a la **libre disposición**, con preferencia a cualquier objeto de libre disposición (art. **1194**).
5. Si no hay cómo completar **legítimas y mejoras**: se rebajan **a prorrata** (art. **1196**).
Orden de preferencia: alimentos (baja general) → legítimas → mejoras → libre disposición.`,
'Naranjo pp. 97–98 · Manual §209–212');

K('w15','w','Controversia del art. 1193: ¿cómo se imputa el exceso de lo donado a un legitimario a la cuarta de mejoras?',
`Art. 1193: el exceso "se imputará a la cuarta de mejoras, **sin perjuicio de dividirse en la proporción que corresponda entre los legitimarios**".
Ejemplo: acervo líquido 1.000; donación de 400 a un hijo; dos hijos → acervo imaginario 1.400; legítima 350 c/u; exceso **50**; mejoras 350.
- **Somarriva / Elorriaga**: se imputa a la **cuarta completa**: 350 − 50 = 300 → **150** para cada hijo. Riesgo: el exceso puede **consumir** toda la cuarta en perjuicio del otro.
- **Segunda postura** (Claro Solar, Meza Barros, Rodríguez Grez): primero se **divide** la cuarta (**175** c/u) y el exceso se descuenta **solo** al donatario (**125**); la hermana conserva 175.
**La profesora adhiere a la segunda.**`,
'Ayudantía 2 · Naranjo p. 97 · Manual §211',
'Pregunta clásica: dar ambas tesis y la de la profesora.');

K('w16','w','¿Cómo se interpreta el art. 1196 (rebaja a prorrata de legítimas y mejoras)?',
`"Si no hubiere cómo completar las legítimas y mejoras, calculadas en conformidad a los artículos precedentes, se **rebajarán unas y otras a prorrata**."
- **Domínguez**: se rebajan proporcionalmente ambas, sin distinción, porque las dos son forzosas.
- **Profesora**: hay que distinguir: las **legítimas** tienen **preferencia** (art. 1189: el déficit se saca "con preferencia a toda otra inversión"); solo después se enteran las mejoras.`,
'Naranjo p. 98 · Manual §212');

K('w17','w','¿Qué derechos tiene el legitimario donatario cuando lo recibido no calza con su legítima (art. 1206)?',
`1. Si le toca **más** de lo recibido: **conserva las especies** donadas y **exige el saldo**; no puede obligar a los demás a cambiarle las especies o darle su valor en dinero (inc. 1º).
2. Si le toca **menos** y debe un saldo: puede **a su arbitrio** pagarlo **en dinero** o **restituir** una o más especies, exigiendo compensación por lo que su valor actual exceda al saldo (inc. 2º).
Somarriva: es un derecho **absoluto**. Si restituye en especie hay una **dación en pago legal y forzada**. Puede pedir compensación porque, como dueño, le pertenece el aumento de valor.`,
'Naranjo p. 98 · Manual §211 · art. 1206');

K('w18','w','¿A quién pertenecen los frutos de las cosas donadas (art. 1205)?',
`"Los frutos de las cosas donadas, revocable o irrevocablemente, a título de legítima o de mejora, durante la vida del donante, **pertenecerán al donatario desde la entrega** de ellas, y **no figurarán en el acervo**; y si las cosas donadas **no se han entregado**, no le pertenecerán los frutos sino **desde la muerte del donante**; a menos que éste le haya donado irrevocablemente y de un modo auténtico no sólo la propiedad, sino el **usufructo** de las cosas donadas."
Por eso los frutos de lo entregado **no se imputan** a la legítima.`,
'Naranjo pp. 96–97 · art. 1205');

/* ===== OPCIÓN: ACEPTACIÓN Y REPUDIACIÓN ===== */
K('o12','o','¿Por qué exige la ley que el asignatario se pronuncie y qué opciones tienen herederos y legatarios?',
`Razones: (a) **nadie adquiere derechos contra su voluntad**; (b) la calidad de heredero impone **responsabilidad**, que requiere su consentimiento.
- **Legatario**: aceptar o repudiar.
- **Heredero**: además puede aceptar **con beneficio de inventario** (limitar su responsabilidad).
"Todo asignatario puede **aceptar o repudiar libremente**" (art. **1225**).
La aceptación no es un cuasicontrato (art. 1437 solo equipara sus efectos).`,
'Naranjo pp. 107–108 · art. 1225');

K('o13','o','¿Desde cuándo y hasta cuándo puede aceptarse o repudiarse una asignación?',
`**Aceptar**: solo **después de deferida** (art. **1226** inc. 1º): a la muerte, o al cumplirse la condición suspensiva.
**Repudiar**: desde la **muerte** del causante, aunque la asignación sea condicional y penda la condición (art. 1226 inc. 2º).
**Hasta cuándo**:
- Con **requerimiento judicial**: dentro del plazo para deliberar (art. 1232).
- Sin requerimiento: mientras conserve su derecho: el **heredero**, hasta que otro adquiera la herencia por prescripción (5 o 10 años); el legatario de **especie**, hasta que prescriba su reivindicatoria; el de **género**, hasta que prescriba su acción personal (5 años desde que se hizo exigible).`,
'Naranjo pp. 108–109 · art. 1226');

K('o14','o','¿Qué es el plazo para deliberar y qué efecto tiene el silencio (arts. 1232 y 1233)?',
`Art. **1232**: todo asignatario está obligado, a demanda de **cualquier interesado**, a declarar si acepta o repudia **dentro de los 40 días** siguientes a la demanda. En caso de **ausencia**, bienes en lugares distantes u otro grave motivo, el juez puede prorrogarlo, **nunca por más de un año**.
Durante el plazo puede **inspeccionar** el objeto asignado e implorar **providencias conservativas**, y no puede ser obligado al pago de deudas (se cobran al curador, albacea o herederos que aceptaron).
Art. **1233**: el asignatario constituido en **mora de declarar** se entiende que **repudia** (caso en que el **silencio** vale como manifestación de voluntad). La CS: el plazo es **fatal** ("dentro de", art. 49).
Al ausente que no comparece se le nombra **curador de bienes** que acepte por él con beneficio de inventario.`,
'Naranjo pp. 108–109 · arts. 1232, 1233');

K('o15','o','¿Qué sanción tiene el asignatario que sustrae efectos de la sucesión (art. 1231)?',
`- **Heredero**: pierde la **facultad de repudiar**; aunque repudie, **permanece heredero**, pero **no tiene parte** en los objetos sustraídos.
- **Legatario**: pierde sus derechos como legatario sobre los objetos sustraídos; si no tenía su dominio (p. ej., legatario de **género**), debe **restituir el duplo**.
Ambos quedan sujetos además a las **penas** del delito. Se exige **dolo** (delito civil). Sigue la lógica del art. 1768 en la sociedad conyugal.`,
'Naranjo pp. 109–110 · art. 1231');

K('o16','o','¿Cómo aceptan o repudian los incapaces y la mujer casada en sociedad conyugal?',
`**Incapaces**: por medio de sus **representantes legales**; las herencias deben aceptarse siempre **con beneficio de inventario** (art. 1250). No puede **repudiarse** una asignación a título universal ni de bienes raíces o muebles que valgan más de un centavo hechas a quien no tiene la libre administración, **sin autorización judicial** con conocimiento de causa (art. 1236); sin ella hay **nulidad relativa**.
**Mujer casada en sociedad conyugal** (art. **1225**): el **marido** requiere el **consentimiento de la mujer** para aceptar o repudiar una asignación deferida a ella (según el art. 1749), que el juez puede suplir. Se discute si la mujer puede hacerlo por sí sola con autorización del marido (Somarriva: sí).`,
'Naranjo p. 110 · arts. 1225, 1236, 1250');

K('o17','o','¿Cuáles son las características del derecho de opción?',
`1. **Transmisible** (art. 957) pero no transferible.
2. **No admite modalidades**: no se puede aceptar o repudiar condicionalmente ni hasta o desde cierto día (art. **1227**): interesa la certidumbre de terceros.
3. **Indivisible**: no se puede aceptar una parte y repudiar otra (art. **1228**); al transmitirse se hace **divisible**: cada heredero del transmisor acepta o repudia su cuota. Se pueden aceptar y repudiar **asignaciones distintas**, pero no aceptar las libres de gravamen y repudiar las gravadas (art. **1229**).
4. **Expresa o tácita**.
5. **Irrevocable**, salvo nulidad o rescisión (arts. 1234, 1237).
6. **Retroactiva** a la delación (art. **1239**).
7. **Absoluta** (no cabe abuso del derecho).`,
'Naranjo pp. 111–113 · Manual §22 · arts. 1227–1229, 1239');

K('o18','o','¿Cuándo es expresa y cuándo tácita la aceptación de una herencia?',
`Art. **1241**: "Es **expresa** cuando se **toma el título de heredero**; y es **tácita** cuando el heredero ejecuta un acto que **supone necesariamente su intención de aceptar**, y que **no hubiera tenido derecho de ejecutar, sino en su calidad de heredero**."
- Tomar el título de heredero: en un **instrumento** o en un **acto de tramitación judicial** (art. 1242), p. ej., pedir la posesión efectiva.
- Los actos **conservativos** o de mera administración provisoria **no** importan aceptación (art. 1243).
- La **enajenación** de efectos hereditarios es acto de heredero, salvo declaración ante el juez (art. 1244).
- Si el asignatario **vende, dona o transfiere** el objeto deferido o el derecho de suceder, **acepta** por ese hecho (art. 1230).
- El **silencio** en mora de declarar = **repudiación** (art. 1233).`,
'Naranjo pp. 111, 115–116 · arts. 1230, 1241–1244');

K('o19','o','¿Cuándo puede dejarse sin efecto la aceptación o la repudiación?',
`1. Si el pronunciamiento de un **incapaz** no cumplió los requisitos legales.
2. **Fuerza o dolo** (arts. **1234** y **1237**): rigen las reglas generales, pero el dolo puede venir de **cualquier persona** (acto unilateral).
3. **Lesión grave** (solo la **aceptación**, art. 1234): la que **disminuye el valor total de la asignación en más de la mitad**, por disposiciones testamentarias de que no se tenía noticia al aceptar.
4. **Repudiación en perjuicio de los acreedores** (art. **1238**): los acreedores, autorizados por el juez, pueden **aceptar por el deudor**. Naturaleza discutida: acción **oblicua** (mayoría) o **pauliana** (Somarriva: hace volver bienes que ya salieron; beneficia solo a quien la pide).
El **error** no está previsto como vicio (Rodríguez Grez: salvo el error obstáculo).`,
'Naranjo pp. 111–112 · arts. 1234, 1237, 1238');

K('o20','o','¿Qué efecto tiene la sentencia que declara a una persona heredero (art. 1246)?',
`El que a instancia de un acreedor hereditario o testamentario ha sido **judicialmente condenado como heredero**, se entiende serlo respecto de los demás acreedores **sin necesidad de nuevo juicio**.
Es una excepción al **efecto relativo** de las sentencias (art. 3 inc. 2º). Se interpreta restrictivamente: la sentencia que declara que alguien **no** es heredero no tiene efecto absoluto.`,
'Naranjo p. 116 · art. 1246');

K('o21','o','¿Qué es la guarda y aposición de sellos?',
`Medida **conservativa**: después de abierta la sucesión y mientras no se haga **inventario solemne**, los **muebles y papeles** de la sucesión se guardan **bajo llave y sello** (art. **1222**).
- No comprende inmuebles; tampoco los **muebles domésticos** de uso cotidiano (se hace lista); el juez puede eximir el **dinero y alhajas**, depositándolos (art. 874 CPC).
- La pide el **albacea** o cualquier interesado, o se decreta **de oficio**; no cabe oposición.
- Termina al hacerse el **inventario**.
- Sus gastos son **baja general** (art. 959 Nº 1).
Es también un derecho auxiliar de los acreedores.`,
'Naranjo p. 107 · Manual §249–253 · art. 1222');

K('o22','o','¿Qué es la herencia yacente y cuáles son sus requisitos (art. 1240)?',
`La que **no ha sido aceptada** en el plazo de **15 días** desde la apertura, sin que exista **albacea con tenencia de bienes** que haya aceptado el cargo.
Requisitos:
1. **15 días** desde la apertura sin aceptación de la herencia o de una cuota.
2. **Sin albacea con tenencia de bienes** (o que no aceptó): si lo hay, él representa a la sucesión.
3. **Declaración judicial** del juez del último domicilio, a petición del cónyuge, parientes, dependientes, cualquier interesado o de oficio.
Se **publica** y se nombra **curador de la herencia yacente** (curaduría de bienes, siempre **dativa**; facultades conservativas; puede vender tras **4 años**, art. 484). Se oficia a Bienes Nacionales.
Termina por la **aceptación** de algún heredero, la venta o la extinción de los bienes (art. 491). La herencia yacente **no es persona jurídica** (art. 2346); a su favor se suspende la prescripción ordinaria (art. 2509).`,
'Naranjo pp. 113–115 · Manual §255–260 · art. 1240');

K('o23','o','Distinga herencia yacente y herencia vacante.',
`- **Yacente**: la **no aceptada** en 15 días sin albacea con tenencia de bienes; es una situación **provisoria** que se declara para dar un representante a la sucesión.
- **Vacante**: la que corresponde al **Fisco** por no haber otros herederos abintestato (art. 995).
La yacencia es la **antesala** de la vacancia. No se declara yacente la herencia **aceptada por el Fisco**. Quien denuncia una herencia vacante puede obtener hasta el **30%** de los bienes (DL 1.939).`,
'Naranjo p. 115 · Manual §261');

/* ===== BENEFICIO DE INVENTARIO ===== */
K('b01','b','¿Qué responsabilidad tiene el heredero que acepta sin beneficio de inventario (art. 1245)?',
`"El que hace acto de heredero **sin previo inventario solemne**, sucede en **todas las obligaciones transmisibles** del difunto **a prorrata de su cuota** hereditaria, **aunque le impongan un gravamen que exceda al valor de los bienes que hereda**."
Responsabilidad **ilimitada** (ultra vires): se confunden los patrimonios. "Habiendo precedido inventario solemne, gozará del **beneficio de inventario**."`,
'Naranjo p. 116 · Manual §263 · art. 1245');

K('b02','b','¿Qué es el beneficio de inventario?',
`Art. **1247**: "consiste en **no hacer a los herederos que aceptan responsables** de las obligaciones hereditarias y testamentarias, **sino hasta concurrencia del valor total de los bienes que han heredado**."
- Fundamento: **equidad**; el acreedor contrató mirando el patrimonio del causante.
- Solo favorece a **herederos**, no a legatarios (estos tienen una especie de beneficio de pleno derecho: responden hasta el valor del legado).
- El testador **no puede prohibirlo** (art. **1249**): es de orden público.`,
'Naranjo p. 116 · Manual §264 · arts. 1247, 1249');

K('b03','b','¿Cuáles son los requisitos del beneficio de inventario?',
`1. Que el heredero lo **impetre** (salvo que haya practicado inventario solemne antes de aceptar).
2. Que **no haya hecho acto de heredero** sin previo inventario (art. **1252**).
3. Que se practique **inventario solemne** (arts. 1245, 1253; 858 y ss. CPC).
4. Que el inventario sea **fiel**: el que **omite de mala fe** bienes o **supone deudas** que no existen **no goza** del beneficio (art. **1256**).
En la posesión efectiva ante el **Registro Civil**, el inventario se considera solemne, pero el solicitante debe **declarar** en el formulario que acepta con beneficio de inventario (Ley 19.903).`,
'Naranjo pp. 116–117 · Manual §265');

K('b04','b','¿Qué es el inventario solemne y cuáles son sus requisitos?',
`El que se hace **previo decreto judicial**, por **notario** (u otro ministro de fe o el juez) y **dos testigos** mayores de 18 años que sepan leer y escribir, con **citación de los interesados**, y **protocolizado** (art. 858 CPC).
Requisitos: identidad del manifestante; citar a los interesados (art. **1255**: albacea, curador de la herencia yacente, herederos presuntos, legatarios, socios, fideicomisarios y acreedores con título, quienes pueden **reclamar** contra él); fechas en letras; **juramento** del manifestante de que no hay otros bienes; firmas; protocolización. Es **instrumento público**.
Comprende todos los bienes, títulos, créditos y deudas (art. 382), incluso los bienes **sociales** si la sociedad continúa con los herederos (art. 1254). Lo oscuro se interpreta **a favor del heredero** (arts. 1253, 388). La Ley 19.903 exige **valorización**.`,
'Naranjo pp. 117–118 · Manual §265 · arts. 1253–1255');

K('b05','b','¿Quiénes deben aceptar con beneficio de inventario y quiénes no pueden?',
`**Obligados**:
1. Los **coherederos**, si unos quieren aceptar con beneficio y otros no (art. **1248**).
2. Los **herederos fiduciarios** (art. **1251**), para proteger al fideicomisario.
3. El **Fisco** y las corporaciones y establecimientos **públicos** (art. **1250** inc. 1º).
4. Los **incapaces** (art. 1250 inc. 2º). Si no lo hacen, igual responden solo hasta lo que exista de la herencia o se pruebe empleado en su beneficio: **beneficio de pleno derecho** (inc. final).
**No pueden**:
1. El que hizo **acto de heredero** sin previo inventario solemne (art. **1252**).
2. El que **omitió de mala fe** bienes o supuso deudas (art. **1256**).`,
'Naranjo pp. 118–119 · Manual §266');

K('b06','b','¿Produce el beneficio de inventario separación de patrimonios?',
`- **No** (Somarriva, mayoría y jurisprudencia): (1) el art. 1247 limita la responsabilidad al **valor** de lo recibido, no a los bienes; (2) el art. 1260 hace responder del valor de tasación aun por pérdida fortuita; (3) no se limita la facultad de disposición del heredero; (4) art. 520 Nº 4 CPC: el heredero se opone por **tercería** o excepción. Los acreedores pueden perseguir bienes propios del heredero, pero **solo hasta el monto** de lo heredado.
- **Sí** (minoritaria): arts. 1259, 1262, 1263 y **1610 Nº 4** (subrogación del heredero beneficiario que paga con dinero propio).
Lo seguro: las deudas y créditos del heredero beneficiario **no se confunden** con los de la sucesión (art. **1259**): no opera la **confusión** como modo de extinguir.`,
'Naranjo pp. 119–120 · Manual §267');

K('b07','b','¿De qué responde el heredero beneficiario y cómo se extingue su responsabilidad?',
`**Responde**:
- Del valor de los bienes que reciba **y de los que sobrevengan** después (art. **1257**).
- De los **créditos** como si los hubiera cobrado, salvo que justifique no haberlos podido cobrar sin culpa (art. 1258).
- Hasta la **culpa leve** de la conservación de las especies debidas; los demás bienes son de su riesgo y responde de su valor de tasación (art. **1260**).
- Somarriva: el límite es el valor de los bienes **al deferirse** la herencia.
**Extinción**:
1. **Abandonando** a los acreedores los bienes que deba entregar en especie y el saldo, con aprobación de su **cuenta** (art. **1261**); Somarriva: es una dación en pago.
2. Cuando los bienes se **agotan** en el pago de deudas, rindiendo cuenta (art. 1262).
Es una **excepción perentoria**: debe probarla con cuenta exacta y documentada (art. **1263**).`,
'Naranjo pp. 120–121 · Manual §267 · arts. 1257–1263');

/* ===== ACCIONES ===== */
K('k01','k','¿Cuáles son las causales de ineficacia de un testamento?',
`1. **Nulidad** del testamento (falta de requisitos internos o solemnidades).
2. **Violación del sobre** del testamento cerrado.
3. Que **todos** los asignatarios sean **incapaces, indignos** o **repudien**.
4. **Caducidad** de los testamentos privilegiados.
5. **Revocación** por el testador.
6. **Reforma** del testamento a instancia de los legitimarios (ineficacia parcial).`,
'Naranjo p. 103 · Manual §117');

K('k02','k','¿Qué es la acción de reforma del testamento?',
`Art. **1216** inc. 1º: "Los **legitimarios** a quienes el testador no haya dejado lo que por ley les corresponde, tendrán derecho a que **se reforme a su favor el testamento**, y podrán intentar la acción de reforma (ellos o las personas a quienes se hubieren transmitido sus derechos), dentro de los **cuatro años** contados desde el día en que tuvieron **conocimiento del testamento y de su calidad de legitimarios**."
Concepto: la que corresponde a los legitimarios o sus herederos cuando el testador no respetó sus **legítimas o mejoras**, para que se **modifique** el testamento en todo lo que perjudique esas asignaciones.
Es el principal **medio directo** de protección. A diferencia de la **nulidad**, deja subsistente el testamento en lo que no perjudica las asignaciones forzosas.`,
'Naranjo p. 104 · Manual §229 · art. 1216');

K('k03','k','¿Qué características tiene la acción de reforma?',
`1. **Personal**: se dirige contra los asignatarios instituidos en perjuicio de las asignaciones forzosas (a diferencia de la petición de herencia, que es real). Pueden deducirse **conjuntamente** (CS).
2. **Patrimonial**: **renunciable, transferible y transmisible** (solo después de la muerte del causante; antes, pacto sobre sucesión futura).
3. **Prescriptible**: **4 años** desde que el legitimario conoció el **testamento** y su **calidad de legitimario** (debe probarlo quien alega la prescripción, art. 1698). Es prescripción de corto tiempo (art. 2524): **se interrumpe pero no se suspende**, salvo la regla especial del inc. 2º: si el legitimario no tenía la administración de sus bienes, los 4 años corren **desde que la tome** (la profesora: con un tope razonable de 10 años).
4. Se tramita en **juicio ordinario**; no requiere juicio previo sobre la calidad de legitimario ni partición previa.
5. Es **declarativa**: si se requiere recuperar bienes, se complementa con otras acciones.`,
'Naranjo pp. 104–105 · Manual §230–231');

K('k04','k','¿Qué puede reclamarse mediante la acción de reforma y quiénes son sujetos activos y pasivos?',
`**Objeto** (art. **1217**): "lo que por ley corresponde a los legitimarios y lo que tienen derecho a reclamar por la acción de reforma, es su **legítima rigorosa, o la efectiva** en su caso".
- La **rigorosa**, si el testador dispuso de mejoras o libre disposición (o si fue desconocida a favor de legitimarios de igual derecho).
- La **efectiva**, si no dispuso de ellas o sus disposiciones quedaron sin efecto (o si fue desconocida a favor de extraños).
- La **cuarta de mejoras** si se dejó a quienes no pueden ser mejoreros (art. **1220**); solo la reclaman los **legitimarios**.
- El **indebidamente desheredado** obtiene además que subsistan las **donaciones entre vivos** comprendidas en la desheredación (art. 1217 inc. 2º).
Nunca la libre disposición.
**Activos**: legitimarios y sus herederos (o cesionarios). **Pasivos**: los instituidos en su perjuicio; contribuyen a integrar la legítima los legitimarios del **mismo orden y grado** (art. **1219**).`,
'Naranjo pp. 105–106 · Manual §231 · arts. 1217, 1219, 1220');

K('k05','k','Diferencie la revocación y la reforma del testamento.',
`- **Revocación**: acto **unilateral del testador**, en vida, por otro **testamento**; deja sin efecto un testamento **válido** por su sola voluntad, sin expresión de causa; puede ser total o parcial, expresa o tácita.
- **Reforma**: **acción judicial** de los **legitimarios** después de la muerte; solo modifica el testamento **en lo que perjudica** las legítimas o mejoras; prescribe en 4 años.
Ambas son causales de ineficacia, pero la revocación emana del **testador** y la reforma de la **ley** a petición de los asignatarios forzosos.`,
'Naranjo pp. 103–104 · Manual §117–120, §229');

K('k06','k','¿Qué es la acción de petición de herencia?',
`Art. **1264**: "El que probare su derecho a una herencia, **ocupada por otra persona en calidad de heredero**, tendrá acción para que **se le adjudique** la herencia, y se le **restituyan** las cosas hereditarias, tanto corporales como incorporales; y aun aquellas de que el difunto era **mero tenedor**, como depositario, comodatario, prendario, arrendatario, etc., y que no hubieren vuelto legítimamente a sus dueños."
Concepto: la que compete al heredero para obtener la **restitución de la universalidad** de la herencia contra quien la posee invocando también la calidad de heredero (**falso heredero**).
Se extiende a los **aumentos** posteriores de la herencia (art. 1265). Es una especie de **reivindicatoria** sobre una universalidad.`,
'Naranjo p. 121 · Manual §232 · arts. 1264, 1265');

K('k07','k','¿Qué características tiene la acción de petición de herencia?',
`1. **Real**: emana del derecho real de herencia; se dirige contra cualquiera que posea la herencia como heredero.
2. **Divisible**: cada heredero la ejerce por su cuota.
3. **Universal** en cuanto a su objeto; **mueble** (tesis mayoritaria).
4. **Originaria**: deriva directamente del derecho de herencia.
5. **Patrimonial**: **renunciable, transmisible, transferible** (con la cesión de derechos hereditarios) y **prescriptible**.`,
'Naranjo p. 122 · Manual §233');

K('k08','k','¿Cómo prescribe la acción de petición de herencia?',
`Art. **1269**: "El derecho de petición de herencia **expira en diez años**. Pero el heredero putativo, en el caso del inciso final del artículo 704, podrá oponer a esta acción la prescripción de **cinco años**."
- **5 años**: falso heredero con **posesión efectiva** (justo título): prescripción **adquisitiva ordinaria** (exige buena fe; se suspende a favor del art. 2509).
- **10 años**: sin posesión efectiva. La CS la calificó de **extintiva** ("expira"). **Somarriva** la critica: también es **adquisitiva** extraordinaria (art. 2512), porque si la de 5 es adquisitiva no hay razón para distinguir, y por el art. **2517**: toda acción se extingue por la prescripción adquisitiva del mismo derecho. Así, la acción solo se extingue cuando otro **adquiere** la herencia por prescripción.`,
'Naranjo pp. 122–123 · Manual §233 · arts. 1269, 2517');

K('k09','k','¿Quiénes pueden ejercer la acción de petición de herencia y contra quién?',
`**Activos** ("el que probare su derecho a una herencia"):
1. Los **herederos** de cualquier clase (universales o de cuota, testamentarios o abintestato, por transmisión, representación, acrecimiento o sustitución), salvo el **condicional** suspensivo pendiente la condición.
2. El **donatario revocable a título universal** (art. 1142).
3. El **cesionario** de derechos hereditarios.
**No** los **legatarios**: el de especie tiene la **reivindicatoria**; el de género, la acción **personal**.
**Pasivo**: quien ocupa la herencia **invocando la calidad de heredero** (falso heredero) y, según Somarriva, su **cesionario**, que lo reemplaza.`,
'Naranjo p. 123 · Manual §234');

K('k10','k','¿Qué efectos produce la acción de petición de herencia?',
`1. **Restitución** de la herencia al verdadero heredero.
2. **Frutos y mejoras**: reglas de las **prestaciones mutuas** de la reivindicatoria (art. **1266**). El de **mala fe** restituye los frutos percibidos y los que pudo percibir; el de **buena fe**, solo los percibidos **después de la contestación** de la demanda; se abonan los gastos ordinarios. Mejoras **necesarias**: siempre; **útiles**: al de buena fe; **voluptuarias**: nunca (solo puede llevarse los materiales).
3. **Deterioros y enajenaciones** (art. **1267**): el de **buena fe** responde solo en cuanto le hayan hecho **más rico**; el de **mala fe**, de **todo** el importe (aun fortuitos).
4. **Cosas enajenadas a terceros**: el heredero puede **reivindicarlas** si no han sido prescritas (art. **1268**), o pedir indemnización al falso heredero.`,
'Naranjo pp. 124–125 · Manual §235 · arts. 1266–1268');

K('k11','k','Paralelo entre la acción de reforma del testamento y la de petición de herencia.',
`- **Procede**: reforma, cuando el testador desconoce asignaciones forzosas | petición, cuando la herencia es poseída por un falso heredero.
- **Sucesión**: reforma, solo **testada** | petición, testada e **intestada**.
- **Naturaleza**: reforma, **personal** (contra los asignatarios instituidos en perjuicio) | petición, **real** (contra cualquiera que posea como heredero).
- **Titular**: reforma, los **legitimarios** | petición, cualquier **heredero**.
- **Prescripción**: reforma, **4 años** desde el conocimiento | petición, **5 o 10 años**.
Pueden deducirse **conjuntamente** (CS).`,
'Naranjo p. 125 · Manual §230, §232');

K('k12','k','¿Qué es la acción de inoficiosa donación y quiénes la ejercen?',
`La que tienen los **legitimarios** (y, para la mayoría, también los **asignatarios de cuarta de mejoras**) contra los **donatarios** cuando el causante hizo en vida **donaciones irrevocables** excesivas a extraños que, además de absorber la libre disposición, **menoscaban las legítimas rigorosas o la cuarta de mejoras** (art. **1187**).
Se traduce en la **restitución** de lo excesivamente donado:
- se procede contra los donatarios en **orden inverso** al de las fechas (**las más recientes primero**);
- la **insolvencia** de un donatario **no grava** a los otros: el riesgo lo soportan los legitimarios.
Las donaciones son "rescindibles" en este caso (art. **1425**). Una minoría sostiene que solo la tienen los legitimarios (tenor del 1187).`,
'Naranjo p. 94 · Manual §214–215 · arts. 1187, 1425');

K('k13','k','¿Cuál es la naturaleza jurídica de la acción de inoficiosa donación y cómo prescribe?',
`**Naturaleza** (discutida):
- **Nulidad relativa** (Somarriva), por el art. 1425 ("rescindibles").
- **Resolutoria**: la donación no nace viciada; queda sujeta a no ser excesiva a la muerte.
- **Inoponibilidad** (Rodríguez Grez): la donación es válida, pero no oponible a los legitimarios en lo excesivo.
**Características**: **personal** (contra los donatarios, aunque la cosa la tenga un tercero) y **patrimonial** (renunciable, transferible, transmisible, prescriptible).
**Prescripción**: no hay regla; **5 años** (art. 2515) si es resolutoria, o **4 años** (art. 1691) si es rescisoria.`,
'Naranjo pp. 94–95 · Manual §216–217');

/* ===== REVOCACIÓN ===== */
K('v04','v','¿Qué es la revocación del testamento y qué caracteres tiene la facultad de revocar?',
`Acto por el cual el testador deja sin efecto, total o parcialmente, un testamento **válidamente otorgado**, por su **sola voluntad**. Art. **1212**: "El testamento que ha sido otorgado válidamente **no puede invalidarse sino por la revocación del testador**." Los privilegiados además **caducan**.
La facultad es:
- **Esencial** (arts. 999, 1001) y de **orden público**.
- **Irrenunciable**: cualquier cláusula que la limite se tiene por no escrita (art. 1001).
- **Absoluta**: no requiere expresión de causa.
Es la única causal de ineficacia de un acto válido y sin vicios por la sola voluntad del autor.`,
'Naranjo p. 103 · Manual §118 · art. 1212');

K('v05','v','¿Qué requisitos tiene la revocación del testamento?',
`1. **Objeto**: solo se revocan las **disposiciones**; las **declaraciones** son irrevocables (reconocimiento de hijo, art. 189 inc. 2º).
2. **Forma**: debe hacerse por **otro testamento** (lo confirman las normas en su conjunto; hay fallos aislados que admitieron escritura pública). Puede ser de **distinta clase**: el solemne puede revocarse por un testamento **solemne o privilegiado** (art. **1213**).
3. Si la revocación está en un **privilegiado** y este **caduca**, la revocación **caduca** con él y **subsiste** el anterior (art. 1213 inc. 2º).
4. Si el testamento revocatorio es **nulo**, no hay revocación (efecto retroactivo de la nulidad, art. 1687).
5. Si se revoca el testamento revocatorio, el primero **no revive**, salvo voluntad contraria del testador (art. **1214**).`,
'Naranjo pp. 103–104 · Manual §119 · arts. 1213, 1214');

K('v06','v','¿Cómo se clasifica la revocación del testamento?',
`- **Total o parcial** (art. 1212 inc. final).
- **Expresa**: en términos formales y explícitos.
- **Tácita**: el testamento posterior, sin decir que revoca, contiene disposiciones **incompatibles** con las anteriores. Art. **1215**: "Un testamento **no se revoca tácitamente en todas sus partes** por la existencia de otro u otros posteriores. Los testamentos posteriores que expresamente no revoquen los anteriores, **dejarán subsistentes** en éstos las disposiciones que no sean incompatibles con las posteriores, o contrarias a ellas."
Determinar la incompatibilidad es **cuestión de hecho**.
Revocación tácita de **legados** sin nuevo testamento: enajenación o alteración sustancial de la cosa (art. 1135), cobro del crédito legado (art. 1127), demanda o cobro de la deuda condonada (art. 1129).`,
'Naranjo p. 104 · Manual §120 · arts. 1215, 1135');

/* ===== DESHEREDAMIENTO ===== */
K('p01','p','Defina el desheredamiento y señale sus características.',
`Art. **1207**: "Desheredamiento es una **disposición testamentaria** en que se ordena que un **legitimario** sea **privado del todo o parte de su legítima**. No valdrá el desheredamiento que no se conformare a las reglas que en este título se expresan."
También se llama desheredación o exheredación (art. 1190).
Características:
1. Medio para privar de su legítima al legitimario **desleal** por hechos graves en vida del causante: **válvula de escape** frente a las asignaciones forzosas.
2. **Solemne**, de causales **taxativas** que deben **probarse y calificarse judicialmente**; no admiten analogía.
3. Derecho **absoluto** del testador (lo ordena, limita o revoca libremente).
La profesora acepta llamarlo "**indignidad testamentaria**" (y a la indignidad, "desheredamiento legal").`,
'Naranjo p. 101 · Manual §219–220 · art. 1207');

K('p02','p','¿Cuáles son las causales de desheredamiento (art. 1208)?',
`Un **descendiente** solo puede ser desheredado:
1ª Por **injuria grave** contra el testador en su persona, honor o bienes, o en los de su cónyuge, ascendientes o descendientes.
2ª Por no haberle **socorrido** en el estado de **demencia o destitución**, pudiendo.
3ª Por haberse valido de **fuerza o dolo para impedirle testar**.
4ª **Eliminada** por la Ley 21.515 (2022) (antes: casarse sin el consentimiento de un ascendiente).
5ª Por haber cometido un **delito que merezca pena aflictiva**, o haberse abandonado a los **vicios** o ejercido **granjerías infames**, salvo que el testador no cuidó de su **educación**.
Los **ascendientes y el cónyuge** (y el **conviviente civil**, art. 17 LAUC) solo por las **tres primeras**.`,
'Naranjo pp. 101–102 · CC vigente art. 1208',
'Naranjo todavía menciona la causal 4ª: hoy está eliminada.');

K('p03','p','¿Qué requisitos debe cumplir el desheredamiento para ser eficaz (art. 1209)?',
`1. Debe hacerse **por testamento**.
2. Debe fundarse en una **causa legal** (art. 1208).
3. La causa debe **expresarse específicamente** en el testamento (basta señalar los **hechos**; no es necesario citar el número del 1208).
4. Los hechos deben **probarse judicialmente** en vida del testador, o probarlos después de su muerte **las personas a quienes interese** el desheredamiento.
**Excepción a la prueba**: no es necesaria si el desheredado **no reclama su legítima** dentro de los **4 años** siguientes a la apertura (o desde que cesó su incapacidad de administrar). El plazo coincide con el de la **acción de reforma**, vía para impugnar un desheredamiento injusto.`,
'Naranjo p. 102 · Manual §221 · art. 1209');

K('p04','p','¿Qué efectos produce el desheredamiento y a quién aprovecha?',
`**Efectos** (art. **1210**): si el testador no los limita expresamente, se extienden **no solo a las legítimas**, sino a **todas las asignaciones por causa de muerte** y a **todas las donaciones** que le haya hecho el desheredador. **No** se extienden a los **alimentos**, salvo **injuria atroz** (causales 1ª a 3ª, en relación con arts. 968, 979, 324).
Puede ser **total o parcial**.
**A quién aprovecha**:
- Si el desheredado puede ser **representado**: a sus **descendientes** (art. 987).
- Si no (p. ej., un ascendiente): a los **demás legitimarios** (art. 1190).
- Si no hay otros legitimarios: a los asignatarios testamentarios o abintestato.`,
'Naranjo p. 102 · Manual §222–223 · art. 1210');

K('p05','p','¿Cómo se revoca el desheredamiento (art. 1211)?',
`"El desheredamiento podrá revocarse, como las otras disposiciones testamentarias, y la revocación podrá ser **total o parcial**; pero **no se entenderá revocado tácitamente por haber intervenido reconciliación**; ni el desheredado será admitido a probar que hubo **intención** de revocarlo."
La revocación debe hacerse por **testamento**, expresa o tácitamente (por incompatibilidad). Si el desheredamiento estaba en un testamento privilegiado que caduca, queda sin efecto.`,
'Naranjo p. 102 · Manual §224 · art. 1211');

K('p06','p','¿Qué es la preterición y qué efectos produce (art. 1218)?',
`Haber sido **pasado en silencio** un legitimario en el testamento. Art. **1218**: "deberá entenderse como una **institución de heredero en su legítima**. Conservará además las **donaciones revocables** que el testador no hubiere revocado."
- **No anula** el testamento: se presume que el testador quiso **respetar** su legítima.
- Casos: no recibió nada imputable a su legítima ni es mencionado; se le menciona como pariente sin asignarle nada; o se le deja algo ordenando que no se impute a su legítima (Elorriaga).
Reclama la legítima **rigorosa** si fue preterido a favor de un legitimario de igual derecho, o la **efectiva** si lo fue a favor de un extraño.`,
'Naranjo p. 106 · Manual §225–227 · art. 1218');

K('p07','p','¿Qué acción tiene el legitimario preterido?',
`Discutido:
- **Somarriva / Naranjo**: como la ley lo **instituye heredero** (art. 1218), su acción es la **petición de herencia**, no la reforma (importa por la prescripción: 5–10 años vs. 4).
- Otra parte de la doctrina: la **acción de reforma**, para reclamar su legítima.
- **Rodríguez Grez** distingue: si su legítima no se lesiona y entra en posesión, **no necesita acción**; si no se lesiona pero no tiene la posesión, **petición de herencia**; si además hay disposiciones que lesionan su legítima, **reforma** (y también petición de herencia).`,
'Naranjo p. 106 · Manual §227');

/* ===== ACCIÓN DE NULIDAD DEL TESTAMENTO ===== */
K('k14','k','¿Cuándo procede la acción de nulidad del testamento y qué sanción corresponde a cada vicio?',
`1. **Requisitos internos** (vician todo el testamento):
  - **Incapacidad** del testador (art. **1005**): el testamento otorgado durante la causa de inhabilidad es **nulo** aunque esta cese después; el válido no deja de serlo por sobrevenir la inhabilidad (art. **1006**).
  - **Fuerza**: "es nulo **en todas sus partes**" (art. **1007**). Para Somarriva/Naranjo, **nulidad relativa** ("en todas sus partes" = nulidad total, no solo de la cláusula); otros: absoluta.
  - **Dolo**: sin regla especial. La **profesora**: se sanciona con **indignidad** (art. 968 Nº 4), no con nulidad.
2. **Solemnidades** (art. **1026**): "no tendrá valor alguno" → **nulidad absoluta**, salvo omisión de **designaciones** sin duda sobre la identidad.
3. **Requisitos de las disposiciones**: solo se anula la **cláusula** respectiva.
La acción se rige por las **reglas generales** (arts. 1683 y 1691).`,
'Naranjo pp. 43–45, 51 · Manual §102 · arts. 1005–1007, 1026');

/* ===== DEUDAS HEREDITARIAS ===== */
K('b08','b','¿Cómo se dividen las deudas hereditarias entre los herederos y qué consecuencias tiene?',
`Art. **1354**: "Las deudas hereditarias se dividen entre los herederos **a prorrata de sus cuotas**. Así el heredero del tercio no es obligado a pagar sino el tercio de las deudas hereditarias."
La división del **pasivo** opera **de pleno derecho** (ipso facto) por la muerte; el **activo**, en cambio, forma una **comunidad** que hay que partir. No hace falta la partición para cobrar.
Consecuencias:
1. La obligación de los herederos es **simplemente conjunta**.
2. La **insolvencia** de un heredero **no grava** a los otros (art. **1355**), salvo el caso del art. **1287** inc. 2º (herederos que omitieron avisos o la hijuela de deudas).
3. Se extingue la **solidaridad** pasiva con la muerte del deudor (no se transmite).
4. **Confusión parcial** (art. **1357**): si un heredero era acreedor o deudor del difunto, solo se confunde la cuota que le cabe; por el resto tiene acción o queda obligado a prorrata.
Fundamento de la responsabilidad: la **ley** (el heredero representa al causante, art. 1097); la profesora destaca que responden por un **acto voluntario**: la aceptación (art. 1437).`,
'Naranjo pp. 164–166 · Manual §236–237 · arts. 1354, 1355, 1357');

K('b09','b','¿Cuáles son las excepciones a la división a prorrata de las deudas hereditarias?',
`1. **Heredero beneficiario**: solo hasta lo que valga lo que hereda (art. 1354 inc. 3º).
2. **Obligaciones indivisibles** (arts. 1526, 1528): cada heredero del deudor puede ser obligado al **total**.
3. **Usufructo** (arts. 1356, 1368): nudo propietario y usufructuario son **una sola persona**; paga el **propietario** y el usufructuario le abona los **intereses** mientras dure el usufructo; si paga el usufructuario, se le reintegra el capital **sin intereses** al terminar.
4. **Fideicomiso** (arts. 1356, 1372): fiduciario y fideicomisario son **una sola persona**; el fiduciario paga y el fideicomisario se lo reintegra **sin interés**; las cargas **periódicas** las sufre el fiduciario sin indemnización.
5. **Varios inmuebles hipotecados** (art. **1365**): el acreedor tiene acción "**solidaria**" (en realidad, **indivisibilidad** hipotecaria) contra cada inmueble.
6. **División distinta** por el **testador** (art. **1358**), la **partición** o un **convenio** de herederos (arts. **1340**, **1359**): no obliga a los acreedores, que pueden **optar** (art. 1526 Nº 4); el heredero más gravado tiene derecho a ser **indemnizado**.`,
'Naranjo pp. 166–167 · Manual §238 · arts. 1354–1359, 1365');

K('b10','b','¿Cuándo responden los legatarios de las deudas hereditarias (art. 1362)?',
`Regla: los legatarios **no representan** al causante y no responden de deudas (art. **1104**). Excepciones (art. **1362**):
1. Cuando el testador destine a legados parte de la porción reservada a **legítimas o mejoras** (acción de reforma).
2. Cuando **al tiempo de abrirse la sucesión** no haya habido **lo bastante** para pagar las deudas hereditarias.
3. Cuando la cosa legada está gravada con **prenda o hipoteca** (art. **1366**): si el testador no quiso gravarlo, el legatario que paga se **subroga** contra los herederos; no si la garantía caucionaba deuda ajena.
4. Cuando el testador lo **gravó expresamente** (obligado principal, art. 1360).
Caracteres: **subsidiaria** ("en subsidio de la que tienen contra los herederos": una especie de **beneficio de excusión**); **a prorrata** de los legados, sin que la insolvencia de uno grave a otros (art. **1363**); **limitada** al valor del legado (arts. 1363, **1364**: especie de beneficio de inventario).`,
'Naranjo pp. 167–169 · Manual §240–241 · arts. 1104, 1362–1366');

K('b11','b','¿En qué orden contribuyen los legados al pago de deudas, legítimas y mejoras?',
`Regla (art. **1363** inc. 1º): contribuyen **a prorrata** de sus legados. Orden en que van contribuyendo (del primero al último):
1. **Legados comunes**. Entre ellos, las **donaciones revocables** y los legados cuyo goce se dio **en vida** prefieren a los no entregados (art. **1141** inc. final).
2. **Legados expresamente exonerados** por el testador: solo si, agotados los demás, queda incompleta una legítima o insoluta una deuda (art. 1363 inc. 2º).
3. **Legados de obras pías o beneficencia pública**: se entienden exonerados **sin disposición expresa** y entran **después** de los expresamente exonerados (inc. 3º).
4. **Legados estrictamente alimenticios** debidos por ley: "no entrarán a contribución sino **después de todos los otros**" (inc. 3º).
Naranjo agrega como preferente el **exceso** de legítimas y mejoras imputado conforme a los arts. 1193–1194.
Legados con **causa onerosa** (art. **1367**): contribuyen con **deducción del gravamen**, probando que se efectuó el objeto y que exigió invertir una cantidad determinada.`,
'Naranjo pp. 168–169 · Manual §240–241 · arts. 1363, 1367');

K('b12','b','¿Cómo se pagan las cargas testamentarias y los legados?',
`- **Quién paga** (art. **1360**): las cargas testamentarias son de los herederos **en común** solo si el testador no gravó con ellas a determinado heredero o legatario; entre los herederos se dividen como dispuso el testador o, en silencio, **a prorrata** de sus cuotas. Si la partición o un convenio las distribuye de otro modo, los legatarios pueden **optar** (art. **1373**).
- **Usufructo** (arts. 1369, 1370) y **fideicomiso**: reglas paralelas a las deudas; las pensiones **periódicas** las soporta el usufructuario o el fiduciario.
- **Orden** (art. **1374**): no habiendo concurso ni tercería, se paga a los acreedores **hereditarios** a medida que se presenten y, pagados estos, se satisfacen los **legados**. Si la herencia no aparece excesivamente gravada, puede pagarse de inmediato a los legatarios que ofrezcan **caución**; ni esta se exige si la herencia está manifiestamente exenta de cargas.
- **Insuficiencia**: los legados se **rebajan a prorrata** (art. **1376**).
- Gastos de entrega: parte de los legados (art. 1375). Pensiones periódicas: se deben día por día, exigibles al fin de cada período (mensual); las **alimenticias**, al principio (art. **1361**).`,
'Naranjo pp. 170–171 · Manual §239 · arts. 1360, 1373, 1374, 1376');

K('b13','b','¿Pueden los acreedores ejecutar a los herederos con un título ejecutivo contra el causante (art. 1377)?',
`Sí: "Los **títulos ejecutivos** contra el difunto lo serán igualmente contra los herederos; pero los acreedores no podrán entablar o llevar adelante la ejecución, sino **pasados ocho días** después de la **notificación judicial** de sus títulos."
Es una especie de **preparación de la vía ejecutiva**, para que los herederos conozcan la deuda.
Si el causante muere durante el juicio, rige el art. **5 CPC** (suspensión y término de emplazamiento); Somarriva: el CPC deroga el 1377 solo parcialmente: los 8 días se aplican si el juicio no se había iniciado o si el causante actuaba representado.`,
'Naranjo pp. 164–165 · art. 1377');

/* ===== BENEFICIO DE SEPARACIÓN ===== */
K('b14','b','¿Qué es el beneficio de separación y cuál es su fundamento?',
`Art. **1378**: "Los **acreedores hereditarios** y los **acreedores testamentarios** podrán pedir que **no se confundan** los bienes del difunto con los bienes del heredero; y en virtud de este beneficio de separación tendrán derecho a que de los bienes del difunto se les cumplan las obligaciones hereditarias o testamentarias **con preferencia** a las deudas propias del heredero."
Concepto (Somarriva): facultad de los acreedores hereditarios y testamentarios para que los bienes hereditarios no se confundan con los propios del heredero, a fin de pagarse en ellos con preferencia a los **acreedores personales** del heredero.
**Fundamento**: **equidad**. Protege a los acreedores del causante frente a un heredero muy endeudado; los acreedores del heredero no se perjudican, pues contrataron mirando solo su patrimonio.
Es una **medida conservativa** o derecho auxiliar del acreedor.`,
'Naranjo pp. 171–172 · Manual §268 · art. 1378');

K('b15','b','¿Quiénes pueden pedir el beneficio de separación y cuándo no procede?',
`**Titulares**: acreedores **hereditarios y testamentarios** (art. 1378), aunque su crédito sea **a plazo o condicional** (art. **1379**).
**No** los acreedores **personales del heredero** (art. **1381**): su protección es que el heredero acepte con beneficio de inventario.
**Subsiste** mientras no haya **prescrito** el crédito, pero no procede (art. **1380**):
1. Cuando el acreedor ha **reconocido al heredero por deudor**, aceptando un pagaré, prenda, hipoteca o fianza del heredero, o un **pago parcial**.
2. Cuando los bienes de la sucesión **han salido de manos del heredero**, o se han **confundido** con los suyos de manera que no sea posible reconocerlos.
Caracteres (profesora): debe ser **declarado judicialmente**; es **individual**; procede con o sin beneficio de inventario. Se discute a quién demandar (herederos, más práctico, o acreedores personales del heredero).`,
'Naranjo p. 172 · Manual §269–271 · arts. 1379–1381');

K('b16','b','¿Qué efectos produce el beneficio de separación?',
`- **Desde cuándo**: desde la sentencia ejecutoriada; si hay **inmuebles**, desde que el decreto se **inscribe** en el CBR (art. **1385**).
- **Aprovecha** a los demás acreedores de la sucesión que lo invoquen y cuyos créditos no hayan prescrito ni estén en el caso del Nº 1 del 1380 (art. **1382** inc. 1º).
- **Entre acreedores del causante**: se mantienen las preferencias; los hereditarios antes que los testamentarios.
- **Frente a los acreedores del heredero**: en los bienes del **causante** se pagan primero los separatistas; el **sobrante** pasa al heredero (art. 1382 inc. 2º). En los bienes del **heredero** se pagan primero sus acreedores personales; los separatistas solo después de agotados los hereditarios (art. **1383**).
- **Respecto del heredero**: conserva la disposición, pero las **enajenaciones** (e hipotecas o censos) hechas dentro de los **6 meses** siguientes a la apertura que no tuvieron por objeto pagar créditos hereditarios o testamentarios **pueden rescindirse** (art. **1384**): acción de tipo **pauliana** (Somarriva) o **revocatoria** sin fraude (Domínguez); después, pauliana general (art. 2468).
- ¿Separa patrimonios? Somarriva: **sí**, es su objeto; Domínguez: solo da **preferencia**.`,
'Naranjo pp. 172–173 · Manual §273 · arts. 1382–1385');

K('b17','b','Compare el beneficio de inventario y el beneficio de separación.',
`- **Titular**: inventario, el **heredero** | separación, los **acreedores hereditarios y testamentarios**.
- **Protege**: inventario, al heredero frente a los acreedores del causante (limita su responsabilidad al **valor** de lo heredado) | separación, a los acreedores del causante frente a los **acreedores personales del heredero**.
- **Requisito**: inventario, **inventario solemne** y no haber hecho acto de heredero | separación, **declaración judicial**.
- **Separación de patrimonios**: inventario, **no** (opinión mayoritaria; solo impide la confusión, art. 1259) | separación, **sí** (Somarriva; art. 520 CPC).
- Pueden **coexistir**: la separación procede cualquiera sea la forma de aceptación.`,
'Naranjo pp. 119–120, 171–173 · Manual §267, §271');

/* ===== ALBACEAS ===== */
K('e01','e','Defina al albacea. ¿Quién ejecuta el testamento si no lo hay?',
`Art. **1270**: "Ejecutores testamentarios o albaceas son aquellos a quienes **el testador** da el **encargo de hacer ejecutar sus disposiciones**."
Art. **1271**: "No habiendo el testador nombrado albacea, o faltando el nombrado, el encargo de hacer ejecutar las disposiciones del testador **pertenece a los herederos**."
Doctrina (Rodríguez Grez): personas designadas por el testador encargadas de **asegurar los bienes**, **pagar las deudas** y hacer cumplir las disposiciones, **sustituyendo** en esas funciones a los herederos.
Requisitos (profesora): (1) **testamento** que lo designe; (2) **funciones propias** (ordenadora y ejecutiva); (3) que **sustituye** a los herederos en esas tareas.
Solo hay albaceas **testamentarios**: el Código no reconoce legítimos ni dativos.`,
'Naranjo pp. 126, 128 · Manual §274–275, §280 · arts. 1270, 1271');

K('e02','e','¿Cuál es la naturaleza jurídica del albaceazgo?',
`- **Mandato** (Somarriva): el Código habla de "**encargo**"; art. **2169** (mandato para ejecutarse después de la muerte); analogías en aceptación (1278/2124), extinción por muerte (1279/2163), cuenta (1309/2155) y el art. **1800** que asimila albaceas y mandatarios.
- **Diferencias con el mandato**: el albaceazgo es **disposición testamentaria** (unilateral y **solemne**); **empieza** con la muerte del testador; es **indelegable**; aceptado, es **irrevocable**; exige **plena capacidad** (art. 1272); sus facultades las fija la **ley**.
- **Representación** (Elorriaga): se critica, pues no puede representar al testador muerto ni a los herederos.
- **Curaduría de bienes** (Rodríguez Grez): administra bienes sin representar a nadie; facultades legales; remisión a los arts. 394, 412 (art. 1294) y 1296.
- **Institución sui generis**.`,
'Naranjo p. 126 · Manual §277');

K('e03','e','¿Cuáles son las características del albaceazgo?',
`1. **Personalísimo** (intuito personae): **intransmisible** (art. **1279**) e **indelegable**, salvo facultad expresa del testador; puede constituir **mandatarios** bajo su responsabilidad (art. **1280**).
2. **De derecho estricto / orden público**: "El testador **no podrá ampliar** las facultades del albacea, **ni exonerarle** de sus obligaciones" (art. **1298**).
3. **Temporal**: dura el tiempo fijado por el testador (art. **1303**); en silencio, **un año** desde que comenzó a ejercer (art. **1304**); el **juez** puede prorrogarlo por dificultades graves (art. **1305**), no los herederos.
4. **Remunerado**: la fija el testador o, en silencio, el **juez** según el caudal y lo laborioso del cargo (art. **1302**); es **baja general**.
5. Puede haber **varios**: obran **de consuno** y son **solidariamente responsables**, salvo exoneración o división de atribuciones (arts. **1281**–1283).
6. **Voluntario**: puede rechazarse libremente (art. **1277**).`,
'Naranjo pp. 126–127 · Manual §276 · arts. 1277–1283, 1298, 1302–1305');

K('e04','e','¿Quiénes no pueden ser albaceas?',
`Art. **1272**: "No puede ser albacea el **menor de edad**. Ni las personas designadas en los artículos **497 y 498**." Entre otros: ciegos, mudos, dementes aunque no estén en interdicción, fallidos que no han satisfecho a sus acreedores, disipadores interdictos, quienes carecen de domicilio en Chile, no saben leer ni escribir, de mala conducta notoria, condenados a pena aflictiva aunque indultados, privados de la patria potestad (art. 271), removidos de una guarda anterior, y quienes deben ejercer largo tiempo un cargo público fuera de Chile.
**Personas jurídicas**: la mayoría estima que no pueden, salvo ley expresa: los **bancos** (art. 86 Nº 5 LGB).
La capacidad se exige al **abrirse la sucesión** (Elorriaga). La **incapacidad sobreviniente** pone fin al albaceazgo (art. **1275**).
Diferencia con el **mandato**: el mandatario puede ser menor adulto.`,
'Naranjo p. 127 · Manual §278 · arts. 1272, 1275');

K('e05','e','¿Cómo se acepta o rechaza el albaceazgo y qué sanción tiene el rechazo injustificado?',
`- **Rechazo libre** (art. **1277** inc. 1º), a diferencia de las guardas, que son cargas impuestas.
- Si lo rechaza **sin probar inconveniente grave**, se hace **indigno** de suceder al testador (arts. **1277** inc. 2º y **971** inc. 2º).
- **Plazo** (art. **1276**): el juez, a instancia de cualquier interesado, fija un plazo razonable para que comparezca a ejercer o excusarse, ampliable **una sola vez**; en **mora**, **caduca** el nombramiento.
- **Aceptación** expresa o **tácita** (art. **1278**), sin formalidades (a diferencia del **partidor**, que debe aceptar **expresamente** y jurar, art. 1328).
- Aceptado, debe **evacuarlo**, salvo los casos en que el mandatario puede exonerarse; la **dimisión con causa legítima** le priva solo de una **parte proporcionada** de la asignación hecha en recompensa del servicio (art. 1278 inc. 2º).`,
