<style>
/* Layout: una sola columna centrada (máx. 760px); la tarjeta es una cédula de estudio con cabecera de referencia y barra de calificación fija abajo. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#131A25; --muted:#586477; --line:#D3DAE3;
  --accent:#1C4D8A; --accent-soft:#E2EAF5; --accent-ink:#FFFFFF;
  --seal:#9B2E29; --seal-soft:#F5E6E4;
  --good:#2C7A4B; --good-soft:#E1F1E7; --warn:#A86D12; --warn-soft:#F7EDDB; --bad:#B23A30; --bad-soft:#F7E3E1;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --sunk:#121821; --ink:#E5EAF1; --muted:#97A3B4; --line:#2A3442;
  --accent:#86ADE3; --accent-soft:#1D2A3D; --accent-ink:#0E131A;
  --seal:#E39087; --seal-soft:#3A2321;
  --good:#71C493; --good-soft:#18301F; --warn:#E2B263; --warn-soft:#352914; --bad:#EF7F74; --bad-soft:#3B1E1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --sunk:#121821; --ink:#E5EAF1; --muted:#97A3B4; --line:#2A3442;
  --accent:#86ADE3; --accent-soft:#1D2A3D; --accent-ink:#0E131A;
  --seal:#E39087; --seal-soft:#3A2321;
  --good:#71C493; --good-soft:#18301F; --warn:#E2B263; --warn-soft:#352914; --bad:#EF7F74; --bad-soft:#3B1E1B;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}

.brand h1{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-weight:500;white-space:nowrap}

main{padding-top:20px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* HOY */
.today-hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}
.plan{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:130px;padding-top:6px}
.pcol{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;min-width:0;position:relative}
.pbar{border-radius:3px 3px 0 0;min-height:0}
.pbar.rev{background:var(--accent)}

.pcol.today::after{content:"";position:absolute;inset:-4px -2px -2px;border:1.5px solid var(--ink);border-radius:5px;pointer-events:none}
.plabels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}

.unitrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.unitrow:first-child{border-top:0}

.unitrow .nm small{display:block;color:var(--muted);font-size:11.5px}

/* ESTUDIO */
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.counts{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.card-h .ref{font-family:var(--mono)}

.actbar{position:sticky;bottom:0;margin-top:14px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{border-radius:9px;padding:9px 4px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.rate button b{font-weight:600;font-size:14px}

.rate .r3{border-color:var(--good);background:var(--good-soft)} .rate .r3 b{color:var(--good)}

/* FILTROS / INDICE */
.filters{display:flex;flex-direction:column;gap:12px}

.qitem>summary .st{flex:none;font-size:11px}
.qitem .body{padding:0 12px 12px 60px;font-family:var(--serif);font-size:15.5px;line-height:1.55}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);vertical-align:0}
.st-dot.s1{background:var(--warn)} .st-dot.s2{background:var(--accent)} .st-dot.s3{background:var(--good)} .st-dot.bad{background:var(--bad)}

<body>
<header class="top"><div class="topin">
  <div class="brand"><h1>Cedulario Sucesorio</h1><span class="sub" id="topsub">Derecho Civil VII · sucesión por causa de muerte</span></div>
  <nav class="tabs" aria-label="Secciones">
    <button data-v="hoy" aria-current="page">Hoy</button>
    <button data-v="libre">Repaso libre</button>
    <button data-v="arts">Artículos</button>
    <button data-v="indice">Índice</button>
    <button data-v="ajustes">Plan</button>
  </nav>
</div></header>
<div class="wrap"><main id="app"></main></div>

<script>
/* ======================= DATOS ======================= */
const UNITS=[], CARDS=[];
function U(u){ if(!UNITS.find(x=>x.id===u.id)) UNITS.push(u); }
function K(id,u,q,a,src,note){ CARDS.push({id,u,q,a,src,note:note||'',k:'q'}); }
function A(n,u,t,inc,txt){ CARDS.push({id:'art'+n,u,n,t,inc,a:txt,k:'a',q:'Art. '+n+' CC · '+t,src:'Código Civil, art. '+n+(inc?' ('+inc+')':'')+' · texto vigente'}); }
U({id:'g',n:'Generalidades y principios',p:'I.A (i)–(ii)'});
U({id:'h',n:'Derecho real de herencia y posesiones',p:'I.A (iii)'});
U({id:'a',n:'Asignatarios, capacidad y dignidad',p:'I.A (iv)'});
U({id:'o',n:'Apertura, delación, opción y transmisión',p:'I.A (v)–(vi)'});
U({id:'c',n:'Acervos y bajas generales',p:'I.A (vi)'});

/* ===== GENERALIDADES ===== */
K('g01','g','¿Qué acepciones tiene la palabra "sucesión"?',
`- **Sentido lato**: ocupar el lugar de una persona y recoger sus derechos **a cualquier título** (el comprador sucede al vendedor). Aplica a todos los modos derivativos.
- **Sentido estricto** (evoca la muerte), con triple significado:
  - la **transmisión** del patrimonio de una persona fallecida a una o más personas vivas;
  - el **patrimonio** mismo que se transmite (sentido objetivo);
  - el **conjunto de sucesores** ("la sucesión de Pedro"; sentido subjetivo).`,
'Naranjo p. 2 · Manual §7');

K('g02','g','Defina la sucesión por causa de muerte como modo de adquirir.',
`Modo de adquirir el dominio del **patrimonio de una persona difunta**, es decir, del conjunto de sus **derechos y obligaciones transmisibles**, o de una **cuota** de dicho patrimonio, o de **especies o cuerpos ciertos** (o de especies indeterminadas de cierto género).
Fuente legal: arts. **588** (la enumera entre los modos de adquirir) y **951**.
Implica una verdadera **subrogación personal**: los herederos ocupan el lugar jurídico del difunto (arts. 688, 722, 1097).`,
'Naranjo p. 2 · Manual §7 · arts. 588, 951');

K('g03','g','¿Qué características tiene la sucesión por causa de muerte como modo de adquirir?',
`1. **Derivativo**: el derecho del sucesor procede del causante; nadie transmite más derechos de los que tiene. Si el causante no era dueño, el sucesor solo es poseedor y podrá prescribir. Importa para la **prueba del dominio**.
2. **Gratuito**: el sucesor no hace sacrificio económico (todo pacto de sucesión futura adolece de objeto ilícito, art. 1463). No significa que siempre se enriquezca.
3. **Por causa de muerte**: supone la muerte **natural o presunta**.
4. **A título universal o singular** (art. 951).
5. Es **modo de extinguir** los derechos y obligaciones intransmisibles.
6. Es **fuente de un derecho personal** para el legatario de género y **modo de adquirir** para el de especie.
7. Es más que un modo: toda una **institución** jurídica.`,
'Naranjo p. 2 · Manual §11');

K('g04','g','¿Qué derechos son intransmisibles por causa de muerte?',
`Excepción a la regla de la transmisibilidad; se extinguen con la muerte del titular:
- **Usufructo** (transferible entre vivos, pero se extingue con la muerte del usufructuario).
- **Uso y habitación** (ni transmisibles ni transferibles).
- **Expectativa del fideicomisario** que muere antes de la restitución.
- **Expectativa del asignatario condicional** que muere pendiente la condición suspensiva (arts. 1078, 1492).
- **Acción revocatoria de donaciones por ingratitud**, salvo que se haya intentado en vida del donante, que el hecho le haya causado la muerte o que se haya cometido después (art. 1430).
- Derecho del **comodatario** (salvo arts. 2180 Nº 1 y 2186).
- Derechos que terminan con la muerte (**renta y censo vitalicio**).
- Por regla general, los derivados de la **sociedad** (art. 2103) y el **mandato**.
- **Alimentos** (art. 334).`,
'Naranjo p. 3 · Manual §11');

K('g05','g','¿Qué obligaciones son intransmisibles?',
`La regla es la transmisibilidad ("quien contrata, lo hace para sí y para sus herederos"). Son intransmisibles:
- Las que suponen **aptitudes especiales** del deudor (arts. 1095, 2005).
- Las basadas en la **confianza** entre las partes (mandato, sociedad).
- Por regla general, las de los **miembros de una corporación** (art. 549).
- La **solidaridad**: no se transmite como tal; los herederos del deudor solidario responden a prorrata de su cuota (art. 1523).`,
'Naranjo p. 3');

K('g06','g','¿Cuál es el título en la sucesión por causa de muerte y qué clases de sucesión existen según su fuente?',
`Por ser modo derivativo requiere un **título**: el **testamento** o la **ley** (art. 952).
- **Testamentaria**: obra de la voluntad del difunto expresada en el testamento.
- **Intestada o abintestato**: obra de la ley, que a falta de testamento designa a los llamados (testamento tácito o presunto).
- **Mixta**: "parte testamentaria y parte intestada" (art. 952 inc. 2º).
La **convencional** está prohibida (pacto sobre sucesión futura: objeto ilícito, art. 1463), con la sola excepción del **pacto de no mejorar** (art. 1204).`,
'Naranjo p. 4 · Manual §5 · arts. 952, 1463, 1204');

K('g07','g','Distinga título universal y título singular (art. 951).',
`- **Universal**: se sucede en **todos** los bienes, derechos y obligaciones transmisibles, o en una **cuota** de ellos (la mitad, tercio o quinto).
- **Singular**: se sucede en una o más **especies o cuerpos ciertos** (tal casa) o en una o más **especies indeterminadas de cierto género** (un caballo, tres vacas).
Asignación universal = **herencia** → **heredero**; singular = **legado** → **legatario** (art. 954). Las asignaciones legales son **siempre a título universal**: no hay legados abintestato.`,
'Naranjo pp. 4–5 · arts. 951, 954');

K('g08','g','¿Cómo se califica si un asignatario es heredero o legatario?',
`Se atiende **únicamente al contenido** de la asignación (universalidad/cuota o bienes determinados), con prescindencia de cómo lo llame el testador.
Art. **1097**: los asignatarios a título universal, "con cualesquiera palabras que se les llame, y aunque en el testamento se les califique de legatarios, son herederos".
Ojo: **asignatario universal** es el género; el **heredero de cuota** es asignatario universal pero no heredero universal. El derecho de **acrecer** favorece a los herederos universales, no a los de cuota.`,
'Naranjo p. 5 · Manual §14 · art. 1097');

K('g09','g','¿Cuáles son las diferencias entre heredero y legatario?',
`1. **Objeto**: universalidad o cuota vs. bienes determinados o de género.
2. **Representación**: el heredero representa la persona del causante y los patrimonios se confunden (salvo beneficios de inventario o separación); el legatario no lo representa (art. 1104).
3. **Deudas**: el heredero responde de las hereditarias y testamentarias, aun más allá de lo que recibe; el legatario solo si se le impuso, o **en subsidio** de los herederos y hasta el monto del legado, y por la acción de reforma.
4. **Dominio**: el heredero y el legatario de especie lo adquieren a la muerte; el de género solo adquiere un **crédito** y se hace dueño por **tradición**.
5. **Posesión legal**: solo el heredero (arts. 688, 722).
6. **Posesión efectiva**: institución exclusiva del heredero.
7. **Fuente**: heredero por ley o testamento; legatario solo por testamento.`,
'Naranjo pp. 5–6 · Manual §14');

K('g10','g','¿Qué intereses convergen en la sucesión por causa de muerte?',
`Según la profesora:
1. **Interés del titular** del patrimonio: facultad de disponer de sus bienes para después de su muerte (testamento).
2. **Interés familiar**: la familia colaboró en la formación del patrimonio → **asignaciones forzosas**.
3. **Interés social**: la sociedad contribuyó directa o indirectamente al patrimonio; se manifiesta en el **Fisco** como heredero del 5º orden y en el **impuesto** a las herencias (Ley 16.271).`,
'Manual §8');

K('g11','g','¿Cuáles son los principios del derecho sucesorio según el manual de la profesora?',
`1. **Herederos como continuadores** de la persona del causante (art. 1097): adquieren sus bienes y asumen sus obligaciones (arts. 1492, 2190, 2352, 2316).
2. **Unidad del patrimonio** (art. 981): la ley no atiende al origen de los bienes.
3. **Igualdad** (arts. 982, 985, 988).
4. **Protección de la familia**: legítimas y demás asignaciones forzosas.
Excepciones a la continuidad: la posesión principia en el sucesor (art. 717), **beneficio de inventario** (art. 1247), **beneficio de separación** (art. 1378).`,
'Manual §15');

K('g12','g','Explique el principio de unidad (art. 981) y sus excepciones.',
`Art. 981: "La ley no atiende al **origen de los bienes** para reglar la sucesión intestada o gravarla con restituciones o reservas."
Doble aspecto: **unidad de bienes** (una sola masa) y **unidad de legislación** (una sola ley: la del último domicilio, art. 955).
Excepciones: art. **15 Nº 2** (chileno y sus parientes chilenos), art. **998** (extranjero que fallece con parientes chilenos), muerte presunta (último domicilio en Chile), leyes especiales y el derecho de adjudicación preferente del cónyuge (art. 1337 regla 10ª), que **sí atiende al origen** del bien (vivienda familiar).`,
'Manual §15 · Ayudantía 1 · arts. 955, 981, 998');

K('g13','g','Explique el principio de igualdad (art. 982) y su excepción.',
`Art. 982: "En la sucesión intestada **no se atiende al sexo ni a la primogenitura**."
Manifestaciones: sucesión por **cabezas y estirpes** (art. 985) e **igualdad de todos los hijos** (Ley 19.585: se eliminó la distinción entre hijos legítimos y naturales).
Excepción: la distinción entre parientes de **simple y doble conjunción** (arts. 990 y 992): el de simple conjunción lleva la **mitad** de lo que lleva el de doble.`,
'Manual §15 · arts. 982, 985, 990, 992');

K('g14','g','¿Qué leyes han modificado sustancialmente el sistema sucesorio chileno?',
`- **Ley 10.271** (1952): amplió derechos de hijos naturales y cónyuge.
- **Ley 18.802** (1989): cónyuge asignatario de cuarta de mejoras.
- **Ley 19.585** (1998, filiación): igualdad de los hijos; **cónyuge legitimario**; suprime la porción conyugal.
- **Ley 19.903** (2003): posesión efectiva de intestadas ante el **Registro Civil**.
- **Ley 20.830** (2015, AUC): el **conviviente civil** es heredero intestado y legitimario como el cónyuge (art. 16).
- **Ley 21.400** (2021): matrimonio igualitario.
- **Ley 21.515** (2022): deroga el art. 114 y la causal 4ª de desheredamiento.`,
'Manual §5, §15 · CC vigente');

/* ===== DERECHO REAL DE HERENCIA ===== */
K('h01','h','¿Qué es la herencia desde el punto de vista objetivo y subjetivo?',
`- **Objetivo**: universalidad jurídica que comprende el **activo y pasivo transmisible** del causante (todas sus relaciones jurídicas transmisibles).
- **Subjetivo**: es un **derecho**: el derecho real que confiere la facultad o aptitud de una persona para suceder en el **patrimonio del causante o en una cuota** de él (Somarriva).`,
'Naranjo pp. 10–11 · Manual §32');

K('h02','h','¿Cuáles son las características del derecho real de herencia?',
`1. **Derecho real** (art. 577): absoluto, oponible erga omnes; protegido por la **acción de petición de herencia** (art. 1264).
2. Recae sobre una **universalidad jurídica** distinta de los bienes que la componen (no es mueble ni inmueble por sí misma, según la tesis mayoritaria).
3. **Vida efímera**: dura mientras subsiste la indivisión; con la **partición** se transforma en dominio sobre los bienes adjudicados.
Se critica la utilidad de un derecho real distinto del dominio (Soza Ried).`,
'Naranjo p. 11 · Manual §32');

K('h03','h','¿Cuál es la naturaleza jurídica de la herencia (mueble o inmueble) y por qué importa?',
`Importa para la **tradición** (cesión) del derecho de herencia:
- **Tesis de Leopoldo Urrutia** (mayoritaria y de la jurisprudencia): la herencia es una **universalidad distinta** de los bienes; no es mueble ni inmueble, y se aplica el estatuto **general o de los muebles** (el de inmuebles es excepcional). La cesión **no requiere inscripción** aunque haya inmuebles; basta cualquier acto que manifieste la intención de transferir.
- **Tesis de José Ramón Gutiérrez**: la herencia es mueble o inmueble según los bienes que la componen (art. 580); si hay inmuebles, la tradición exige **inscripción** (art. 686).`,
'Manual §33, §37 · Naranjo p. 18');

K('h04','h','¿Por qué modos se adquiere el derecho real de herencia?',
`1. **Sucesión por causa de muerte**: por el solo ministerio de la ley a la muerte del causante (sistema francés–germánico). La aceptación solo **consolida** la adquisición; evita solución de continuidad.
2. **Tradición**: la cesión de derechos hereditarios (arts. 1909–1910).
3. **Prescripción**: el falso heredero, en 10 años, o en 5 si obtuvo posesión efectiva (arts. 704, 1269, 2512).`,
'Naranjo p. 11 · Manual §34');

K('h05','h','¿Qué es la posesión legal de la herencia y qué consecuencias produce?',
`La que la **ley** confiere al heredero desde el momento en que la herencia **se defiere, aunque el heredero lo ignore** (arts. **688** y **722**).
- Es distinta de la del art. 700: el heredero puede carecer de **corpus y animus**.
- No se transmite: la posesión del heredero **principia en él** (art. 717).
- Solo corresponde al **verdadero heredero**, no al putativo.
- **No habilita para prescribir** ni para disponer de inmuebles (art. 688).
Consecuencias: el heredero puede **tomar posesión material** inmediata de los bienes y ejercer **acciones posesorias** sobre bienes que nunca poseyó de hecho. Evita el vacío posesorio.`,
'Naranjo p. 12 · Manual §35');

K('h06','h','¿Qué es la posesión material (real) de la herencia?',
`La posesión del art. **700**: tenencia de la herencia con **ánimo de señor y dueño** (corpus + animus). Es buscada por el asignatario (a diferencia de la legal, que se adquiere aunque se ignore).
Lo normal es que coincida con la legal en el verdadero heredero; pero puede tenerla un **falso heredero**, y es la que lo **habilita para adquirir por prescripción** la herencia.`,
'Naranjo p. 12 · Manual §35');

K('h07','h','¿Qué es la posesión efectiva y qué efectos tiene?',
`La que se otorga por **resolución judicial o administrativa** a quien tiene la **apariencia de heredero** (Somarriva). Mecanismo de orden procesal que organiza la sucesión.
**No confiere la calidad de heredero** (solo de heredero putativo): arts. 877 CPC, 704 y 1269 (el que la obtiene puede prescribir en 5 años, señal de que no es dueño).
Importancia:
- Conserva la **historia de la propiedad raíz** (art. 688).
- **Validez del pago** al heredero putativo (art. 1576).
- **Justo título**: prescripción de **5 años** (arts. 704 inc. final, 1269).
- Permite determinar y cobrar el **impuesto** a la herencia (Ley 16.271).`,
'Naranjo pp. 12–13 · Manual §35');

K('h08','h','¿Ante quién se tramita la posesión efectiva tras la Ley 19.903?',
`- **Sucesiones intestadas abiertas en Chile**: ante el **Registro Civil** (sede administrativa). Se otorga por **resolución fundada del Director Regional**; se publica en extracto en un diario regional (días 1 o 15 del mes) y se inscribe en el **Registro Nacional de Posesiones Efectivas**. El inventario se considera solemne; para aceptar con beneficio de inventario hay que declararlo en la solicitud.
- **Testadas** y las **abiertas en el extranjero**: ante el **tribunal** del último domicilio (gestión no contenciosa, arts. 877 y ss. CPC). La resolución se publica 3 veces y se inscribe en el CBR.
Según Somarriva y el SII, la sucesión **parcialmente testada** va a tribunales.
Art. 6 Ley 19.903: en las intestadas se otorga a **todos** los que según el Registro Civil sean herederos, aunque no figuren en la solicitud.`,
'Naranjo pp. 12–15');

K('h09','h','¿Se puede oponer alguien a la posesión efectiva o pedir su revocación?',
`**Ante tribunales** (no contenciosa): puede oponerse un **legítimo contradictor** (art. 823 CPC), es decir, quien tiene un derecho a la herencia que le permite obtenerla en forma exclusiva o en igualdad con el solicitante. La gestión se vuelve **contenciosa** (juicio ordinario). Revocación (art. 821 CPC): concedida, solo mientras esté **pendiente su ejecución**; inscrita, solo queda el juicio (petición de herencia, reforma, nulidad).
**Ante el Registro Civil**: no hay oposición reglada; cualquier interesado puede presentarse **antes de la inscripción**. Inscrita, solo caben las acciones de nulidad y de petición de herencia.`,
'Naranjo pp. 14–15');

K('h10','h','¿Qué requisitos deben cumplir los asignatarios para disponer de los bienes hereditarios?',
`1. **Pagar o asegurar el impuesto** a la herencia (común a herederos y legatarios). Notarios y conservadores no pueden autorizar ni inscribir adjudicaciones o enajenaciones sin el comprobante.
2. **Inscripciones del art. 688**:
- Para **muebles**: basta la inscripción de la posesión efectiva.
- Para **inmuebles**: las tres inscripciones del art. 688.`,
'Naranjo p. 15 · art. 688');

K('h11','h','¿Qué inscripciones exige el art. 688 para disponer de inmuebles hereditarios?',
`1. Inscripción de la **posesión efectiva**: el decreto judicial (con el testamento) en el CBR de la comuna donde se pronunció; la resolución administrativa en el **Registro Nacional de Posesiones Efectivas**.
2. **Inscripción especial de herencia**: cada inmueble a nombre de **todos** los herederos, en el CBR donde está ubicado → disponen **de consuno**. (Se hace en el CBR aunque la posesión efectiva la haya dado el Registro Civil.)
3. Inscripción de la **adjudicación**: → el heredero dispone **por sí solo**.
"Disponer" = **enajenar** (transferir dominio o constituir derechos reales).
Estas inscripciones **no son tradición** (ya operó la sucesión): conservan la **historia de la propiedad raíz**.`,
'Naranjo pp. 15–16 · Manual §36 · art. 688');

K('h12','h','¿Qué sanción tiene la enajenación de un inmueble hereditario sin las inscripciones del art. 688?',
`El artículo no la señala. Tesis:
1. **Nulidad absoluta** (norma prohibitiva, art. 10). Crítica: el 688 es **imperativo de requisitos**, la omisión se **sanea** inscribiendo después (art. 682) y no se sanea por el tiempo.
2. **Nulidad de la tradición**, valiendo el contrato. Crítica: art. 1810.
3. **Art. 696**: el adquirente no adquiere dominio ni posesión; queda como **mero tenedor**. **Es la tesis que predomina** en la doctrina y la jurisprudencia. Críticas: el mero tenedor reconoce dominio ajeno (art. 714) y el 696 supone inscripciones que son tradición.
4. **Nulidad relativa**: no recogida (se sanearía por el tiempo).
**Somarriva**: el adquirente queda como **poseedor**.`,
'Naranjo pp. 16–17 · Manual §36');

K('h13','h','¿Qué es la cesión de derechos hereditarios y qué requisitos tiene?',
`Tradición del derecho real de herencia (arts. 1909–1910). Requisitos:
1. Que el **causante haya fallecido** (si no, pacto sobre sucesión futura: objeto ilícito, art. 1463).
2. Un **título traslaticio** (compraventa, donación, permuta).
3. Que se ceda la **universalidad o una cuota**, no bienes determinados (si no, degenera en otro contrato sobre esos bienes).
Forma: según la tesis de Urrutia, conforme a las reglas de los **muebles**; no exige las inscripciones del art. 688.`,
'Naranjo pp. 17–18 · Manual §37');

K('h14','h','¿Qué efectos produce la cesión de derechos hereditarios?',
`El cesionario ocupa el lugar jurídico del cedente en el **activo** de la herencia:
- Puede pedir la **posesión efectiva** y la **partición** (art. 1320), e intervenir en ella.
- Puede ejercer las acciones de **petición de herencia** y de **reforma** del testamento.
- Le aprovecha el **acrecimiento**, salvo pacto (art. 1910 inc. 3º).
- Responsabilidad del cedente: si es **onerosa**, solo responde de su **calidad de heredero**; si es **gratuita**, ni de eso (art. 1909). Es un contrato **aleatorio**.
Por la regla *semel heres semper heres*, el cedente **sigue siendo heredero** frente a los acreedores; lo que pasa es el activo (Elorriaga). Somarriva: el acreedor puede demandar a cedente o cesionario.`,
'Naranjo p. 18 · Manual §37 · arts. 1909, 1910');

K('h15','h','¿Cómo se adquiere la herencia por prescripción?',
`La adquiere el **falso heredero** (heredero aparente o putativo) que posee la herencia:
- **Regla general**: prescripción **extraordinaria de 10 años** (art. 2512 regla 1ª), desde que entró en posesión material.
- **Excepción**: el heredero putativo con **posesión efectiva** prescribe en **5 años** (art. 1269); el decreto o resolución le sirve de **justo título** (art. 704 inc. final). Es prescripción **ordinaria**: exige buena fe y se suspende a favor de incapaces (Somarriva).
**Desde cuándo los 5 años**: discutido. Naranjo: desde la **inscripción**. El manual cita jurisprudencia reciente (CS) que cuenta desde que se **dictó** el decreto o resolución, por el tenor del art. 704.`,
'Naranjo p. 19 · Manual §38 · arts. 704, 1269, 2512',
'Punto controvertido: la profesora expone ambas posturas y destaca la jurisprudencia que cuenta desde el decreto.');

K('h16','h','¿Qué relación hay entre la prescripción adquisitiva de la herencia y la acción de petición de herencia?',
`Art. **1269**: "El derecho de petición de herencia expira en diez años. Pero el heredero putativo, en el caso del inciso final del artículo 704, podrá oponer a esta acción la prescripción de cinco años."
La acción **no se extingue por sí sola** por el paso del tiempo, sino cuando otro **adquiere la herencia por prescripción adquisitiva** (art. **2517**: toda acción por la que se reclama un derecho se extingue por la prescripción adquisitiva del mismo derecho).`,
'Manual §38 · arts. 1269, 2517');

/* ===== ASIGNATARIOS: CAPACIDAD Y DIGNIDAD ===== */
K('a01','a','¿Qué son las asignaciones por causa de muerte y quién es asignatario?',
`Art. **953**: asignaciones por causa de muerte son "las que hace la **ley**, o el **testamento** de una persona difunta, para suceder en sus bienes". En el Libro III, "asignaciones" significa las asignaciones por causa de muerte, "ya las haga el hombre o la ley".
**Asignatario** es la persona a quien se hace la asignación. El difunto se llama **causante** (provoca la sucesión) y, si hay testamento, **testador**.`,
'Naranjo p. 4 · Manual §12 · art. 953');

K('a02','a','¿Qué requisitos debe reunir el asignatario para suceder?',
`Todo asignatario (universal o singular, testamentario o abintestato) debe ser:
1. **Capaz** de suceder.
2. **Digno** de suceder.
En la sucesión **testamentaria** se agrega que sea persona **cierta y determinada** (art. 1056).
La capacidad y dignidad se miran al **momento de la apertura** (o al cumplirse la condición suspensiva).`,
'Naranjo p. 19 · Manual §26');

K('a03','a','¿Qué es la capacidad para suceder y qué naturaleza tiene la incapacidad?',
`**Capacidad**: aptitud legal de una persona para suceder a otra; habilidad para ser heredero o legatario. Es la **regla general**: "Será capaz y digna de suceder toda persona a quien la ley no haya declarado incapaz o indigna" (art. **961**).
La incapacidad para suceder es:
- una **incapacidad de goce** (no de ejercicio);
- **especial**: solo impide ser titular de los derechos de heredero o legatario;
- **absoluta** (impide suceder a toda persona) o **relativa** (a determinado causante).
A diferencia del art. 1682, la sanción es la misma sea absoluta o relativa.`,
'Naranjo pp. 19–20 · art. 961');

K('a04','a','¿Cuáles son las incapacidades absolutas para suceder?',
`1. **Falta de existencia natural** al abrirse la sucesión (art. **962**): no suceden los que murieron antes que el causante (salvo representación) ni los que aún no existían.
2. **Falta de personalidad jurídica** (art. **963**): son incapaces las cofradías, gremios o establecimientos que no sean personas jurídicas. Excepción: la asignación para **fundar** una nueva corporación o establecimiento vale si se obtiene la aprobación legal.`,
'Naranjo pp. 20–21 · arts. 962, 963');

K('a05','a','¿Qué excepciones o reglas especiales tiene el requisito de existir al abrirse la sucesión?',
`1. **Concebido**: sus derechos quedan **suspensos** hasta el nacimiento (art. 77); si nace y sobrevive un momento, entra en su goce como si hubiera existido al deferirse.
2. **Asignación condicional** (suspensiva): debe existir **también al cumplirse** la condición (art. 962 inc. 2º).
3. **Personas que se espera que existan**: valen si llegan a existir antes de expirar los **10 años** siguientes a la apertura (art. 962 inc. 3º).
4. **Premio a un servicio importante**: vale aunque quien lo preste no existiera al morir el testador, con el mismo límite de **10 años** (art. 962 inc. 4º).
5. **Derecho de transmisión**: no es excepción; el transmitido debe existir al abrirse la sucesión del **transmisor**.`,
'Naranjo p. 20 · art. 962');

K('a06','a','¿Pueden suceder las personas jurídicas extranjeras?',
`- De **derecho público**: no se discute que son capaces.
- De **derecho privado**: se discute. Para unos, solo si su existencia fue autorizada conforme al art. 546; para otros, esa autorización rige solo para las constituidas en Chile y son capaces sin ella.`,
'Naranjo p. 21');

K('a07','a','Explique la incapacidad por dañado ayuntamiento (art. 964).',
`Es incapaz de suceder a una persona quien, **antes de deferírsele** la herencia o legado, fue **condenado** judicialmente por el crimen de **dañado ayuntamiento** con ella, o fue **acusado** de él si se siguió condenación, y **no contrajo matrimonio** con efectos civiles con ella.
- **Relativa**; rige en la sucesión **testada e intestada**.
- El Código Penal no tipifica este "crimen": se entiende referido al **incesto** (y antes, al adulterio, hoy despenalizado).
- Se exige condena o acusación seguida de condena (hoy, formalización), para evitar acusaciones interesadas.`,
'Naranjo p. 21 · art. 964');

K('a08','a','Explique la incapacidad del eclesiástico confesor (art. 965).',
`Por testamento **otorgado durante la última enfermedad** (la que causó la muerte), no puede recibir herencia o legado, ni aun como albacea fiduciario:
- el **eclesiástico** que confesó al difunto **durante esa enfermedad** o **habitualmente en los dos últimos años** anteriores al testamento;
- la **orden, convento o cofradía** de que sea miembro;
- sus **deudos** por consanguinidad o afinidad hasta el **3º grado**.
**No comprende** a la **iglesia parroquial** del testador ni la porción que habrían heredado **abintestato**.
Es **relativa** y solo rige en la sucesión **testada**.`,
'Naranjo pp. 21–22 · art. 965');

K('a09','a','Explique la incapacidad del notario y testigos del testamento (art. 1061).',
`No vale disposición testamentaria a favor:
- del **escribano** que autoriza el testamento o funcionario que haga sus veces, su **cónyuge**, ascendientes, descendientes, hermanos, cuñados, **empleados o asalariados**;
- de cualquiera de los **testigos**, su cónyuge, ascendientes, descendientes, hermanos o cuñados.
Fundamento: resguardar la **imparcialidad** de quienes intervienen. Es relativa y propia de la sucesión **testada**.`,
'Naranjo p. 22 · art. 1061');

K('a10','a','¿Qué características tienen las incapacidades para suceder?',
`1. Son de **orden público**: no pueden **perdonarse** ni renunciarse.
2. Operan **de pleno derecho**: no requieren declaración judicial (la sentencia es declarativa).
3. **Sanción**: nulidad (absoluta) de la disposición a favor del incapaz, **aunque se disfrace** de contrato oneroso o por **interpósita persona** (art. **966**). El testaferro es indigno (art. 972).
4. El incapaz **nada adquiere** por sucesión ni transmite; puede adquirir por **prescripción** (10 años, art. **967**).
5. **Pasan contra terceros**: estos no adquieren más derechos que el incapaz; procede la **reivindicación** aun contra terceros de buena fe.
6. Son de **derecho estricto**.`,
'Naranjo pp. 22, 24–25 · arts. 966, 967');

K('a11','a','¿Qué es la indignidad para suceder?',
`**Falta de mérito** para suceder. Es una **sanción civil** que consiste en excluir de la sucesión a un asignatario por haber cometido actos que importan un **grave atentado contra el difunto** o un serio **olvido de los deberes** para con él.
Se relaciona con el **desheredamiento**: la indignidad la impone la **ley**; el desheredamiento, el **testamento**. La doctrina llama al desheredamiento "indignidad testamentaria".
Las causales son **taxativas** y de derecho estricto: arts. 968 a 972, y otros (1300, 1327, 1329).`,
'Naranjo pp. 22–23 · Manual §29');

K('a12','a','¿Cuáles son las causales de indignidad del art. 968?',
`1ª El que cometió **homicidio, femicidio, parricidio o infanticidio** en la persona del difunto, intervino por **obra o consejo**, o lo dejó **perecer pudiendo salvarlo**.
2ª El que cometió **atentado grave** contra la vida, honor o bienes del causante, su **cónyuge**, ascendientes o descendientes, **probado por sentencia ejecutoriada**.
3ª El **consanguíneo hasta el 6º grado** que no lo **socorrió** en demencia o destitución, pudiendo.
4ª El que por **fuerza o dolo** obtuvo una disposición testamentaria o le **impidió testar**.
5ª El que **dolosamente detuvo u ocultó** un testamento (el dolo se **presume** por el mero hecho).
Estas causales constituyen **injuria atroz**: privan además de los alimentos (arts. 324, 979).`,
'Naranjo p. 23 · art. 968 (texto vigente, Ley 21.675)');

K('a13','a','¿Cuáles son las causales de indignidad fuera del art. 968?',
`- **Art. 969**: el **mayor de edad** que no acusó a la justicia el **homicidio** del difunto tan pronto pudo (cesa si la justicia ya procedía; no rige para cónyuge, ascendientes, descendientes o parientes hasta 3º grado del autor).
- **Art. 970**: ascendiente o descendiente llamado abintestato que no pidió **tutor o curador** para el impúber, demente o sordo/sordomudo que no puede darse a entender, durante **un año** entero.
- **Art. 971**: **tutor o curador** testamentario que se excusa sin causa legítima; **albacea** que se excusa sin probar inconveniente grave (no alcanza a los asignatarios forzosos en su cuantía).
- **Art. 972**: quien prometió al difunto hacer pasar bienes a un **incapaz**.
- **Art. 1300**: albacea removido por **dolo**. **Art. 1327**: partidor testamentario que no acepta. **Art. 1329**: partidor condenado por **prevaricación**.`,
'Naranjo pp. 23–24');

K('a14','a','¿Qué situaciones se asemejan a indignidades según Somarriva?',
`1. Padre o madre que, por su negligencia, no hizo el **inventario** del art. 124 de los bienes del hijo que administra (impedimento de segundas nupcias): pierde el derecho a sucederle como **legitimario o abintestato** (art. 127).
2. **Cónyuge** que dio lugar a la **separación judicial** por su culpa (arts. 994, 1182).
3. **Padre o madre** cuya filiación fue determinada judicialmente **contra su oposición** (arts. 203, 994, 1182).
4. Quienes participaron en el **falso parto o suplantación** del hijo (art. 219).
(El art. 114, que privaba de la mitad de la herencia al menor que se casaba sin consentimiento, fue **derogado por la Ley 21.515**.)`,
'Naranjo p. 24 · CC vigente',
'Naranjo aún cita el art. 114: está derogado desde 2022.');

K('a15','a','¿Qué características tiene la indignidad?',
`1. Mira al **interés del causante**: puede **perdonarse** (art. 973).
2. **No opera de pleno derecho**: debe **declararse en juicio** a instancia de cualquier interesado en la exclusión (art. 974). Mientras no se declara, el indigno es reputado heredero o legatario.
3. Declarada, el indigno **restituye** la asignación con accesiones y **frutos**, como poseedor de **mala fe** (art. 974 inc. 2º).
4. Se **purga en 5 años** de posesión de la herencia o legado (art. 975).
5. **Pasa a los herederos** del indigno con el mismo vicio, por el tiempo que falte (art. 977).
6. **No pasa contra terceros de buena fe** (art. 976).
7. Es **siempre relativa**.`,
'Naranjo p. 25 · arts. 973–977');

K('a16','a','¿Quiénes pueden pedir la declaración de indignidad?',
`Cualquiera de los **interesados en la exclusión** del heredero o legatario indigno (art. 974):
- el **sustituto** designado para el caso de faltar el indigno;
- los **coherederos** (aumenta su porción);
- los **herederos**, respecto del legatario indigno (se eximen de pagar el legado);
- los **acreedores** de un heredero digno, para aumentar la cuota de su deudor.`,
'Naranjo p. 25 · art. 974');

K('a17','a','Paralelo entre incapacidad e indignidad.',
`- **Interés**: incapacidad = **orden público**; indignidad = **interés privado** del causante.
- **Perdón**: no / sí (art. 973).
- **Operación**: de **pleno derecho** / requiere **sentencia** (art. 974).
- **Efecto**: impide **adquirir** / impide **conservar**.
- **Clases**: absoluta o relativa / **siempre relativa**.
- **Transmisión**: el incapaz nada transmite / el indigno transmite **con el vicio** (art. 977).
- **Terceros**: pasa contra todos / solo contra los de **mala fe** (art. 976).
- **Saneamiento**: prescripción **extraordinaria de 10 años** (art. 967) / **5 años** de posesión (art. 975).`,
'Naranjo p. 26 · Manual §30');

K('a18','a','¿Qué reglas son comunes a la incapacidad e indignidad (arts. 978 y 979)?',
`- **Art. 978**: los **deudores hereditarios o testamentarios** no pueden oponer al demandante la excepción de incapacidad o indignidad. Se justifica para la indignidad (requiere sentencia); se critica para la incapacidad, que opera de pleno derecho (Claro Solar).
- **Art. 979**: la incapacidad o indignidad **no priva de los alimentos** legales, **salvo** en los casos del art. **968** (injuria atroz, art. 324).`,
'Naranjo p. 26 · arts. 978, 979');

K('a19','a','¿Puede ser indigno el conviviente civil sobreviviente? (posición de la profesora)',
`La **LAUC no reguló** la indignidad del conviviente civil. Como las causales son de **derecho estricto** y no admiten analogía, la profesora sostiene que el conviviente civil que incurra en conductas que harían indigno al cónyuge **no se hace indigno** y conserva sus derechos (Gómez de la Torre, 2016).
Sí puede ser **desheredado** por las **tres primeras** causales del art. 1208 (art. 17 LAUC).`,
'Manual §29, §182',
'Posición propia de la profesora: suele preguntarla.');

/* ===== APERTURA, DELACIÓN Y TRANSMISIÓN (1ª parte) ===== */
K('o01','o','¿Qué es la apertura de la sucesión y qué la produce?',
`**Hecho jurídico**, consecuencia de la muerte de una persona, en cuya virtud sus bienes pasan a sus sucesores. Somarriva: el hecho que **habilita a los herederos para tomar posesión** de los bienes hereditarios y se los transmite en propiedad.
**Causa**: la **muerte**, natural o presunta. En la muerte presunta, con el decreto de **posesión provisoria** se abre y publica el testamento; con el de **posesión definitiva** pueden hacerse valer los derechos subordinados a la muerte (arts. 84, 90, 91).`,
'Naranjo p. 6 · Manual §17');

K('o02','o','¿En qué momento se abre la sucesión y por qué es importante ese momento?',
`"Al momento de su muerte" (art. **955**). Importancia:
1. Determina la **capacidad y dignidad** de los asignatarios (art. 962).
2. Fija los **derechos** en que se sucede (los que tenía el causante en ese momento).
3. Comienza la **indivisión**; a ese momento se retrotrae el efecto declarativo de la **partición** (art. 1344).
4. A él se retrotraen la **aceptación o repudiación** (art. 1239).
5. Determina la **ley aplicable** a la validez de las disposiciones (arts. 18–19 LERL; la capacidad de testar, art. 1006).
6. Desde entonces son lícitos los **pactos** sobre la sucesión (arts. 1909, 1910).
Comurientes (art. **958**): si no se sabe el orden de fallecimientos (art. 79), **ninguno sucede** a los otros.`,
'Naranjo pp. 6–7 · arts. 955, 958');

K('o03','o','¿Dónde se abre la sucesión, qué ley la rige y qué importancia tiene el lugar?',
`Art. **955**: se abre "en su **último domicilio**; salvos los casos expresamente exceptuados", y "se regla por la **ley del domicilio** en que se abre; salvas las excepciones legales". (Excepción al art. 16: ley única para toda la sucesión.)
Importancia del lugar:
- **Competencia**: el juez del último domicilio conoce de la apertura y publicación del testamento (art. 1009), inventarios, tasaciones, petición de herencia, desheredamiento, posesión efectiva (art. 148 COT); si la sucesión se abrió en el extranjero, el último domicilio en Chile o el del solicitante (art. 149 COT).
- **Ley aplicable**.
Excepción de lugar: la **muerte presunta** (último domicilio **en Chile**).`,
'Naranjo pp. 7–8 · Manual §17–19');

K('o04','o','¿Cuáles son las excepciones a la regla de que la sucesión se rige por la ley del último domicilio?',
`1. **Art. 15 Nº 2**: los chilenos quedan sujetos a las leyes chilenas en las obligaciones y derechos que nacen de las relaciones de familia, respecto de su **cónyuge y parientes chilenos** (supone bienes en Chile).
2. **Art. 998**: en la sucesión abintestato de un **extranjero** que fallece dentro o fuera del país, los **chilenos** tienen los mismos derechos que según las leyes chilenas les corresponderían en la sucesión intestada de un chileno, y pueden pedir que se les **adjudique en los bienes del extranjero existentes en Chile**. Igual para la sucesión de un chileno que deja bienes en el extranjero.
3. **Muerte presunta**: ley del último domicilio en Chile.
4. **Ley 16.271 art. 27**: aunque rija ley extranjera, debe pedirse en Chile la **posesión efectiva** de los bienes situados en el país (efecto **tributario**).`,
'Naranjo pp. 8–9 · arts. 15, 998');

K('o05','o','¿Qué es la delación y cuándo se produce?',
`Art. **956** inc. 1º: "el **actual llamamiento de la ley a aceptarla o repudiarla**".
Momento:
- **Regla general**: al **fallecer** el causante, si el llamamiento no es condicional.
- **Excepción**: si el llamamiento es bajo **condición suspensiva**, al **cumplirse** la condición (solo en asignaciones testamentarias: las legales son siempre puras y simples). La condición **resolutoria** no posterga la delación.
- **Contraexcepción**: condición **de no hacer algo que dependa de la sola voluntad del asignatario** (negativa y meramente potestativa): se defiere a la **muerte**, dando el asignatario **caución** de restituir la cosa con accesiones y frutos si contraviene; salvo que el testador haya dispuesto que, mientras penda, la cosa pertenezca a otro asignatario.`,
'Naranjo pp. 9–10 · art. 956');

K('o06','o','Distinga apertura, delación y pronunciamiento del asignatario.',
`Somarriva distingue **tres etapas**:
1. **Apertura**: hecho jurídico producido por la muerte.
2. **Delación**: llamamiento actual a aceptar o repudiar; es **consecuencia** de la apertura y normalmente coincide con ella (asignación pura y simple).
3. **Pronunciamiento**: aceptación o repudiación.
Teorías sobre el estado del asignatario mientras no se pronuncia: **romana** (nada adquiere hasta aceptar) y **germánica** (adquiere con la delación). Chile adquiere por el solo ministerio de la ley.`,
'Naranjo p. 9');

K('o07','o','¿Qué efectos produce la delación?',
`a) Nace para el asignatario un **derecho potestativo de opción**: aceptar o repudiar ("todo asignatario puede aceptar o repudiar libremente", art. 1225).
b) El asignatario **no adquiere por la aceptación**: adquiere al abrirse la sucesión (herencia o legado de especie) o por la **tradición** (legado de género).
c) La aceptación es, en consecuencia, la **renuncia al derecho de repudiar**.
d) Si no se pronuncia, nada pasa, salvo que se le constituya en **mora de declarar** (arts. 1232, 1233).
e) Los efectos de la aceptación o repudiación se **retrotraen** a la delación (art. 1239).`,
'Naranjo p. 10');

K('o08','o','¿Qué situaciones pueden darse si el asignatario fallece después de la delación?',
`a) **Aceptó** y luego fallece: transmite la **asignación** ya adquirida.
b) **Repudió** y luego fallece: **nada transmite**; se entiende que nunca tuvo derecho.
c) Fallece **sin pronunciarse**: transmite a sus herederos la **facultad de aceptar o repudiar** → **derecho de transmisión** (art. 957).`,
'Naranjo p. 27 · Manual §24');

K('o09','o','¿Qué es el derecho de transmisión?',
`Art. **957**: si el heredero o legatario, cuyos derechos a la sucesión no han prescrito, **fallece antes de haber aceptado o repudiado** la herencia o legado que se le ha deferido, **transmite a sus herederos el derecho de aceptar o repudiar**, aun cuando fallezca sin saber que se le había deferido. No se puede ejercer este derecho **sin aceptar la herencia** de la persona que lo transmite.
Concepto: facultad que tiene el heredero que acepta la herencia de su causante de aceptar o repudiar la asignación que se defirió a ese causante, fallecido sin pronunciarse.
Es **aplicación de los principios generales**: la facultad de opción es un derecho más del patrimonio transmisible. Opera en sucesión **testada e intestada**, en **herencias y legados**.`,
'Naranjo p. 27 · art. 957');

K('o10','o','¿Quiénes intervienen en el derecho de transmisión?',
`1. **Primer causante**: deja la herencia o legado que no alcanzó a ser aceptado o repudiado.
2. **Transmitente o transmisor**: después de deferida la asignación, fallece sin pronunciarse.
3. **Transmitido**: aceptando la herencia del transmisor, adquiere el derecho de aceptar o repudiar la asignación del primer causante.`,
'Naranjo p. 27');

K('o11','o','¿Cuáles son los requisitos del derecho de transmisión?',
`**Respecto del transmisor**:
- Debe haber **fallecido sin aceptar ni repudiar**.
- Debe ser **capaz y digno** de suceder al **primer causante**.
- Puede ser **heredero o legatario** del primer causante.
- Sus derechos **no deben haber prescrito**.
**Respecto del transmitido**:
- Debe ser **heredero** (testamentario o abintestato) del transmisor; no basta ser legatario.
- Debe ser **capaz y digno** de suceder al **transmisor** (basta existir al abrirse la sucesión de este).
- Debe **aceptar la herencia del transmisor** (art. 957 inc. 2º). Puede aceptarla y **repudiar** lo transmitido.`,
'Naranjo pp. 27–28 · Manual §24');

/* ===== ACERVOS ===== */
K('c01','c','¿Qué es la teoría de los acervos y cuáles son los acervos?',
`"Acervo" es la masa hereditaria dejada por el causante (art. 959 los hace sinónimos). La **teoría de los acervos** es el conjunto de reglas para determinar esa masa; es una **garantía** para las asignaciones que la ley protege: toda asignación se calcula sobre un acervo.
Cinco acervos (el mismo patrimonio en distintas etapas):
- **Reales**: 1) común o **bruto**; 2) **ilíquido**; 3) **líquido** o partible.
- **Imaginarios**: 4) **primer** acervo imaginario (art. 1185); 5) **segundo** acervo imaginario (art. 1186). Pueden o no existir.`,
'Naranjo p. 28 · Manual §39');

K('c02','c','¿Qué es el acervo bruto y qué operación exige?',
`El patrimonio del difunto **confundido** con bienes de otras personas: bienes propios o gananciales del cónyuge (sociedad conyugal), contratos de **sociedad**, **sucesiones anteriores indivisas** u otro motivo (también la comunidad del AUC).
Exige la **separación de patrimonios** (art. **1341**): se procede en primer lugar a separarlos, dividiendo las especies comunes según las reglas de la partición. El resultado es el acervo ilíquido.`,
'Naranjo p. 28 · Manual §40 · art. 1341');

K('c03','c','Defina el acervo ilíquido y el acervo líquido.',
`- **Acervo ilíquido**: patrimonio del causante **separado** de los bienes con que estaba confundido, al que **aún no se deducen las bajas generales**.
- **Acervo líquido** (o partible): el patrimonio del difunto separado de otros patrimonios y **deducidas las bajas generales**. "El resto es el acervo líquido de que dispone el testador o la ley" (art. 959 inc. final). Sobre él se calculan las asignaciones (salvo que proceda formar acervos imaginarios).`,
'Naranjo p. 29 · art. 959');

K('c04','c','¿Qué son las bajas generales y cuáles son (art. 959)?',
`Deducciones necesarias para llevar a efecto las disposiciones del difunto o de la ley; se llaman **generales** porque gravitan sobre **todos los asignatarios**. Se deducen del acervo, "inclusos los créditos hereditarios", **en este orden**:
1º Las **costas de publicación del testamento**, si lo hubiere, y las demás **anexas a la apertura** de la sucesión.
2º Las **deudas hereditarias**.
3º Los **impuestos fiscales** que gravaren toda la masa hereditaria.
4º Las **asignaciones alimenticias forzosas**.
La Ley 19.585 suprimió la porción conyugal como baja general.`,
'Naranjo p. 29 · art. 959');

K('c05','c','¿Qué comprenden los gastos de apertura de la sucesión (959 Nº 1)?',
`Gastos de apertura del **testamento cerrado**, de poner por escrito el **testamento verbal**, de los **avisos** de apertura (art. 1285), de la **posesión efectiva**, de **guarda y aposición de sellos**, de **inventario**, y de la **partición**, incluidos los **honorarios de albaceas y partidores** en cuanto no excedan los aranceles.
La Ley 16.271 (art. 4) completa la enumeración y agrega los gastos de **última enfermedad y entierro** del causante.`,
'Naranjo p. 29 · Ley 16.271 art. 4');

K('c06','c','¿Qué hay que saber de las deudas hereditarias y los impuestos como bajas generales?',
`**Deudas hereditarias** (Nº 2): las que el causante tenía **en vida**. Si los bienes no alcanzan, los asignatarios nada reciben (derecho de prenda general). Se pagan antes que las **testamentarias** (art. 1374). Para asegurar su pago, el albacea debe dar **aviso** de la apertura (art. 1285) y exigir la **hijuela pagadora de deudas** (art. 1286); el partidor debe formarla aunque no se la pidan (art. 1336).
**Impuestos** (Nº 3): hoy **no existe** un impuesto que grave toda la masa; la Ley 16.271 grava **cada asignación** por separado.`,
'Naranjo p. 30');

K('c07','c','¿Cuándo los alimentos forzosos no son baja general?',
`Por regla general son baja general (arts. 959 Nº 4, 1168). No lo son:
a) Cuando el testador impuso la obligación de pagarlos a **determinados partícipes** (art. 1168).
b) En la parte en que son **excesivos** atendidas las fuerzas del patrimonio: el exceso se imputa a la porción de **libre disposición** (art. 1171 inc. 2º).
Los alimentos **voluntarios** (a quien no tiene derecho legal) no son baja general: se imputan a la libre disposición (art. 1171 inc. 1º). Algunos autores consideran los alimentos forzosos como deudas hereditarias.`,
'Naranjo p. 30 · arts. 1168, 1171');

K('c08','c','¿Qué relación tienen las bajas generales con la liquidación de la sociedad conyugal?',
`Hay bajas que son a la vez bajas de la liquidación de la sociedad conyugal (gastos de partición, deudas hereditarias que son también sociales). En la sucesión solo deben deducirse en la **proporción que correspondía al cónyuge difunto**.
En el régimen de **participación en los gananciales**, hay que determinar si el causante es **acreedor o deudor** del crédito de participación.`,
'Naranjo p. 31');

/* ===== INTESTADA ===== */
K('r01','r','Defina la sucesión intestada y señale su fundamento.',
`Transmisión que hace la **ley** de los bienes, derechos y obligaciones transmisibles de una persona difunta (art. 952: si se sucede "en virtud de la ley", la sucesión se llama intestada o abintestato).
**Fundamento**: las normas legales son el **testamento tácito o presunto** del causante: el legislador interpreta su **voluntad presunta**, llamando a quienes se supone habría querido favorecer. Son **supletorias** de su voluntad expresa.`,
'Naranjo p. 32 · Manual §45');

K('r02','r','¿Cuándo tiene lugar la sucesión intestada (art. 980)?',
`"Las leyes reglan la sucesión en los bienes de que el difunto no ha dispuesto, o si dispuso, no lo hizo conforme a derecho, o no han tenido efecto sus disposiciones."
**A) No dispuso**: murió sin testamento o lo revocó; solo hizo declaraciones; instituyó herederos de cuota que no completan la unidad; solo hizo legados; instituyó un usufructo sin decir a quién va la nuda propiedad; constituyó un fideicomiso sin designar fiduciario.
**B) No dispuso conforme a derecho**: testamento nulo (total o parcialmente); violación de asignaciones forzosas atacada por la **acción de reforma**.
**C) Sus disposiciones no tuvieron efecto**: falla la condición suspensiva o se cumple la resolutoria; el asignatario repudia, es incapaz o indigno; **caduca** un testamento privilegiado.`,
'Naranjo pp. 32–33 · art. 980');

K('r03','r','¿Quiénes son llamados a la sucesión intestada?',
`Art. **983**: los **descendientes** del difunto, sus **ascendientes**, el **cónyuge** sobreviviente, sus **colaterales**, el **adoptado** en su caso y el **Fisco**.
A ellos se suma el **conviviente civil** sobreviviente: "será heredero intestado y legitimario del otro y concurrirá en su sucesión de la misma forma y gozará de los mismos derechos que corresponden al cónyuge sobreviviente" (art. **16 Ley 20.830**).
Son llamados por **parentesco (consanguinidad), matrimonio o convivencia civil**. La ley no atiende al **sexo, primogenitura ni origen** de los bienes (arts. 981, 982).`,
'Naranjo p. 32 · Manual §47 · art. 983');

K('r04','r','¿Qué principios rigen la sucesión intestada?',
`- **Subsidiariedad** (art. 996): se aplica en lo que no dispuso válidamente el testador.
- **Unidad del patrimonio** (art. 981).
- **Igualdad**: sin distinción de sexo ni primogenitura (art. 982).
- Llamamiento por **relación conyugal, convivencia civil o consanguínea**.
- **Exclusión y preferencia** entre órdenes.
- **Grado más próximo** dentro de cada orden.
- **Colateralidad limitada** al 6º grado.
- **Prevalencia de la doble conjunción**.
- **Armonización** con la sucesión forzosa (art. 1183).
- **Clausura**: a falta de todos, sucede el Fisco (art. 995).`,
'Manual §48 · Ayudantía 1');

K('r05','r','¿De qué formas se sucede abintestato? Distinga sucesión por cabezas y por estirpes.',
`Art. **984** inc. 1º: "Se sucede abintestato, ya por **derecho personal**, ya por **derecho de representación**."
- **Derecho personal**: se sucede a nombre propio, por el lugar que realmente se ocupa en la familia. Se divide **por cabezas**: toman entre todos y por partes iguales la porción a que la ley los llama, salvo que la ley establezca otra división (art. 985 inc. 2º; p. ej., art. 990).
- **Representación**: se sucede ocupando el lugar de otro. Se divide **por estirpes**: cualquiera sea el número de representantes, toman entre todos y por partes iguales la porción que habría correspondido al representado (art. 985 inc. 1º).`,
'Naranjo pp. 33, 35 · arts. 984, 985');

K('r06','r','Defina el derecho de representación y explique sus elementos.',
`Art. **984** inc. 2º: "La representación es una **ficción legal** en que se supone que una persona tiene el **lugar** y por consiguiente el **grado de parentesco** y los **derechos hereditarios** que tendría su padre o madre, si éste o ésta **no quisiese o no pudiese suceder**."
- Es **ficción**: supone un hecho irreal (un grado de parentesco que no se tiene).
- La definición es redundante: el lugar implica el grado, y los derechos derivan del grado.
- Procede cuando el padre o madre **no puede o no quiere** suceder: por eso **se puede representar a una persona viva**.
- Inc. 3º: se puede representar a quien, si hubiese querido o podido suceder, habría sucedido por representación (opera **hasta el infinito** en la descendencia).
Finalidad: acercar al nieto al abuelo cuando falta el padre, superando la regla de que el grado más próximo excluye al más remoto.`,
'Naranjo pp. 33–35 · art. 984');

K('r07','r','¿Quiénes intervienen en el derecho de representación?',
`1. **Causante**: la persona de cuya herencia se trata.
2. **Representado**: el que no puede o no quiere suceder y cuyo lugar queda vacante.
3. **Representante**: el **descendiente** del representado que ocupa su lugar.`,
'Naranjo p. 34');

K('r08','r','¿Cuáles son los requisitos del derecho de representación?',
`1. Que se trate de una **sucesión intestada** (ubicación del art. 984; no se adquieren legados por representación).
2. Que **falte el representado**: no puede (premuerto, incapaz, indigno, desheredado) o no quiere (repudió) suceder (art. 987).
3. Que el **representante sea descendiente** del representado: nunca opera a favor de ascendientes.
4. **Parentesco entre representado y causante**: el representado debe ser **descendiente o hermano** del causante (art. 986: solo en la descendencia del difunto y de sus hermanos).
5. Que el representante sea **capaz y digno de suceder al causante**.
6. (Manual) Que el representante **acepte la herencia del causante**.`,
'Naranjo pp. 34–35 · Manual §54 · arts. 984, 986, 987');

K('r09','r','¿Procede la representación en la sucesión testada?',
`Por regla general **no**: en la testada, si falta el asignatario, no ocupan su lugar sus descendientes, sino que recogen la asignación los herederos abintestato (o hay acrecimiento o sustitución). Art. 1162: los descendientes del asignatario descendiente no se entienden sustituidos.
**Excepciones** (aparentes según la doctrina):
- **Art. 1064**: lo dejado indeterminadamente a los **parientes** se entiende dejado a los consanguíneos de grado más próximo según el orden de la sucesión intestada, "teniendo lugar el derecho de representación".
- **Art. 1183**: los **legitimarios** "concurren, y son excluidos y representados según el orden y reglas de la sucesión intestada".`,
'Naranjo p. 34 · Manual §54');

K('r10','r','¿A quiénes se puede representar (art. 987)?',
`Se puede representar:
- al **premuerto** (caso normal);
- al **incapaz**, **indigno**, **desheredado** o al que **repudió** la herencia del difunto;
- al **ascendiente cuya herencia se ha repudiado** (el representante puede repudiar la herencia del representado y aun así representarlo).
Fundamento: no es justo que los hijos respondan por los actos de los padres.
Los bienes que el hijo adquiere representando al padre incapaz, indigno o desheredado forman un **peculio** sobre el cual ese padre no tiene usufructo ni administración.`,
'Naranjo p. 34 · art. 987');

K('r11','r','¿El representante sucede al causante o al representado? Consecuencias.',
`Sucede **directamente al causante**, en virtud de un llamamiento especial de la ley, no por intermedio del representado. Consecuencias:
a) Puede **repudiar** la herencia del representado y, sin embargo, representarlo (art. 987).
b) Puede ser **incapaz o indigno** respecto del representado: basta que sea capaz y digno respecto del **causante**.
c) **No responde de las deudas del representado**, salvo que haya aceptado su herencia; si lo persiguen sus acreedores, puede oponer **tercería** (art. 520 Nº 2 CPC).
La **profesora** rechaza la tesis tradicional de que la representación sea una "sucesión indirecta" por esta misma razón.`,
'Naranjo p. 35 · Manual §53');

K('r12','r','¿Qué efectos produce la representación y cómo incide en el impuesto?',
`- El representante ocupa el **lugar, grado y derechos** del representado, **sin poder tener más** de lo que a este le habría correspondido.
- Se hereda **por estirpes** (art. 985 inc. 1º).
- **Impuesto** (art. 3 Ley 16.271): se paga el impuesto que habría correspondido al **representado**, calculado sobre la asignación de este (no sobre la de cada representante). Como la tasa es progresiva, puede perjudicarlos.
- **Retroactividad**: la representación es una **mera expectativa** (art. 20 LERL), sujeta al cambio de legislación.`,
'Naranjo pp. 35–36');

K('r13','r','Paralelo entre el derecho de transmisión y el derecho de representación.',
`- **Naturaleza**: transmisión = aplicación de reglas generales | representación = **ficción**, excepción legal.
- **Origen del derecho**: el transmitido adquiere como heredero del **transmisor** | el representante, **directamente del causante**.
- **Ámbito**: testada e intestada | **intestada** (salvo arts. 1064 y 1183).
- **Parentesco**: no se exige | representante **descendiente**; representado **hijo o hermano** del causante.
- **Sobrevivencia**: el transmisor **sobrevive** al primer causante | el representado puede haber muerto antes o estar vivo.
- **Capacidad y dignidad**: respecto del **transmisor** | respecto del **causante**.
- **Aceptación**: exige aceptar la herencia del transmisor | no exige aceptar la del representado.
- **Objeto**: herencias y legados | solo herencias.`,
'Naranjo p. 36 · Manual §57');

/* ===== ÓRDENES ===== */
K('d01','d','¿Qué es un orden de sucesión y qué características tiene?',
`Conjunto de herederos que, considerados colectivamente, **excluyen o son excluidos** por otros herederos, también considerados colectivamente. Somarriva: "grupo de parientes que excluye a otro en la sucesión, pero que a su vez puede ser excluido por otro conjunto de parientes".
Características:
- Para saber los derechos de alguien se mira primero **a qué orden pertenece**, y dentro del orden, el **grado** (el más próximo excluye al remoto, salvo representación).
- En cada orden hay herederos **determinantes** (fijan el orden; deben faltar todos para pasar al siguiente) y **concurrentes** (concurren pero no lo fijan).
- Las asignaciones legales son siempre **a título universal**.
- Tras la Ley 19.585 existe **un solo** orden de sucesión (antes: regular e irregular).`,
'Naranjo pp. 36–37 · Manual §58–59');

K('d02','d','¿Cuáles son los órdenes de sucesión?',
`1. **De los descendientes** (hijos personalmente o representados), con quienes **concurre** el cónyuge o conviviente civil.
2. **Del cónyuge o conviviente civil y los ascendientes** de grado más próximo.
3. **De los hermanos** (personalmente o representados).
4. **De los demás colaterales** hasta el 6º grado.
5. **Del Fisco**.`,
'Naranjo pp. 37–40 · arts. 988–995');

K('d03','d','Primer orden: ¿quiénes lo integran y quién lo determina?',
`Art. **988** inc. 1º: "Los hijos excluyen a todos los otros herederos, a menos que hubiere también cónyuge sobreviviente, caso en el cual éste concurrirá con aquéllos."
- **Determinantes**: los **hijos** (de cualquier filiación determinada: matrimonial, no matrimonial, adoptivos de la Ley 19.620) **personalmente o representados**; por eso se le llama "de los descendientes".
- **Concurrente**: el **cónyuge** o **conviviente civil** sobreviviente. No fijan el orden: si lo fijaran, nunca se pasaría al segundo orden.
- No se incluyen los hijos de **filiación no determinada** ni los adoptados simples de la Ley 18.703 (salvo procedimiento especial).`,
'Naranjo pp. 37–38 · art. 988');

K('d04','d','Primer orden: ¿cuánto lleva el cónyuge o conviviente civil que concurre con hijos?',
`Art. **988** incs. 2º a 5º:
- **Regla general**: el **doble** de lo que por legítima rigorosa o efectiva corresponda a **cada hijo**.
- **Un solo hijo**: una cuota **igual** a la legítima rigorosa o efectiva de ese hijo.
- **Mínimo**: "en ningún caso" bajará de la **cuarta parte de la herencia**, o de la cuarta parte de la **mitad legitimaria** en su caso. Correspondiéndole esa cuarta parte, el resto se divide entre los hijos por partes iguales.
- La cuarta parte se calcula teniendo en cuenta el art. **996** (imputando lo que reciba por testamento).
El mínimo opera cuando concurre con **más de 6 hijos** (con 6 hijos, el doble ya equivale a 2/8 = 1/4).`,
'Naranjo pp. 37–38 · Manual §62 · art. 988');

K('d05','d','Calcule la cuota del cónyuge con 1, 2, 3, 6 y 8 hijos.',
`- **1 hijo**: cónyuge 1/2, hijo 1/2.
- **2 hijos**: la herencia en 4 partes → cónyuge **2/4**, cada hijo 1/4.
- **3 hijos**: 5 partes → cónyuge **2/5**, cada hijo 1/5.
- **6 hijos**: 8 partes → cónyuge **2/8 = 1/4**, cada hijo 1/8.
- **8 hijos**: el doble daría 2/10 < 1/4 → opera el mínimo: cónyuge **1/4** y los **3/4** se dividen entre los 8 hijos (3/32 cada uno).
Regla práctica: número de hijos + 2 = número de partes; el cónyuge lleva 2.`,
'Naranjo p. 38 · Ayudantía 1 · art. 988');

K('d06','d','¿Qué porcentaje mínimo tiene asegurado el cónyuge sobreviviente casado en sociedad conyugal en una sucesión intestada?',
`Si todos los bienes son sociales, el cónyuge sobreviviente tiene asegurado el **62,5%**:
- **50%** por **gananciales** (no es herencia: es su mitad de la sociedad conyugal);
- al menos **1/4** del otro 50% (la herencia) = **12,5%**.
Tras la Ley 19.585 puede llevar a la vez **gananciales y legítima**.`,
'Naranjo p. 38 · Manual §181');

K('d07','d','¿Cuándo el cónyuge o conviviente civil no sucede abintestato?',
`- Si dio motivo a la **separación judicial por su culpa** (art. **994** inc. 1º); tampoco es legitimario (art. 1182). Sin culpa, conserva sus derechos.
- Si el matrimonio se **anuló**, aun putativo: no hay derechos hereditarios.
- Si hubo **divorcio**: ya no son cónyuges (art. 60 LMC).
- La **separación de hecho** no produce efecto hereditario.
- **Conviviente civil**: pierde sus derechos si el AUC **expiró** antes de la delación (art. 18 LAUC) o si fue desheredado por las tres primeras causales del art. 1208 (art. 17 LAUC).`,
'Naranjo p. 38 · Manual §62, §182');

K('d08','d','Segundo orden: ¿quiénes suceden y cómo se reparte la herencia (art. 989)?',
`"Si el difunto **no ha dejado posteridad**, le sucederán el **cónyuge sobreviviente** y sus **ascendientes de grado más próximo**."
- Concurriendo ambos: la herencia se divide en **tres partes**: **dos para el cónyuge** y **una para los ascendientes**.
- A falta de ascendientes, el cónyuge lleva **todo**; a falta de cónyuge, los ascendientes llevan **todo**.
- Habiendo **un solo ascendiente** en el grado más próximo, lleva todos los bienes o toda la porción de los ascendientes.
- **No opera la representación** respecto de los ascendientes: el grado más próximo excluye al más remoto (los padres excluyen a los abuelos).
- Determinantes: **cónyuge y ascendientes** (basta uno de ellos para no pasar al tercer orden).`,
'Naranjo pp. 38–39 · art. 989');

K('d09','d','¿Qué ascendientes no suceden abintestato al descendiente?',
`1. El padre o madre cuya **filiación fue determinada judicialmente contra su oposición** (arts. 203, 994 inc. 2º; tampoco son legitimarios, art. 1182), salvo **restablecimiento**: el hijo, alcanzada su plena capacidad, por **escritura pública** (efectos desde la subinscripción; irrevocable) o **testamento** (efectos desde su muerte). La exclusión no alcanza a los ascendientes de ese padre o madre (se critica).
2. El que infringió el **impedimento de segundas nupcias**: por su negligencia no se hizo el inventario del art. 124 (art. **127**).
3. Quien participó en el **falso parto o suplantación** (art. **219**).
El hijo, en cambio, hereda aunque su reconocimiento haya sido forzado.`,
'Naranjo p. 39 · Manual §65 · arts. 127, 203, 219, 994');

K('d10','d','Tercer orden: ¿cómo suceden los hermanos (art. 990)?',
`"Si el difunto no hubiere dejado descendientes, ni ascendientes, ni cónyuge, le sucederán sus **hermanos**."
- Se comprenden los de **simple conjunción** (solo por padre o por madre), pero su porción es la **mitad** de la del hermano de **doble conjunción** (carnal) (art. 990 inc. 2º; art. 41).
- Opera la **representación** (art. 986): los **sobrinos** representan al hermano que falta y por ello excluyen a los demás colaterales.
Ejemplo: 1 hermano de doble y 1 de simple conjunción → 2/3 y 1/3. Sin hermanos de doble conjunción, los de simple llevan todo.`,
'Naranjo p. 39 · Manual §66–67 · arts. 41, 990');

K('d11','d','Cuarto orden: ¿cómo suceden los demás colaterales (art. 992)?',
`A falta de descendientes, ascendientes, cónyuge y hermanos, suceden "los otros colaterales de **grado más próximo**, sean de simple o doble conjunción, hasta el **sexto grado inclusive**".
- El colateral de grado más próximo **excluye siempre** a los otros.
- Los de **simple conjunción** llevan la **mitad** de la porción de los de doble conjunción.
- No hay **representación** (solo opera en la descendencia de los hermanos).
- Solo colaterales por **consanguinidad**: los afines (p. ej., el cuñado) no son herederos abintestato (CA Santiago, 1951; Corte Suprema).
- No se aplica mientras existan representantes de hermanos.`,
'Naranjo pp. 39–40 · Manual §68–69 · art. 992');

K('d12','d','Quinto orden: ¿cuándo y a qué título sucede el Fisco?',
`Art. **995**: "A falta de todos los herederos abintestato designados en los artículos precedentes, sucederá el Fisco" (**herencia vacante**).
- **Naturaleza**: la doctrina y jurisprudencia mayoritarias sostienen que sucede **como heredero**, en las mismas condiciones que cualquier otro (puede aceptar o repudiar; debe aceptar con beneficio de inventario, art. 1250). Otra tesis: los bienes quedan sin dueño y pasan al Estado por su poder soberano (importa para el art. 157 del Código de Bustamante).
- Quien denuncia una herencia vacante puede recibir una **recompensa de hasta el 30%** (DL 1.939).
- En los demás órdenes, el Fisco está "representado" por el **impuesto** a la herencia.`,
'Naranjo p. 40 · Manual §70–71 · art. 995');

K('d13','d','¿Qué derechos hereditarios tiene el adoptado?',
`- **Ley 19.620**: el adoptado tiene el **estado civil de hijo** del o los adoptantes, con todos los derechos y deberes recíprocos; sucede en el **primer orden** como cualquier hijo.
- **Adoptados simples** (Ley 18.703) y por el antiguo sistema: no tienen derechos hereditarios, salvo procedimiento especial; sus derechos se rigen por la ley respectiva (art. 983 inc. 2º).
- Somarriva: el **adoptante** sería heredero abintestato del adoptado, por la reciprocidad del estado de hijo.`,
'Naranjo pp. 38–40');

/* ===== MIXTA ===== */
K('m01','m','¿Qué es la sucesión mixta y cómo se regula (art. 996)?',
`La sucesión en los bienes de una persona puede ser **parte testamentaria y parte intestada** (art. 952 inc. 2º); p. ej., el testador solo hace legados o solo dispone de la cuarta de libre disposición.
Art. **996**:
1. Se cumplen primero las **disposiciones testamentarias** y el **remanente** se adjudica a los herederos abintestato según las reglas generales.
2. Quienes suceden a la vez por testamento y abintestato **imputan** a su porción intestada lo que reciben por testamento, sin perjuicio de **retener** toda la porción testamentaria si excede a la otra.
3. Prevalece la **voluntad expresa** del testador, "en lo que de derecho corresponda".
4. Todo ello una vez **enteradas totalmente las legítimas y mejoras**.`,
'Naranjo p. 40 · Manual §72–76 · art. 996');

K('m02','m','Explique la regla de imputación del art. 996 inc. 2º con un ejemplo.',
`La asignación testamentaria se entiende hecha **a cuenta** de lo que corresponde al heredero abintestato (en pago total o parcial).
Ejemplo (Naranjo): dos hermanos A y B, activo de 10 millones; el testamento deja 4 a A.
- Imputación: los 4 se imputan a lo que le toca abintestato (5): **A y B reciben 5 cada uno**.
- Si el testamento deja **6** a A: A **retiene** los 6 (excede su porción) y B recibe 4.
- Si el testador dice expresamente que los 4 **no se imputan**: A recibe 4 + 3 = **7** y B **3** (prevalece la voluntad expresa, inc. 3º, porque no hay asignatarios forzosos).`,
'Naranjo pp. 40–41 · Manual §75');

K('m03','m','¿Qué significa "en lo que de derecho corresponda" en el art. 996 inc. 3º?',
`Que la voluntad expresa del testador de **no imputar** lo asignado por testamento solo prevalece dentro de los **límites legales**: no puede vulnerar las **asignaciones forzosas**. Si hay legitimarios, la no imputación no puede lesionar lo que por ley corresponde a los demás (ICA Valparaíso, 2017).
Somarriva: el art. 996 inc. 3º exige **declaración expresa** para hacer compatible la sucesión testamentaria íntegra con la abintestato íntegra.
Inc. 4º: el reparto del remanente se aplica una vez **enteradas las legítimas y mejoras**.`,
'Naranjo p. 41 · Manual §75–76');
