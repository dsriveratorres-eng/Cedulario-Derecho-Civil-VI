'Naranjo p. 127 · Manual §276, §279 · arts. 1276–1278');

K('e06','e','¿Cómo se clasifican los albaceas?',
`1. Por su **designación**: la doctrina distingue testamentarios, legítimos y dativos, pero el Código solo reconoce los **testamentarios**; a falta de ellos, ejecutan los **herederos** (art. 1271).
2. Por la **extensión** del encargo: **universales** (todas las disposiciones) y **particulares** (algunas). Si no se expresan facultades, se entiende **particular**, con las facultades legales.
3. Por la **naturaleza** del encargo: **generales** y **fiduciarios** (encargos secretos, art. 1311).
4. Por sus **facultades**: **con tenencia** de bienes (art. **1296**) y **sin tenencia** de bienes (regla general: la tenencia debe conferirse **expresamente**).`,
'Naranjo p. 128 · Manual §280');

K('e07','e','¿Qué atribuciones tiene todo albacea?',
`1. **Velar por la seguridad de los bienes** (art. **1284**): guarda bajo llave y sello del dinero, muebles y papeles mientras no haya **inventario solemne**, y cuidar que este se haga, salvo que todos los herederos, capaces, acuerden unánimemente no hacerlo.
2. **Dar aviso** de la apertura por **tres avisos** en un diario (art. **1285**), para informar a los acreedores.
3. **Exigir la hijuela pagadora de deudas** en la partición (art. **1286**), se le haya encomendado o no el pago de deudas. La omisión de 2 y 3 lo hace **responsable** de todo perjuicio a los acreedores; la misma obligación pesa sobre los herederos presentes capaces (art. **1287**).
4. **Pagar deudas** con intervención de los herederos o del curador (art. 1288); los acreedores conservan acción contra los herederos si el albacea está en **mora** (art. 1289).
5. **Pagar legados** no impuestos a determinado asignatario (art. **1290**), pidiendo a los herederos el dinero o especies; los herederos pueden pagar ellos mismos. Avisar los legados de beneficencia, piedad religiosa o utilidad pública (art. 1291); exigir caución (art. 1292).
6. **Vender** muebles y subsidiariamente inmuebles si no hay dinero para deudas o legados, con anuencia de los herederos y en **pública subasta** (arts. **1293**, 1294).
7. **Comparecer en juicio** solo para **defender la validez del testamento** o llevar a efecto las disposiciones que le incumban, con intervención de los herederos (art. **1295**).`,
'Naranjo pp. 128–129 · Manual §281 · arts. 1284–1295');

K('e08','e','¿Qué es el albacea con tenencia de bienes y qué facultades tiene?',
`Art. **1296**: "El testador podrá dar a el albacea la **tenencia** de cualquiera parte de los bienes o de todos ellos. El albacea tendrá en este caso las **mismas facultades y obligaciones que el curador de la herencia yacente**; pero **no será obligado a rendir caución** sino en el caso del artículo 1297."
- Caución solo si herederos, legatarios o fideicomisarios tienen **justo temor** sobre la seguridad de los bienes (art. **1297**).
- Mantiene además las facultades del albacea sin tenencia (art. 1296 inc. final).
- Si existe y aceptó, la herencia **no se declara yacente** (art. 1240).
- **Facultades judiciales**: por el tenor del 1296 se discute; **Somarriva**: tiene las del **curador de la herencia yacente** (puede cobrar créditos y ser demandado), pues si no, los acreedores no tendrían contra quién dirigirse.`,
'Naranjo pp. 129–130 · Manual §280–281 · arts. 1296, 1297');

K('e09','e','¿Qué prohibiciones afectan al albacea?',
`1. **Ejecutar disposiciones ilegales** (art. **1301**): "Se prohíbe a el albacea llevar a efecto ninguna disposición del testador en lo que fuere contraria a las leyes, **so pena de nulidad**, y de **considerársele culpable de dolo**" (presunción de dolo que facilita su **remoción**, art. 1300).
2. **Actos en que tenga interés** (art. **1294** → art. **412**): requieren autorización de los demás albaceas no implicados o del juez; los **inmuebles** no puede comprarlos ni arrendarlos ni aun así (se extiende a cónyuge, ascendientes y descendientes). La jurisprudencia lo excluye si el albacea es **heredero** (puede adjudicárselos).
**Sanción de la compra de bienes de la sucesión**:
- **412** (prohibición) → **nulidad absoluta** (Elorriaga).
- **1800 → 2144** (norma especial de compraventa, no prohibitiva) → **nulidad relativa** (jurisprudencia y manual) o **inoponibilidad** (**Somarriva**, que aplica el 1800 por analogía con el mandato).`,
'Naranjo p. 130 · Manual §282 · arts. 1294, 1301, 1800');

K('e10','e','¿Cuál es la responsabilidad del albacea y cómo rinde cuenta?',
`- Responde hasta de la **culpa leve** (art. **1299**).
- Varios albaceas: **solidariamente** (art. **1281**), salvo exoneración o división de atribuciones: es solidaridad pasiva legal.
- Responde de los perjuicios por omitir **avisos** o la **hijuela pagadora** (arts. 1287, 1336).
- **Remoción** (art. **1300**): por **culpa grave o dolo**, a petición de herederos o curador; en caso de **dolo** además se hace **indigno**, indemniza perjuicios y **restituye la retribución**.
- **Cuenta** (art. **1309**): al cesar, dará cuenta **justificada**; "**No podrá el testador relevarle** de esta obligación". Puede rendirla voluntariamente (ante el juez o el partidor) o ser obligado por herederos o legatarios.
- **Saldo** (art. 1310 → art. 424): los intereses corren **contra** el albacea de pleno derecho desde que se cierra la cuenta; **a su favor**, desde que los pida.`,
'Naranjo pp. 130–131 · Manual §283 · arts. 1299, 1300, 1309, 1310');

K('e11','e','¿Cómo se extingue el albaceazgo?',
`1. **Llegada del plazo** (arts. 1303–1305): el fijado por el testador o **un año**; prorrogable por el **juez**. El plazo es sin perjuicio de la partición (art. 1306).
2. **Cumplimiento del encargo**: los herederos pueden pedir la terminación desde que lo evacuó aunque no venza el plazo (art. **1307**). Los legados o fideicomisos pendientes **no** prolongan el albaceazgo, salvo que el testador le haya dado la **tenencia** de esas especies (se limita a ella) (art. **1308**).
3. **Remoción** por culpa grave o dolo (art. **1300**).
4. **Incapacidad sobreviniente** (art. **1275**).
5. **Muerte** del albacea: no se transmite (art. **1279**).
6. **Renuncia** con causa legítima (art. **1278**).
7. **Caducidad** del nombramiento por no comparecer en el plazo judicial (art. **1276**).`,
'Naranjo p. 131 · Manual §284');

K('e12','e','¿Qué es el albacea fiduciario y qué requisitos exige el albaceazgo fiduciario?',
`Art. **1311**: "El testador puede hacer **encargos secretos y confidenciales** al heredero, a el albacea, y a cualquiera otra persona, para que se invierta en uno o más **objetos lícitos** una cuantía de bienes de que pueda **disponer libremente**. El encargado de ejecutarlos se llama albacea fiduciario."
**Requisitos** (art. **1312**; faltando cualquiera, no vale la disposición):
1. Designarlo **en el testamento**.
2. Tener las calidades para ser **albacea y legatario** del testador (no obsta ser eclesiástico secular fuera del art. 965).
3. Expresar en el testamento las **especies o la suma determinada** que se le entregará.
**Límite** (art. **1313**): no más de **la mitad** de la porción de que el testador pudo disponer **a su arbitrio** (si hay legitimarios, la mitad de la cuarta de libre disposición).
No es **asignatario modal**: el beneficiado es la persona favorecida con el encargo, que no necesita ser persona cierta y determinada.`,
'Naranjo p. 132 · Manual §285–286 · arts. 1311–1313');

K('e13','e','¿Qué obligaciones y particularidades tiene el albacea fiduciario?',
`1. **Juramento** ante el juez (art. **1314**): que el encargo no tiene por objeto hacer pasar bienes a un **incapaz** ni invertirlos en un **objeto ilícito**, y que desempeñará fiel y legalmente el cargo. Debe **preceder** a la entrega; si se niega, **caduca** el encargo.
2. **Caución** (art. **1315**): con justo motivo, a instancia de un albacea general, heredero o curador, puede ser obligado a depositar o afianzar **la cuarta parte** de lo recibido, para responder a la **acción de reforma** o a las **deudas hereditarias**; se devuelve tras **4 años** desde la apertura.
3. **No revela ni rinde cuenta** (art. **1316**): "no estará obligado en ningún caso a revelar el objeto del encargo secreto, ni a dar cuenta de su administración".
**Naturaleza**: albacea especial al que se aplican las reglas generales en lo compatible (Somarriva, Claro Solar); **Rodríguez Grez**: es en realidad un **legatario**.`,
'Naranjo pp. 132–133 · Manual §287–288 · arts. 1314–1316');

/* ===== PARTICIÓN ===== */
K('q01','q','¿Qué es la partición y cuál es su fundamento?',
`Al morir el causante con varios herederos se forma una **comunidad** sobre la herencia: cada heredero tiene un **derecho de cuota** que no se radica en bienes determinados.
Concepto (CS): "**conjunto complejo de actos** encaminados a poner fin al estado de indivisión mediante la **liquidación y distribución** entre los copartícipes del caudal poseído proindiviso en partes o lotes que guarden **proporción** con los derechos cuotativos de cada uno".
**Fundamento**: el Código mira con **recelo** la indivisión (descuido de la cosa, mala explotación, conflictos); la concibe como estado **transitorio**.
**Ámbito**: reglas de aplicación general (arts. 1317–1353): comunidad hereditaria, **sociedad conyugal** (art. 1776), **sociedad** civil (art. 2115) y **cuasicontrato de comunidad** (art. 2313).`,
'Naranjo pp. 133–134 · Manual §289–291');

K('q02','q','¿Qué es la acción de partición y cuáles son sus características (art. 1317)?',
`Art. **1317** inc. 1º: "**Ninguno** de los coasignatarios de una cosa universal o singular **será obligado a permanecer en la indivisión**; la partición del objeto asignado **podrá siempre pedirse** con tal que los coasignatarios no hayan estipulado lo contrario."
Concepto: la que compete a los coasignatarios para que se ponga **término a la indivisión** (Somarriva prefiere hablar del "derecho a pedir la partición").
**Características**:
1. **Personal**: contra **todos** los comuneros; al omitido la partición le es **inoponible**.
2. **Imprescriptible** ("siempre").
3. **Irrenunciable** (salvo el pacto temporal de indivisión).
4. **Derecho absoluto**: no requiere expresar causa; no cabe abuso del derecho.
5. No declara una situación existente: **transforma** la situación jurídica (crea un nuevo estatuto sobre los bienes).`,
'Naranjo pp. 135–136 · Manual §293–294 · art. 1317');

K('q03','q','¿Qué hechos impiden ejercer la acción de partición?',
`1. **Pacto de indivisión** (art. **1317** inc. 2º): "No puede estipularse proindivisión por **más de cinco años**, pero cumplido este término **podrá renovarse** el pacto." Es consensual, no se presume y debe ser acordado por los **coasignatarios**: el **testador no puede imponerla** (es "estipulación"). Lo que exceda de 5 años no obliga.
2. **Indivisión forzada** (art. 1317 inc. 3º): no se aplica a los **lagos de dominio privado**, los **derechos de servidumbre**, ni a las cosas que la ley manda mantener indivisas, **como la propiedad fiduciaria**. Otros: **medianería**, bienes comunes de la **copropiedad inmobiliaria**, tumbas y mausoleos.`,
'Naranjo p. 136 · Manual §292 · art. 1317');

K('q04','q','¿Quiénes pueden pedir la partición?',
`1. Los **comuneros**: herederos de cualquier clase. **No** los **legatarios**.
2. Los **herederos de un coasignatario** fallecido después de la delación (art. **1321**): forman **una sola persona** y obran juntos o por procurador común.
3. El **cesionario** de la cuota (art. **1320**).
4. El **acreedor** de un comunero: puede pedir la enajenación de la cuota o que se **liquide** la comunidad con su intervención (arts. 519, 524 CPC), salvo motivo legal o grave perjuicio.
5. **Asignatario bajo condición suspensiva**: **no** mientras penda; los demás pueden partir **asegurándole** lo que le corresponda (art. **1319**).
6. **Fideicomiso**: solo el **fiduciario**, no el fideicomisario; si todos son fiduciarios hay indivisión forzada.
7. **Usufructo**: cada usufructuario respecto de sus co-usufructuarios y cada nudo propietario respecto de los suyos.`,
'Naranjo p. 137 · Manual §295 · arts. 1319–1321');

K('q05','q','¿Qué capacidad se requiere para pedir la partición (art. 1322)?',
`Art. **1322**: "Los **tutores y curadores**, y en general los que administran bienes ajenos por disposición de la ley, **no podrán proceder a la partición** de las herencias o de los bienes raíces en que tengan parte sus pupilos, **sin autorización judicial**. Pero el **marido** no habrá menester esta autorización para provocar la partición de los bienes en que tenga parte su mujer: le bastará el **consentimiento de su mujer**, si no estuviere imposibilitada de prestarlo, o el de la **justicia en subsidio**." (inc. 2º según Ley 21.515).
- Lo mismo para los padres respecto del hijo (art. 255).
- Solo se exige cuando el representante **provoca** la partición; no si la pide otro comunero ni si se hace **de común acuerdo**.
- Sanción por omitir la autorización: **nulidad relativa** (rescisión).
- Mujer casada en sociedad conyugal: Somarriva admite que pida por sí sola, obligando solo los bienes que administra.`,
'Naranjo pp. 138–139 · Manual §296 · art. 1322');

K('q06','q','¿Cómo puede hacer la partición el propio causante (art. 1318)?',
`Art. **1318**: "Si el difunto ha hecho la partición por **acto entre vivos o por testamento**, se pasará por ella **en cuanto no fuere contraria a derecho ajeno**. En especial, la partición se considerará contraria a derecho ajeno si no ha respetado el derecho que el artículo **1337, regla 10ª**, otorga al cónyuge sobreviviente" (y al conviviente civil, Ley 20.830).
- **Entre vivos**: sin solemnidad especial (cualquier modo auténtico). **Por testamento**: con sus solemnidades y revocable.
- "Derecho ajeno": no puede lesionar las **asignaciones forzosas**.
- Con legitimarios, el art. **1197** le impide **tasar** las especies; Somarriva (siguiendo a Gaete): igual puede partir; el legitimario perjudicado puede reclamar (inoponibilidad o **acción de reforma**).
- Requiere **aprobación judicial** si hay ausentes sin apoderado o personas bajo guarda (art. **1342**).`,
'Naranjo pp. 139–140 · Manual §298 · arts. 1318, 1342');

K('q07','q','¿Qué requisitos exige la partición hecha de común acuerdo por los coasignatarios (art. 1325)?',
`Art. **1325** inc. 1º: "Los coasignatarios podrán hacer la partición **por sí mismos** si **todos concurren** al acto, aunque entre ellos haya personas que no tengan la libre disposición de sus bienes, siempre que **no se presenten cuestiones que resolver** y **todos estén de acuerdo** sobre la manera de hacer la división."
Requisitos:
1. Sin **cuestiones previas** (quiénes son interesados, sus derechos, bienes comunes).
2. **Acuerdo** sobre la forma de dividir.
3. **Tasación por peritos** (inc. 2º); el art. **657 CPC** permite omitirla por acuerdo unánime, aun con incapaces, si se trata de **muebles**, de fijar un **mínimo** para subastar inmuebles con postores extraños, o si hay **antecedentes** que justifiquen la apreciación.
4. **Aprobación judicial** si hay ausentes sin apoderado o personas bajo guarda (art. **1342**).
Es **consensual**; requiere **escritura pública** si se adjudican inmuebles (para inscribir).`,
'Naranjo pp. 140–142 · Manual §299 · art. 1325');

K('q08','q','¿Quién puede ser partidor y qué calidad tiene?',
`Art. **1323**: "Sólo pueden ser partidores los **abogados habilitados** para ejercer la profesión y que tengan la **libre disposición de sus bienes**. Son aplicables a los partidores las causales de **implicancia y recusación** que el Código Orgánico de Tribunales establece para los jueces."
- La partición es materia de **arbitraje forzoso** (art. **227** COT).
- El partidor es por regla general **árbitro de derecho** (art. 235 COT). Puede ser **arbitrador** solo si todas las partes son plenamente capaces (art. 224 COT); con incapaces, a lo más **mixto** con autorización judicial.
- No pueden serlo jueces letrados, ministros, fiscales judiciales ni notarios (COT).
- Sanción del nombramiento de inhábil: discutida (nulidad procesal o absoluta); Ramos Pazos y la **profesora**: **nulidad absoluta** (norma prohibitiva).`,
'Naranjo p. 142 · Manual §302–303 · art. 1323');

K('q09','q','¿Quiénes pueden nombrar partidor y con qué reglas?',
`1. **El causante** (art. **1324**): por **instrumento público entre vivos** o por **testamento**; vale aunque recaiga en un **albacea, coasignatario** o persona con causal de **implicancia o recusación**, si cumple los demás requisitos; pero cualquier interesado puede pedir al juez que lo **inhabilite** (trámite de recusaciones).
2. **Los coasignatarios de común acuerdo** (art. **1325** inc. 3º–4º): aunque no tengan la libre disposición; puede recaer en albacea o coasignatario. Solo pueden inhabilitarlo causas **sobrevinientes** al nombramiento. Si hay incapaces, el nombramiento requiere **aprobación judicial** (art. **1326**); la mujer casada en sociedad conyugal: basta su consentimiento o el de la justicia.
3. **El juez** (art. 1325 inc. final; art. **646 CPC**): a petición de cualquiera, cita a comparendo y nombra como a los **peritos**; no puede designar a ninguna de las **dos primeras personas** propuestas por las partes; solo árbitro de **derecho**; no un coasignatario. Pedir este comparendo es la forma práctica de **ejercer la acción de partición**.`,
'Naranjo pp. 143–145 · Manual §301 · arts. 1324–1326');

K('q10','q','¿Cómo acepta el partidor y de qué plazo dispone?',
`- **Aceptación**: no está obligado a aceptar (art. **1327**); si fue **nombrado en testamento** y no acepta, se aplica lo dicho para el albacea (**indignidad**, salvo inconveniente grave).
- Art. **1328**: "El partidor que acepta el encargo, **deberá declararlo así**, y **jurará** desempeñarlo con la debida fidelidad, y en el menor tiempo posible." Su omisión es un vicio **procesal** (incompetencia), que se reclama durante el juicio (incidente o casación en la forma).
- **Plazo** (art. **1332**): **dos años** desde la aceptación. El **testador no puede ampliarlo** (sí reducirlo); los **coasignatarios** pueden ampliarlo o restringirlo aun contra la voluntad del testador. Se descuenta el tiempo de **interrupción total** de la jurisdicción (art. **647 CPC**).
- Laudo dictado fuera de plazo: **casación en la forma** por incompetencia, salvo prórroga de las partes.`,
'Naranjo pp. 145–146 · Manual §304 · arts. 1327, 1328, 1332');

K('q11','q','¿De qué materias conoce el partidor y cuáles quedan para la justicia ordinaria?',
`**Partidor** (art. **651 CPC**): formación e impugnación de **inventarios y tasaciones**, **cuentas** de albaceas, comuneros y administradores, y **todas las cuestiones que deben servir de base** a la partición y que la ley no somete expresamente a la justicia ordinaria. Rige primero la **voluntad de las partes**.
**Justicia ordinaria** (nunca el partidor):
- Art. **1330**: antes de partir, se deciden las controversias sobre **derechos a la sucesión** por testamento o abintestato, **desheredamiento**, **incapacidad o indignidad**: la partición se **suspende**.
- Art. **1331**: cuestiones sobre la **propiedad de objetos** en que alguien alegue derecho exclusivo: **no se retarda** la partición (si se deciden a favor de la masa, **suplemento**, art. 1349), salvo que recaigan sobre **parte considerable** y lo pidan asignatarios de **más de la mitad** de la masa.
**Ambos**: **administración proindiviso** (justicia ordinaria mientras no se constituya el compromiso o falte el árbitro, art. 653 CPC); acreedores con derechos sobre los bienes (opción, art. 656 CPC); ejecución del laudo (art. 635 CPC; apremios, la ordinaria). El partidor carece de **imperio**.`,
'Naranjo pp. 146–148 · Manual §306 · arts. 1330, 1331');

K('q12','q','¿Qué responsabilidad tiene el partidor?',
`- Art. **1329**: responde hasta la **culpa leve**; en caso de **prevaricación** declarada por juez competente, queda sujeto a **indemnización**, a las **penas** del delito y se constituye **indigno** (como el albacea, art. 1300).
- Art. **1336**: aun cuando el causante haya hecho la partición y aunque nadie se lo pida, debe formar la **hijuela pagadora de deudas**; su omisión lo hace responsable ante los **acreedores**.
- Debe velar por el pago del **impuesto** a la herencia.
- No puede **comprar** bienes de la partición (art. 1798; Somarriva contra un fallo que lo admitió).
- **Honorarios**: baja general; los fija en el **laudo** y es reclamable ante la Corte (art. **665 CPC**). Las **costas comunes** son de cargo de los interesados **a prorrata** (art. **1333**).`,
'Naranjo pp. 148–149 · Manual §308 · arts. 1329, 1333, 1336');

K('q13','q','¿Cuáles son las características del juicio particional y cómo se tramita?',
`**Características**:
1. Prima la **voluntad de las partes** (híbrido **juicio-contrato**: art. 1348).
2. Juicio **doble**: cada comunero puede ser demandante o demandado.
3. Juicio **complejo**: contiene tantos juicios simples como cuestiones que sirven de base a la partición.
4. De **cuantía indeterminada**.
**Tramitación**: comienza con la **aceptación y juramento**; se designa **actuario**; se ventila en **audiencias verbales o comparendos** (art. 649 CPC):
- **Primer comparendo**: organiza la partición; acuerdos por **unanimidad**; notificación personal.
- **Ordinarios**: acuerdos válidos aunque no estén todos, salvo revocar acuerdos o materias que exigen unanimidad (art. 650 CPC).
- **Extraordinarios**: solo lo convocado.
Cuadernos: **actas**, documentos e incidentes. Termina con el **laudo y ordenata**.`,
'Naranjo pp. 150–152 · Manual §307–308');

K('q14','q','¿Qué operaciones comprende la partición: liquidación y distribución?',
`Art. **1337** inc. 1º: "El partidor **liquidará** lo que a cada uno de los coasignatarios se deba, y procederá a la **distribución** de los efectos hereditarios."
- **Liquidación**: determinar el **valor en dinero** de lo que corresponde a cada uno. Previamente: **separación de patrimonios** confundidos (bienes del cónyuge, sociedad conyugal, sociedades, sucesiones anteriores, art. **1341**) → acervo ilíquido; **bajas generales** → acervo líquido; **acervos imaginarios** si procede.
- **Distribución**: **adjudicar** los bienes hasta enterar la cuota de cada uno (hijuelas). Primero la **voluntad unánime** de las partes (art. **1334**); a falta de acuerdo, las **reglas del art. 1337**.
Trámites previos usuales: apertura del testamento, **posesión efectiva**, **inventario**, **tasación**, curador especial al incapaz en conflicto de interés con su representante.`,
'Naranjo pp. 149–150, 152 · Manual §309–311 · arts. 1334, 1337, 1341');

K('q15','q','¿Cuáles son las principales reglas de distribución del art. 1337?',
`- **1ª** Especie que **no admite división** o desmerece: tiene mejor derecho **el que más ofrezca**; cualquier coasignatario puede pedir **licitadores extraños**; el precio se divide a prorrata.
- **2ª** Si nadie ofrece más que la tasación y compiten varios: el **legitimario** es **preferido** al que no lo es.
- **3ª–5ª** Fundos: porciones **continuas**; continuidad con fundos propios; **servidumbres** necesarias.
- **6ª** Con consentimiento, separar **usufructo, uso o habitación** para darlos a cuenta de la asignación.
- **7ª** Guardar la **posible igualdad**: cosas de la **misma naturaleza y calidad** o lotes.
- **8ª** En los lotes, **equivalencia y semejanza**, sin dividir lo que no admite cómoda división.
- **9ª** Reclamar contra la composición de los lotes **antes del sorteo**.
- **10ª** Adjudicación preferente al **cónyuge** (y conviviente civil) sobreviviente.
- **11ª** Cumpliendo los arts. 1322 y 1326, **no se requiere aprobación judicial** para estas operaciones aunque haya incapaces.`,
'Naranjo pp. 152–155 · Manual §312 · art. 1337');

K('q16','q','¿En qué consiste el derecho de adjudicación preferente del cónyuge sobreviviente (art. 1337 regla 10ª)?',
`"Con todo, el **cónyuge sobreviviente** tendrá derecho a que su **cuota hereditaria** se entere **con preferencia** mediante la adjudicación en favor suyo de la **propiedad del inmueble en que resida** y que sea o haya sido la **vivienda principal de la familia**, así como del **mobiliario que lo guarnece**, siempre que ellos **formen parte del patrimonio del difunto**."
- Si exceden su cuota: puede pedir derechos de **habitación y uso**, **gratuitos y vitalicios**, sobre lo no adjudicado; la habitación es **inoponible** a terceros de buena fe mientras no se **inscriba** en el CBR.
- "**No puede transferirse ni transmitirse**": personalísimo (y renunciable).
- Se extiende al **conviviente civil** sobreviviente (Ley 20.830).
- La partición del causante que no lo respete es **contraria a derecho ajeno** (art. 1318).
Fundamento (Ley 19.585): evitar que el viudo deba abandonar el hogar al partir.`,
'Naranjo p. 155 · Manual §312 · arts. 1318, 1337 regla 10ª');

K('q17','q','¿Cómo se distribuyen en la partición los frutos y las deudas?',
`**Frutos percibidos** durante la indivisión (art. **1338**):
1. **Asignatarios de especies**: frutos y accesiones **desde la apertura**, salvo asignación desde día cierto o bajo condición suspensiva (desde ese día o el cumplimiento).
2. **Legatarios de cantidades o géneros**: solo desde la **mora** del obligado, a costa del moroso.
3. **Herederos**: todos los frutos de la masa **a prorrata**, deducidos los de los asignatarios de especies.
4. La deducción recae sobre toda la masa, salvo que el testador haya gravado a un asignatario determinado.
**Frutos pendientes** al adjudicar: parte de la especie y se consideran en su valor (art. 1339).
**Deudas**: se dividen de pleno derecho (art. 1354); un heredero puede tomar **mayor cuota** con acuerdo de los otros, pero los acreedores **no están obligados** a conformarse (art. **1340**).`,
'Naranjo pp. 156–157 · Manual §313–314 · arts. 1338–1340');

K('q18','q','¿Qué son los alcances y cómo se garantizan (hipoteca legal)?',
`**Alcance**: suma en que el valor de lo adjudicado a un comunero **excede** lo que le corresponde; debe pagarla.
- Art. **660 CPC**: salvo acuerdo unánime, quien reciba adjudicaciones por más del **80%** de lo que probablemente le corresponda, paga **de contado** el exceso (fijado prudencialmente por el partidor).
- Art. **662 CPC**: en las adjudicaciones de **inmuebles**, si no se paga de contado ese exceso, **se entiende constituida hipoteca** sobre lo adjudicado para asegurar los alcances; el conservador la **inscribe** al inscribir la adjudicación. Puede reemplazarse por otra **caución** calificada por el partidor.
- Requiere **inscripción** (sin ella, inoponible).
- Los valores recibidos a cuenta devengan **intereses** (art. 661 CPC).
- La existencia de alcance **no impide** que haya adjudicación.`,
'Naranjo pp. 155–156, 160 · Manual §315–316');

K('q19','q','¿Qué es el laudo y ordenata y qué recursos proceden?',
`Art. **663 CPC**: los resultados se consignan en un **laudo** o sentencia final, que resuelve los **puntos de hecho y de derecho** que sirven de base a la distribución, y en una **ordenata** o liquidación, con los **cálculos numéricos** necesarios ("el laudo reducido a números"; hijuelas con su "ha de haber" y su "entero").
- **Aprobación judicial** (art. **1342**): si hay **ausentes** sin apoderado o personas bajo **tutela o curaduría**; la da el juez del último domicilio del causante.
- **Notificación** (art. 664 CPC): basta notificar el **hecho de su pronunciamiento**; si requiere aprobación, se notifica la resolución que la aprueba o modifica.
- **Recursos**: **apelación** y **casación en la forma**, en **15 días**. Los honorarios fijados en el laudo se **reclaman** ante la Corte, que resuelve en única instancia (art. 665 CPC).
- Efectuada la partición, se entregan los **títulos** (art. 1343).`,
'Naranjo pp. 157–159 · Manual §308 · art. 1342');

K('q20','q','¿Qué es la adjudicación y en qué consiste el efecto declarativo de la partición?',
`**Adjudicación**: acto por el cual se entrega a un comunero un bien determinado equivalente a sus derechos en la comunidad. Supone que el adjudicatario **ya era comunero** del bien (si lo adquiere un tercero en remate, es **compraventa**).
Art. **1344**: "Cada asignatario **se reputará haber sucedido inmediata y exclusivamente al difunto** en todos los efectos que le hubieren cabido, y **no haber tenido jamás parte alguna** en los otros efectos de la sucesión. Por consiguiente, si alguno de los coasignatarios ha **enajenado** una cosa que en la partición se adjudica a otro de ellos, se podrá proceder como en el caso de la **venta de cosa ajena**."
En la posesión, art. **718**. Es un efecto **retroactivo** a la muerte: una **ficción** que borra la indivisión. La adjudicación es **título declarativo** (art. 703), no traslaticio: el adjudicatario adquiere **por sucesión por causa de muerte**, no por tradición de los comuneros.
Opera de pleno derecho, en toda clase de partición, aunque haya **alcance** o el comunero se adjudique en remate con postores extraños.`,
'Naranjo pp. 159–160 · Manual §318–320 · arts. 1344, 718');

K('q21','q','¿Cuáles son las principales consecuencias del efecto declarativo?',
`1. La enajenación de una cosa común por un comunero, adjudicada luego a otro, se trata como **venta de cosa ajena** (inoponible; el adjudicatario puede reivindicar) (art. 1344 inc. 2º).
2. La **hipoteca** constituida por un comunero queda a firme solo si se le adjudica el bien; si no, rige la hipoteca de cosa ajena (art. **2417**).
3. Los **derechos reales** constituidos por un comunero solo subsisten si el bien se le adjudica (art. 718).
4. El **embargo** de la cuota caduca si el bien se adjudica a otro; y **no impide** la adjudicación: **no hay objeto ilícito** del art. 1464, porque la adjudicación **no es enajenación**.
5. No se aplican las formalidades de **enajenación de inmuebles de incapaces** ni los impuestos de las enajenaciones.
6. Puede adjudicarse aunque no se hayan hecho las inscripciones de la posesión efectiva.
7. En sociedad conyugal, el inmueble adjudicado ingresa al **haber propio** y el mueble al haber relativo o aparente.
8. La interrupción de la prescripción a favor de un comunero aprovecha a los demás (art. 2504).
Límite: no desconoce los actos realizados por la **unanimidad** de los comuneros.`,
'Naranjo p. 161 · Manual §321');

K('q22','q','¿Cómo se dividen los créditos de la sucesión: art. 1344 vs. art. 1526 Nº 4?',
`Problema: el art. **1344** sugiere que los **créditos** (efectos) quedan indivisos hasta la partición y se adjudican; el art. **1526 Nº 4** inc. final dispone que los herederos del acreedor, si no actúan conjuntamente, solo pueden exigir **su cuota**, lo que sugiere división de pleno derecho.
**Solución mayoritaria** (armoniza ambos):
- **Respecto del deudor** (1526): el crédito se divide **de pleno derecho** entre los herederos.
- **Entre los herederos** (1344): el crédito permanece **indiviso** y puede adjudicarse a uno en la partición.`,
'Naranjo pp. 160–161 · arts. 1344, 1526');

K('q23','q','¿En qué consiste la obligación de garantía en la partición?',
`Art. **1345**: "El partícipe que sea **molestado** en la posesión del objeto que le cupo en la partición, o que haya sufrido **evicción** de él, lo denunciará a los otros partícipes para que concurran a hacer cesar la molestia, y tendrá derecho para que le **saneen la evicción**. Esta acción prescribirá en **cuatro años** contados desde el día de la evicción."
- Fundamento: la **igualdad** entre los copartícipes (el efecto declarativo los desvincula).
- Solo **evicción**; **no vicios redhibitorios**.
- **No procede** (art. **1346**): causa **sobreviniente** a la partición; **renuncia** expresa; **culpa** del partícipe.
- **Pago** (art. **1347**): a prorrata de las cuotas; "La porción del **insolvente** grava a todos a prorrata de sus cuotas; **incluso el que ha de ser indemnizado**."`,
'Naranjo pp. 161–162 · Manual §322–325 · arts. 1345–1347');

K('q24','q','¿Cómo puede impugnarse la partición: nulidad y rescisión por lesión?',
`Art. **1348**: "Las particiones se **anulan o se rescinden** de la misma manera y según las mismas reglas que los **contratos**. La rescisión por causa de **lesión** se concede al que ha sido perjudicado en **más de la mitad de su cuota**."
- Puede haber nulidad **absoluta o relativa**, total o parcial, e **inoponibilidad** (p. ej., comunero omitido). En la partición ante partidor hay además **nulidades procesales**, que se alegan **durante el juicio** (no después de ejecutoriado el laudo); las civiles, durante o después.
- **Lesión**: se mira la **hijuela completa**; procede en toda clase de partición. Los otros partícipes pueden **atajarla** ofreciendo y asegurando el **suplemento** en **numerario** (art. **1350**).
- **Omisión involuntaria** de bienes: no rescinde; **suplemento de partición** (art. **1349**).
- No puede demandar el partícipe que **enajenó** su porción en todo o parte, salvo **error, fuerza o dolo** que le perjudique (art. **1351**).
- **Prescripción**: reglas generales (art. **1352**).
- Quien no puede o no quiere anular conserva los **otros recursos** para ser **indemnizado** (art. **1353**).`,
'Naranjo pp. 162–163 · Manual §326–330 · arts. 1348–1353');

K('q25','q','¿Procede la acción resolutoria contra la partición si el adjudicatario no paga el alcance?',
`**No** (la condición resolutoria **tácita** no se aplica):
1. Se opone el **efecto declarativo**: el adjudicatario no adquirió de los otros comuneros.
2. El art. **1348** solo menciona nulidad y rescisión.
3. El art. **1489** se limita a los **contratos bilaterales**.
4. El 1489 es excepcional (condición tácita como elemento de la naturaleza).
5. La ley da otro resguardo: la **hipoteca legal** (art. 662 CPC).
6. El art. **1353** habla de "otros recursos" para ser **indemnizado**.
Pero nada impide **pactar expresamente** una condición resolutoria en la partición.`,
'Naranjo p. 164');

/* ===== DONACIONES IRREVOCABLES ===== */
K('y07','y','¿Cuáles son las características de la donación entre vivos?',
`Art. **1386**: "La donación entre vivos es un acto por el cual una persona **transfiere gratuita e irrevocablemente** una parte de sus bienes a otra persona, **que la acepta**." Es un **contrato** (pese a decir "acto").
1. **Unilateral** (bilateral si es modal o con carga).
2. **Gratuito**.
3. **Consensual o solemne** según cuantía: en la práctica, solemne.
4. **Excepcional**: "no se presume" (art. **1393**).
5. **Título traslaticio** de dominio (arts. 675, 703), no modo: "transfiere" es impropio; se requiere tradición.
6. **Irrevocable** (art. 1545), salvo **ingratitud** (art. 1428); las hechas entre **cónyuges** valen como **revocables** (art. 1138 inc. 2º).
Requisito especial: **empobrecimiento** del donante y **enriquecimiento** del donatario (art. **1398**): no hay donación en el comodato, el mutuo sin interés, la repudiación de herencia, la fianza o prenda a favor de un tercero, ni los servicios personales gratuitos (arts. 1394–1399).
Se aplican normas sucesorias: incapacidades (art. 1391), interpretación, modalidades, acrecimiento y sustituciones (art. 1416).`,
'Naranjo pp. 174–178 · Manual §189–191 · arts. 1386, 1393, 1398, 1416');

K('y08','y','¿Qué es la insinuación y qué solemnidades exigen las donaciones entre vivos?',
`Art. **1401**: "La donación entre vivos que **no se insinuare**, sólo tendrá efecto hasta el valor de **dos centavos**, y será **nula en el exceso**. Se entiende por insinuación la **autorización de juez competente**, solicitada por el donante o donatario. El juez autorizará las donaciones en que no se contravenga a ninguna disposición legal."
- Sanción: **nulidad absoluta** en el exceso (Somarriva, CS).
- Como el monto no se actualizó, hoy **todas** las donaciones deben insinuarse (profesora). Es un medio **indirecto** de protección de las legítimas.
- **Inmuebles** (art. **1400**): además, **escritura pública inscrita**.
- **A título universal** (art. 1407): insinuación, escritura pública, inscripción si hay inmuebles e **inventario solemne** (lo omitido se entiende reservado).
- **Con causa onerosa** (art. 1404): escritura pública expresando la causa; si no, son gratuitas.
- **Con gravamen** (art. 1405): insinuación solo con descuento del gravamen.
- **A plazo o condición** (art. 1403): escrito que la exprese.
- Entre **esposos** en capitulaciones: sin insinuación (art. 1406).`,
'Naranjo pp. 178–182 · Manual §191–192 · arts. 1400, 1401, 1403–1407');

K('y09','y','¿Por qué causas especiales terminan las donaciones irrevocables?',
`1. **Rescisión** por **inoficiosa donación** (arts. **1425** y 1187): naturaleza discutida (nulidad, Somarriva; resolución, Domínguez; inoponibilidad, Rodríguez Grez).
2. **Resolución** de las donaciones con **causa onerosa o gravamen** por incumplimiento (art. **1426**: el donante pide cumplimiento o "rescisión", que es una condición resolutoria tácita); el donatario restituye como **poseedor de mala fe**; prescribe en **4 años** desde la mora (art. 1427). No se resuelve por el **nacimiento posterior de hijos** salvo cláusula expresa en escritura pública (art. **1424**).
3. **Revocación por ingratitud** (art. **1428**): "Se tiene por acto de ingratitud cualquiera hecho ofensivo del donatario, que le hiciera **indigno de heredar** al donante." Prescribe en **4 años** desde que el donante conoció el hecho; se extingue con su muerte, salvo que se haya intentado en vida, el hecho causara su muerte o fuera posterior a ella (art. **1430**); si el donante está impedido, la ejercen su guardador, descendientes, ascendientes o cónyuge (art. 1431).
**Terceros** (art. **1432**): solo les afecta si la escritura prohibió enajenar o expresó la condición, si se les notificó antes, o si se enajenó después de intentada la acción.`,
'Naranjo pp. 186–188 · Manual §195 · arts. 1424–1432');
/* ===== ARTÍCULOS DE MEMORIA (texto vigente CC, DFL 1 de 2000, versión 28-08-2025) ===== */
A('951','g','Sucesión a título universal y singular','',`Se sucede a una persona difunta a título universal o a título singular.
El título es universal cuando se sucede al difunto en todos sus bienes, derechos y obligaciones transmisibles, o en una cuota de ellos, como la mitad, tercio o quinto.
El título es singular cuando se sucede en una o más especies o cuerpos ciertos, como tal caballo, tal casa; o en una o más especies indeterminadas de cierto género, como un caballo, tres vacas, seiscientos pesos fuertes, cuarenta fanegas de trigo.`);
A('952','g','Sucesión testamentaria, intestada y mixta','',`Si se sucede en virtud de un testamento, la sucesión se llama testamentaria, y si en virtud de la ley, intestada o abintestato.
La sucesión en los bienes de una persona difunta puede ser parte testamentaria, y parte intestada.`);
A('953','g','Asignaciones por causa de muerte y asignatario','',`Se llaman asignaciones por causa de muerte las que hace la ley, o el testamento de una persona difunta, para suceder en sus bienes.
Con la palabra asignaciones se significan en este Libro las asignaciones por causa de muerte, ya las haga el hombre o la ley.
Asignatario es la persona a quien se hace la asignación.`);
A('954','g','Herencias y legados','',`Las asignaciones a título universal se llaman herencias, y las asignaciones a título singular, legados. El asignatario de herencia se llama heredero, y el asignatario de legado, legatario.`);
A('688','h','Inscripciones para disponer de inmuebles hereditarios','',`En el momento de deferirse la herencia, la posesión efectiva de ella se confiere por el ministerio de la ley al heredero; pero esta posesión legal no habilita al heredero para disponer en manera alguna de un inmueble, mientras no preceda:
1º. La inscripción del decreto judicial o la resolución administrativa que otorgue la posesión efectiva: el primero ante el conservador de bienes raíces de la comuna o agrupación de comunas en que haya sido pronunciado, junto con el correspondiente testamento, y la segunda en el Registro Nacional de Posesiones Efectivas;
2º. Las inscripciones especiales prevenidas en los incisos primero y segundo del artículo precedente: en virtud de ellas podrán los herederos disponer de consuno de los inmuebles hereditarios, y
3º. La inscripción prevenida en el inciso tercero: sin ésta no podrá el heredero disponer por sí solo de los inmuebles hereditarios que en la partición le hayan cabido.`);
A('722','h','Posesión legal de la herencia','',`La posesión de la herencia se adquiere desde el momento en que es deferida, aunque el heredero lo ignore.
El que válidamente repudia una herencia se entiende no haberla poseído jamás.`);
A('962','a','Capacidad para suceder: existencia','incs. 1º, 2º, 3º',`Para ser capaz de suceder es necesario existir al tiempo de abrirse la sucesión; salvo que se suceda por derecho de transmisión, según el artículo 957, pues entonces bastará existir al abrirse la sucesión de la persona por quien se transmite la herencia o legado.
Si la herencia o legado se deja bajo condición suspensiva, será también preciso existir en el momento de cumplirse la condición.
Con todo, las asignaciones a personas que al tiempo de abrirse la sucesión no existen, pero se espera que existan, no se invalidarán por esta causa si existieren dichas personas antes de expirar los diez años subsiguientes a la apertura de la sucesión.`);
A('968','a','Causales de indignidad','',`Son indignos de suceder al difunto como herederos o legatarios:
1°. El que ha cometido el crimen de homicidio, femicidio, parricidio o infanticidio en la persona del difunto, o ha intervenido en este crimen por obra o consejo, o la dejó perecer pudiendo salvarla;
2º. El que cometió atentado grave contra la vida, el honor o los bienes de la persona de cuya sucesión se trata, o de su cónyuge, o de cualquiera de sus ascendientes o descendientes, con tal que dicho atentado se pruebe por sentencia ejecutoriada;
3º. El consanguíneo dentro del sexto grado inclusive, que en el estado de demencia o destitución de la persona de cuya sucesión se trata, no la socorrió pudiendo;
4º. El que por fuerza o dolo obtuvo alguna disposición testamentaria del difunto, o le impidió testar;
5º. El que dolosamente ha detenido u ocultado un testamento del difunto, presumiéndose dolo por el mero hecho de la detención u ocultación.`);
A('955','o','Apertura de la sucesión y ley que la rige','',`La sucesión en los bienes de una persona se abre al momento de su muerte en su último domicilio; salvos los casos expresamente exceptuados.
La sucesión se regla por la ley del domicilio en que se abre; salvas las excepciones legales.`);
A('956','o','Delación de las asignaciones','',`La delación de una asignación es el actual llamamiento de la ley a aceptarla o repudiarla.
La herencia o legado se defiere al heredero o legatario en el momento de fallecer la persona de cuya sucesión se trata, si el heredero o legatario no es llamado condicionalmente; o en el momento de cumplirse la condición, si el llamamiento es condicional.
Salvo si la condición es de no hacer algo que dependa de la sola voluntad del asignatario, pues en este caso la asignación se defiere en el momento de la muerte del testador, dándose por el asignatario caución suficiente de restituir la cosa asignada con sus accesiones y frutos, en caso de contravenirse a la condición.
Lo cual, sin embargo, no tendrá lugar cuando el testador hubiere dispuesto que mientras penda la condición de no hacer algo, pertenezca a otro asignatario la cosa asignada.`);
A('957','o','Derecho de transmisión','',`Si el heredero o legatario cuyos derechos a la sucesión no han prescrito, fallece antes de haber aceptado o repudiado la herencia o legado que se le ha deferido, transmite a sus herederos el derecho de aceptar o repudiar dicha herencia o legado, aun cuando fallezca sin saber que se le ha deferido.
No se puede ejercer este derecho sin aceptar la herencia de la persona que lo transmite.`);
A('1222','o','Guarda y aposición de sellos','inc. 1º',`Desde el momento de abrirse una sucesión, todo el que tenga interés en ella, o se presuma que pueda tenerlo, podrá pedir que los muebles y papeles de la sucesión se guarden bajo llave y sello, hasta que se proceda al inventario solemne de los bienes y efectos hereditarios.`);
A('1225','o','Libertad para aceptar o repudiar','inc. 1º',`Todo asignatario puede aceptar o repudiar libremente.`);
A('1226','o','Oportunidad para aceptar o repudiar','incs. 1º, 2º',`No se puede aceptar asignación alguna, sino después que se ha deferido.
Pero después de la muerte de la persona de cuya sucesión se trata, se podrá repudiar toda asignación, aunque sea condicional y esté pendiente la condición.`);
A('1232','o','Plazo para deliberar','inc. 1º',`Todo asignatario será obligado, en virtud de demanda de cualquier persona interesada en ello, a declarar si acepta o repudia; y hará esta declaración dentro de los cuarenta días subsiguientes al de la demanda. En caso de ausencia del asignatario o de estar situados los bienes en lugares distantes, o de otro grave motivo, podrá el juez prorrogar este plazo; pero nunca por más de un año.`);
A('1240','o','Herencia yacente','inc. 1º',`Si dentro de quince días de abrirse la sucesión no se hubiere aceptado la herencia o una cuota de ella, ni hubiere albacea a quien el testador haya conferido la tenencia de los bienes y que haya aceptado su encargo, el juez, a instancia del cónyuge sobreviviente, o de cualquiera de los parientes o dependientes del difunto, o de otra persona interesada en ello, o de oficio, declarará yacente la herencia; se insertará esta declaración en un diario de la comuna, o de la capital de la provincia o de la capital de la región, si en aquélla no lo hubiere; y se procederá al nombramiento de curador de la herencia yacente.`);
A('1241','o','Aceptación expresa o tácita','',`La aceptación de una herencia puede ser expresa o tácita. Es expresa cuando se toma el título de heredero; y es tácita cuando el heredero ejecuta un acto que supone necesariamente su intención de aceptar, y que no hubiera tenido derecho de ejecutar, sino en su calidad de heredero.`);
A('959','c','Bajas generales de la herencia','',`En toda sucesión por causa de muerte, para llevar a efecto las disposiciones del difunto o de la ley, se deducirán del acervo o masa de bienes que el difunto ha dejado, inclusos los créditos hereditarios:
1º. Las costas de la publicación del testamento, si lo hubiere, y las demás anexas a la apertura de la sucesión;
2º. Las deudas hereditarias;
3º. Los impuestos fiscales que gravaren toda la masa hereditaria;
4º. Las asignaciones alimenticias forzosas.
El resto es el acervo líquido de que dispone el testador o la ley.`);
A('980','r','Ámbito de la sucesión intestada','',`Las leyes reglan la sucesión en los bienes de que el difunto no ha dispuesto, o si dispuso, no lo hizo conforme a derecho, o no han tenido efecto sus disposiciones.`);
A('983','r','Llamados a la sucesión intestada','',`Son llamados a la sucesión intestada los descendientes del difunto, sus ascendientes, el cónyuge sobreviviente, sus colaterales, el adoptado, en su caso, y el Fisco.
Los derechos hereditarios del adoptado se rigen por la ley respectiva.`);
A('984','r','Derecho personal y de representación','',`Se sucede abintestato, ya por derecho personal, ya por derecho de representación.
La representación es una ficción legal en que se supone que una persona tiene el lugar y por consiguiente el grado de parentesco y los derechos hereditarios que tendría su padre o madre, si éste o ésta no quisiese o no pudiese suceder.
Se puede representar a un padre o madre que, si hubiese querido o podido suceder, habría sucedido por derecho de representación.`);
A('988','d','Primer orden: hijos y cónyuge','',`Los hijos excluyen a todos los otros herederos, a menos que hubiere también cónyuge sobreviviente, caso en el cual éste concurrirá con aquéllos.
El cónyuge sobreviviente recibirá una porción que, por regla general, será equivalente al doble de lo que por legítima rigorosa o efectiva corresponda a cada hijo. Si hubiere sólo un hijo, la cuota del cónyuge será igual a la legítima rigorosa o efectiva de ese hijo. Pero en ningún caso la porción que corresponda al cónyuge bajará de la cuarta parte de la herencia, o de la cuarta parte de la mitad legitimaria en su caso.
Correspondiendo al cónyuge sobreviviente la cuarta parte de la herencia o de la mitad legitimaria, el resto se dividirá entre los hijos por partes iguales.
La aludida cuarta parte se calculará teniendo en cuenta lo dispuesto en el artículo 996.`);
A('989','d','Segundo orden: cónyuge y ascendientes','',`Si el difunto no ha dejado posteridad, le sucederán el cónyuge sobreviviente y sus ascendientes de grado más próximo.
En este caso, la herencia se dividirá en tres partes, dos para el cónyuge y una para los ascendientes. A falta de éstos, llevará todos los bienes el cónyuge, y, a falta de cónyuge, los ascendientes.
Habiendo un solo ascendiente en el grado más próximo, sucederá éste en todos los bienes, o en toda la porción hereditaria de los ascendientes.`);
A('990','d','Tercer orden: hermanos','',`Si el difunto no hubiere dejado descendientes, ni ascendientes, ni cónyuge, le sucederán sus hermanos.
Entre los hermanos de que habla este artículo se comprenderán los de simple y doble conjunción, pero la porción de los primeros será la mitad que la que corresponda a los segundos.`);
A('992','d','Cuarto orden: otros colaterales','',`A falta de descendientes, ascendientes, cónyuge y hermanos, sucederán al difunto los otros colaterales de grado más próximo, sean de simple o doble conjunción, hasta el sexto grado inclusive.
Los colaterales de simple conjunción, esto es, los que sólo son parientes del difunto por parte de uno de los progenitores, tendrán derecho a la mitad de la porción de los colaterales de doble conjunción, esto es, los que a la vez son parientes del difunto por parte de ambos progenitores. El colateral o los colaterales del grado más próximo excluirán siempre a los otros.`);
A('995','d','Quinto orden: el Fisco','',`A falta de todos los herederos abintestato designados en los artículos precedentes, sucederá el Fisco.`);
A('996','m','Sucesión en parte testada y en parte intestada','',`Cuando en un mismo patrimonio se ha de suceder por testamento y abintestato, se cumplirán las disposiciones testamentarias, y el remanente se adjudicará a los herederos abintestato según las reglas generales.
Pero los que suceden a la vez por testamento y abintestato, imputarán a la porción que les corresponda abintestato lo que recibieren por testamento, sin perjuicio de retener toda la porción testamentaria, si excediere a la otra.
Prevalecerá sobre todo ello la voluntad expresa del testador, en lo que de derecho corresponda.
En todo caso la regla del inciso primero se aplicará una vez enteradas totalmente, a quienes tienen derecho a ellas, las legítimas y mejoras de la herencia.`);
A('999','t','Concepto de testamento','',`El testamento es un acto más o menos solemne, en que una persona dispone del todo o de una parte de sus bienes para que tenga pleno efecto después de sus días, conservando la facultad de revocar las disposiciones contenidas en él, mientras viva.`);
A('1004','t','Indelegabilidad de la facultad de testar','',`La facultad de testar es indelegable.`);
A('1005','t','Inhábiles para testar','',`No son hábiles para testar:
1. Derogado;
2. El impúber;
3. El que se hallare bajo interdicción por causa de demencia;
4. El que actualmente no estuviere en su sano juicio por ebriedad u otra causa;
5. Todo el que no pudiere expresar su voluntad claramente.
Las personas no comprendidas en esta enumeración son hábiles para testar.`);
A('1007','t','Fuerza en el testamento','',`El testamento en que de cualquier modo haya intervenido la fuerza, es nulo en todas sus partes.`);
A('1008','f','Clasificación del testamento','',`El testamento es solemne, o menos solemne.
Testamento solemne es aquel en que se han observado todas las solemnidades que la ley ordinariamente requiere.
El menos solemne o privilegiado es aquel en que pueden omitirse algunas de estas solemnidades, por consideración a circunstancias particulares, determinadas expresamente por la ley.
El testamento solemne es abierto o cerrado.
Testamento abierto, nuncupativo o público es aquel en que el testador hace sabedores de sus disposiciones a los testigos; y testamento cerrado o secreto, es aquel en que no es necesario que los testigos tengan conocimiento de ellas.`);
A('1011','f','El testamento solemne es escrito','',`El testamento solemne es siempre escrito.`);
A('1014','f','Testamento solemne abierto otorgado en Chile','',`En Chile, el testamento solemne y abierto debe otorgarse ante competente escribano y tres testigos, o ante cinco testigos.
Podrá hacer las veces de escribano el juez de letras del territorio jurisdiccional del lugar del otorgamiento: todo lo dicho en este título acerca del escribano, se entenderá respecto del juez de letras, en su caso.`);
A('1023','f','Lo esencial del testamento cerrado','incs. 1º, 2º',`Lo que constituye esencialmente el testamento cerrado es el acto en que el testador presenta al escribano y testigos una escritura cerrada, declarando de viva voz y de manera que el escribano y testigos le vean, oigan y entiendan (salvo el caso del artículo siguiente), que en aquella escritura se contiene su testamento. Los mudos podrán hacer esta declaración escribiéndola a presencia del escribano y testigos.
El testamento deberá estar escrito o a lo menos firmado por el testador.`);
A('1026','f','Nulidad del testamento solemne','',`El testamento solemne, abierto o cerrado, en que se omitiere cualquiera de las formalidades a que deba respectivamente sujetarse, según los artículos precedentes, no tendrá valor alguno.
Con todo, cuando se omitiere una o más de las designaciones prescritas en el artículo 1016, en el inciso 5º del 1023 y en el inciso 2º del 1024, no será por eso nulo el testamento, siempre que no haya duda acerca de la identidad personal del testador, escribano o testigo.`);
A('1069','v','Interpretación: prevalece la voluntad del testador','',`Sobre las reglas dadas en este título acerca de la inteligencia y efecto de las disposiciones testamentarias, prevalecerá la voluntad del testador claramente manifestada, con tal que no se oponga a los requisitos o prohibiciones legales.
Para conocer la voluntad del testador se estará más a la substancia de las disposiciones que a las palabras de que se haya servido.`);
A('1212','v','Revocación del testamento','',`El testamento que ha sido otorgado válidamente no puede invalidarse sino por la revocación del testador.
Sin embargo, los testamentos privilegiados caducan sin necesidad de revocación, en los casos previstos por la ley.
La revocación puede ser total o parcial.`);
A('1215','v','Revocación tácita','',`Un testamento no se revoca tácitamente en todas sus partes por la existencia de otro u otros posteriores.
Los testamentos posteriores que expresamente no revoquen los anteriores, dejarán subsistentes en éstos las disposiciones que no sean incompatibles con las posteriores, o contrarias a ellas.`);
A('1056','s','Asignatario persona cierta y determinada','inc. 1º',`Todo asignatario testamentario deberá ser una persona cierta y determinada, natural o jurídica, ya sea que se determine por su nombre o por indicaciones claras del testamento. De otra manera la asignación se tendrá por no escrita.`);
A('1097','s','Los herederos','',`Los asignatarios a título universal, con cualesquiera palabras que se les llame, y aunque en el testamento se les califique de legatarios, son herederos: representan la persona del testador para sucederle en todos sus derechos y obligaciones transmisibles.
Los herederos son también obligados a las cargas testamentarias, esto es, a las que se constituyen por el testamento mismo, y que no se imponen a determinadas personas.`);
A('1104','s','Los legatarios','',`Los asignatarios a título singular, con cualesquiera palabras que se les llame, y aunque en el testamento se les califique de herederos, son legatarios: no representan al testador; no tienen más derechos ni cargas que los que expresamente se les confieran o impongan.
Lo cual, sin embargo, se entenderá sin perjuicio de su responsabilidad en subsidio de los herederos, y de la que pueda sobrevenirles en el caso de la acción de reforma.`);
A('1147','x','Derecho de acrecimiento','',`Destinado un mismo objeto a dos o más asignatarios, la porción de uno de ellos, que por falta de éste se junta a las porciones de los otros, se dice acrecer a ellas.`);
A('1156','x','Sustitución vulgar','',`La sustitución es vulgar o fideicomisaria.
La sustitución vulgar es aquella en que se nombra un asignatario para que ocupe el lugar de otro que no acepte, o que, antes de deferírsele la asignación, llegue a faltar por fallecimiento, o por otra causa que extinga su derecho eventual.
No se entiende faltar el asignatario que una vez aceptó, salvo que se invalide la aceptación.`);
A('1164','x','Sustitución fideicomisaria','',`Sustitución fideicomisaria es aquella en que se llama a un fideicomisario, que en el evento de una condición se hace dueño absoluto de lo que otra persona poseía en propiedad fiduciaria.
La sustitución fideicomisaria se regla por lo dispuesto en el título De la propiedad fiduciaria.`);
A('1167','z','Asignaciones forzosas','',`Asignaciones forzosas son las que el testador es obligado a hacer, y que se suplen cuando no las ha hecho, aun con perjuicio de sus disposiciones testamentarias expresas.
Asignaciones forzosas son:
1. Los alimentos que se deben por ley a ciertas personas;
2. Las legítimas;
3. La cuarta de mejoras en la sucesión de los descendientes, de los ascendientes y del cónyuge.`);
A('1181','l','Legítima','',`Legítima es aquella cuota de los bienes de un difunto que la ley asigna a ciertas personas llamadas legitimarios.
Los legitimarios son por consiguiente herederos.`);
A('1182','l','Legitimarios','',`Son legitimarios:
1. Los hijos, personalmente o representados por su descendencia;
2. Los ascendientes, y
3. El cónyuge sobreviviente.
No serán legitimarios los ascendientes del causante si la paternidad o la maternidad que constituye o de la que deriva su parentesco, ha sido determinada judicialmente contra la oposición del respectivo padre o madre, salvo el caso del inciso final del artículo 203. Tampoco lo será el cónyuge que por culpa suya haya dado ocasión a la separación judicial.`);
A('1184','l','División de la herencia: mitad legitimaria, mejoras y libre disposición','',`La mitad de los bienes, previas las deducciones indicadas en el artículo 959, y las agregaciones que en seguida se expresan, se dividirá por cabezas o estirpes entre los respectivos legitimarios, según las reglas de la sucesión intestada; lo que cupiere a cada uno en esa división será su legítima rigorosa.
No habiendo descendientes con derecho a suceder, cónyuge sobreviviente, ni ascendientes, la mitad restante es la porción de bienes de que el difunto ha podido disponer a su arbitrio.
Habiendo tales descendientes, cónyuge o ascendientes, la masa de bienes, previas las referidas deducciones y agregaciones, se dividirá en cuatro partes: dos de ellas, o sea la mitad del acervo, para las legítimas rigorosas; otra cuarta, para las mejoras con que el difunto haya querido favorecer a su cónyuge o a uno o más de sus descendientes o ascendientes, sean o no legitimarios, y otra cuarta, de que ha podido disponer a su arbitrio.`);
A('1185','w','Primer acervo imaginario','',`Para computar las cuartas de que habla el artículo precedente, se acumularán imaginariamente al acervo líquido todas las donaciones revocables e irrevocables, hechas en razón de legítimas o de mejoras, según el estado en que se hayan encontrado las cosas donadas al tiempo de la entrega, pero cuidando de actualizar prudencialmente su valor a la época de la apertura de la sucesión.
Las cuartas antedichas se refieren a este acervo imaginario.`);
A('1186','w','Segundo acervo imaginario','',`Si el que tenía a la sazón legitimarios hubiere hecho donaciones entre vivos a extraños, y el valor de todas ellas juntas excediere a la cuarta parte de la suma formada por este valor y el del acervo imaginario, tendrán derecho los legitimarios para que este exceso se agregue también imaginariamente al acervo, para la computación de las legítimas y mejoras.`);
A('1136','y','Donación revocable e irrevocable','',`Donación revocable es aquella que el donante puede revocar a su arbitrio.
Donación por causa de muerte es lo mismo que donación revocable; y donación entre vivos, lo mismo que donación irrevocable.`);
A('1386','y','Donación entre vivos','',`La donación entre vivos es un acto por el cual una persona transfiere gratuita e irrevocablemente una parte de sus bienes a otra persona, que la acepta.`);
A('1354','b','División de las deudas hereditarias','',`Las deudas hereditarias se dividen entre los herederos a prorrata de sus cuotas.
Así el heredero del tercio no es obligado a pagar sino el tercio de las deudas hereditarias.
Pero el heredero beneficiario no es obligado al pago de ninguna cuota de las deudas hereditarias sino hasta concurrencia de lo que valga lo que hereda.
Lo dicho se entiende sin perjuicio de lo dispuesto en los artículos 1356 y 1526.`);
A('1245','b','Aceptación sin beneficio de inventario','',`El que hace acto de heredero sin previo inventario solemne, sucede en todas las obligaciones transmisibles del difunto a prorrata de su cuota hereditaria, aunque le impongan un gravamen que exceda al valor de los bienes que hereda.
Habiendo precedido inventario solemne, gozará del beneficio de inventario.`);
A('1247','b','Beneficio de inventario','',`El beneficio de inventario consiste en no hacer a los herederos que aceptan responsables de las obligaciones hereditarias y testamentarias, sino hasta concurrencia del valor total de los bienes que han heredado.`);
A('1378','b','Beneficio de separación','',`Los acreedores hereditarios y los acreedores testamentarios podrán pedir que no se confundan los bienes del difunto con los bienes del heredero; y en virtud de este beneficio de separación tendrán derecho a que de los bienes del difunto se les cumplan las obligaciones hereditarias o testamentarias con preferencia a las deudas propias del heredero.`);
A('1187','k','Acción de inoficiosa donación','',`Si fuere tal el exceso que no sólo absorba la parte de bienes de que el difunto ha podido disponer a su arbitrio, sino que menoscabe las legítimas rigorosas, o la cuarta de mejoras, tendrán derecho los legitimarios para la restitución de lo excesivamente donado, procediendo contra los donatarios, en un orden inverso al de las fechas de las donaciones, esto es, principiando por las más recientes.
La insolvencia de un donatario no gravará a los otros.`);
A('1216','k','Acción de reforma del testamento','',`Los legitimarios a quienes el testador no haya dejado lo que por ley les corresponde, tendrán derecho a que se reforme a su favor el testamento, y podrán intentar la acción de reforma (ellos o las personas a quienes se hubieren transmitido sus derechos), dentro de los cuatro años contados desde el día en que tuvieron conocimiento del testamento y de su calidad de legitimarios.
Si el legitimario, a la apertura de la sucesión, no tenía la administración de sus bienes, no prescribirá en él la acción de reforma antes de la expiración de cuatro años contados desde el día en que tomare esa administración.`);
A('1217','k','Objeto de la acción de reforma','',`En general, lo que por ley corresponde a los legitimarios y lo que tienen derecho a reclamar por la acción de reforma, es su legítima rigorosa, o la efectiva en su caso.
El legitimario que ha sido indebidamente desheredado, tendrá, además, derecho para que subsistan las donaciones entre vivos comprendidas en la desheredación.`);
A('1264','k','Acción de petición de herencia','',`El que probare su derecho a una herencia, ocupada por otra persona en calidad de heredero, tendrá acción para que se le adjudique la herencia, y se le restituyan las cosas hereditarias, tanto corporales como incorporales; y aun aquellas de que el difunto era mero tenedor, como depositario, comodatario, prendario, arrendatario, etc., y que no hubieren vuelto legítimamente a sus dueños.`);
A('1269','k','Prescripción de la petición de herencia','',`El derecho de petición de herencia expira en diez años. Pero el heredero putativo, en el caso del inciso final del artículo 704, podrá oponer a esta acción la prescripción de cinco años.`);
A('1207','p','Desheredamiento','',`Desheredamiento es una disposición testamentaria en que se ordena que un legitimario sea privado del todo o parte de su legítima.
No valdrá el desheredamiento que no se conformare a las reglas que en este título se expresan.`);
A('1208','p','Causales de desheredamiento','',`Un descendiente no puede ser desheredado sino por alguna de las causas siguientes:
1ª. Por haber cometido injuria grave contra el testador en su persona, honor o bienes, o en la persona, honor o bienes de su cónyuge, o de cualquiera de sus ascendientes o descendientes;
2ª. Por no haberle socorrido en el estado de demencia o destitución, pudiendo;
3ª. Por haberse valido de fuerza o dolo para impedirle testar;
4ª. Eliminada.
5ª. Por haber cometido un delito que merezca pena aflictiva; o por haberse abandonado a los vicios o ejercido granjerías infames; a menos que se pruebe que el testador no cuidó de la educación del desheredado.
Los ascendientes y el cónyuge podrán ser desheredados por cualquiera de las tres primeras causas.`);
A('1209','p','Requisitos del desheredamiento','',`No valdrá ninguna de las causas de desheredamiento mencionadas en el artículo anterior, si no se expresa en el testamento específicamente, y si además no se hubiere probado judicialmente en vida del testador, o las personas a quienes interesare el desheredamiento no la probaren después de su muerte.
Sin embargo, no será necesaria la prueba, cuando el desheredado no reclamare su legítima dentro de los cuatro años subsiguientes a la apertura de la sucesión; o dentro de los cuatro años contados desde el día en que haya cesado su incapacidad de administrar, si al tiempo de abrirse la sucesión era incapaz.`);
A('1210','p','Efectos del desheredamiento','',`Los efectos del desheredamiento, si el desheredador no los limitare expresamente, se extienden no sólo a las legítimas, sino a todas las asignaciones por causa de muerte y a todas las donaciones que le haya hecho el desheredador.
Pero no se extienden a los alimentos, excepto en los casos de injuria atroz.`);
A('1218','p','Preterición','',`El haber sido pasado en silencio un legitimario deberá entenderse como una institución de heredero en su legítima.
Conservará además las donaciones revocables que el testador no hubiere revocado.`);
A('1270','e','Albaceas','',`Ejecutores testamentarios o albaceas son aquellos a quienes el testador da el encargo de hacer ejecutar sus disposiciones.`);
A('1311','e','Albacea fiduciario','',`El testador puede hacer encargos secretos y confidenciales al heredero, a el albacea, y a cualquiera otra persona, para que se invierta en uno o más objetos lícitos una cuantía de bienes de que pueda disponer libremente.
El encargado de ejecutarlos se llama albacea fiduciario.`);
A('1317','q','Acción de partición e indivisión','',`Ninguno de los coasignatarios de una cosa universal o singular será obligado a permanecer en la indivisión; la partición del objeto asignado podrá siempre pedirse con tal que los coasignatarios no hayan estipulado lo contrario.
No puede estipularse proindivisión por más de cinco años, pero cumplido este término podrá renovarse el pacto.
Las disposiciones precedentes no se extienden a los lagos de dominio privado, ni a los derechos de servidumbre, ni a las cosas que la ley manda mantener indivisas, como la propiedad fiduciaria.`);
A('1318','q','Partición hecha por el causante','',`Si el difunto ha hecho la partición por acto entre vivos o por testamento, se pasará por ella en cuanto no fuere contraria a derecho ajeno.
En especial, la partición se considerará contraria a derecho ajeno si no ha respetado el derecho que el artículo 1337, regla 10ª, otorga al cónyuge sobreviviente.`);
A('1344','q','Efecto declarativo de la partición','',`Cada asignatario se reputará haber sucedido inmediata y exclusivamente al difunto en todos los efectos que le hubieren cabido, y no haber tenido jamás parte alguna en los otros efectos de la sucesión.
Por consiguiente, si alguno de los coasignatarios ha enajenado una cosa que en la partición se adjudica a otro de ellos, se podrá proceder como en el caso de la venta de cosa ajena.`);
A('1348','q','Nulidad y rescisión de la partición','',`Las particiones se anulan o se rescinden de la misma manera y según las mismas reglas que los contratos.
La rescisión por causa de lesión se concede al que ha sido perjudicado en más de la mitad de su cuota.`);

</script>
<script>
/* ======================= MOTOR ======================= */
const ORDER='g h a o c r d m t f v s x z l w y b k p e q'.split(' ');
UNITS.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));
const UNIT=Object.fromEntries(UNITS.map(u=>[u.id,u]));
// orden de estudio: por unidad del programa; dentro de cada unidad, preguntas y luego artículos
CARDS.forEach((c,i)=>c.ix=i);
CARDS.sort((a,b)=>(ORDER.indexOf(a.u)-ORDER.indexOf(b.u))||((a.k==='a')-(b.k==='a'))||(a.ix-b.ix));
CARDS.forEach((c,i)=>c.o=i);
const BYID=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const LADDER=[1,2,4,7,12,20];
const LS='cedulario-sucesorio-v1';

const dayOf=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const today=()=>dayOf(new Date());
const dDate=n=>new Date(n*864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmt=n=>{const d=dDate(n);return d.getUTCDate()+' '+MES[d.getUTCMonth()]};
const fmtLong=n=>{const d=dDate(n);return DIA[d.getUTCDay()]+' '+d.getUTCDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getUTCMonth()]};
const iso=n=>dDate(n).toISOString().slice(0,10);
const fromIso=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Math.floor(Date.UTC(+m[1],m[2]-1,+m[3])/864e5):null};
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};

function freshState(){const t=today();return {v:1,start:t,exam:t+14,newDays:10,cards:{},plan:{},log:{},updatedAt:0};}
let ST=null;
try{ST=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){ST=null}
if(!ST||ST.v!==1)ST=freshState();

const lastDay=()=>ST.exam-1;
const introEnd=()=>Math.min(ST.start+ST.newDays-1,lastDay()-1);
const iv=s=>LADDER[Math.min(Math.max(s,1)-1,LADDER.length-1)];
function cap(id,nat){
  const T=today(),L=lastDay();
  if(nat<=L)return nat;
  if(T>=L)return T+1;
  return Math.max(T+1,L-(hash(id)%3)); // repaso final escalonado en los 3 últimos días
}
const st=id=>ST.cards[id];
const introduced=id=>!!(ST.cards[id]&&ST.cards[id].i!=null);
function remainingNew(){return CARDS.filter(c=>!introduced(c.id))}
function quotaToday(){
  const T=today(),key='d'+T;
  if(ST.plan[key]==null){
    const R=remainingNew().length+introducedOn(T);
    const left=introEnd()-T+1;
    ST.plan[key]=left<=0?R:Math.ceil(R/left);
  }
  return ST.plan[key];
}
function introducedOn(T){let n=0;for(const k in ST.cards)if(ST.cards[k].i===T)n++;return n}
function newLeftToday(){return Math.max(0,quotaToday()-introducedOn(today()))}
function dueToday(){const T=today();return CARDS.filter(c=>introduced(c.id)&&st(c.id).d<=T)}
function logT(){const k='d'+today();return ST.log[k]||(ST.log[k]={n:0,r:0,a:0})}

// Calificación: 0 Otra vez · 1 Difícil · 2 Bien · 3 Fácil
function apply(id,g,dry){
  const T=today();
  const c0=ST.cards[id];
  const isNew=!c0||c0.i==null;
  const c=isNew?{s:0,d:T,l:0,r:0,i:T,t:T}:{...c0};
  const due=isNew||c.d<=T;
  let requeue=false;
  c.r++;c.t=T;
  if(due){
    if(g===0){if(!isNew)c.l++;c.s=0;c.d=T;requeue=true}
    else if(g===1){c.d=cap(id,T+1)}
    else if(g===2){c.s+=1;c.d=cap(id,T+iv(c.s))}
    else {c.s+=2;c.d=cap(id,T+iv(c.s))}
  }else{ // repaso adelantado: solo baja la etapa si falla
    if(g===0){c.l++;c.s=0;c.d=T;requeue=true}
    else if(g===1){c.d=Math.min(c.d,T+1)}
  }
  if(dry)return {c,requeue,isNew,due};
  ST.cards[id]=c;
  const L=logT(); if(isNew)L.n++; else L.r++; if(g===0)L.a++;
  touch();
  return {c,requeue,isNew,due};
}
function label(id,g){
  const {c,requeue}=apply(id,g,true);
  if(requeue)return 'ahora';
  const d=c.d-today();
  if(d<=0)return 'hoy';
  if(d===1)return 'mañana';
  return d+' días';
}

/* ======================= GUARDADO ======================= */
let sync={mode:'local',msg:'Guardado en este navegador'};
let db=null,ref=null,writing=false,dirty=false,timer=null;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}
function touch(){ST.updatedAt=Date.now();saveLocal();if(ref){dirty=true;clearTimeout(timer);timer=setTimeout(flush,2500)}}
async function flush(){
  if(!ref||writing||!dirty)return;
  writing=true;dirty=false;
  try{await ref.set({state:JSON.stringify(ST),updatedAt:ST.updatedAt});setSync('cloud','Guardado en tu cuenta')}
  catch(e){dirty=true;setSync('local','No se pudo guardar en tu cuenta; queda guardado en este navegador')}
  writing=false;
  if(dirty){clearTimeout(timer);timer=setTimeout(flush,2500)}
}
function setSync(m,msg){sync={mode:m,msg};const el=document.getElementById('syncline');if(el)el.innerHTML=syncHTML()}
function syncHTML(){return (sync.mode==='cloud'?'<b>☁ </b>':'')+esc(sync.msg)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(timer);flush()}});
async function initRemote(){
  const cl=window.claude; if(!cl||!cl.use)return;
  const to=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
  try{
    const pair=await Promise.race([Promise.all([cl.use('db'),cl.use('user')]),to(10000)]);
    if(!pair)return; const [d,u]=pair; if(!d||!u)return;
    const id=await Promise.race([u.id(),to(10000)]); if(!id)return;
    db=d; ref=db.doc('data/users/'+id+'/progress');
    const snap=await Promise.race([ref.get(),to(10000)]);
    if(!snap){ref=null;return}
    let remote=null;
    if(snap.exists){try{remote=JSON.parse(snap.data().state)}catch(e){remote=null}}
    if(remote&&remote.v===1&&(remote.updatedAt||0)>(ST.updatedAt||0)){ST=remote;saveLocal();setSync('cloud','Progreso recuperado de tu cuenta');render()}
    else if((ST.updatedAt||0)>0&&(!remote||(ST.updatedAt||0)>(remote.updatedAt||0))){dirty=true;await flush()}
    else setSync('cloud','Guardado en tu cuenta');
  }catch(e){ref=null}
}

/* ======================= RENDER UTIL ======================= */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function md(t){
  const L=t.split('\n');let h='',stack=[];
  const close=lv=>{while(stack.length>lv)h+='</li></'+stack.pop()+'>'};
  for(const raw of L){
    const m2=/^  - (.*)$/.exec(raw),m1=/^- (.*)$/.exec(raw),mo=/^(\d+)\. (.*)$/.exec(raw);
    if(m2&&stack.length){ if(stack.length<2){h+='<ul>';stack.push('ul')}else h+='</li>'; h+='<li>'+inl(m2[1]); continue}
    if(m1||mo){const tag=m1?'ul':'ol';close(1);
      if(stack.length&&stack[0]!==tag)close(0);
      if(!stack.length){h+='<'+tag+(mo?' start="'+mo[1]+'"':'')+'>';stack.push(tag)}else h+='</li>';
      h+='<li>'+inl(m1?m1[1]:mo[2]);continue}
    close(0);
    if(raw.trim())h+='<p>'+inl(raw)+'</p>';
  }
  close(0);return h;
}
const ORDN=['1º','2º','3º','4º','5º','6º','7º','8º','9º'];
function artHTML(c){
  const ps=c.a.split('\n');let k=0;
  const idx=c.inc?c.inc.match(/\d/g).map(x=>+x-1):null;
  return ps.map((p,i)=>{let lab;const m=/^(\d+)\s*[ªº°]?\.?\s/.exec(p);
    if(idx)lab='inc. '+ORDN[idx[i]];else if(m&&i>0)lab='Nº '+m[1];else lab='inc. '+ORDN[k++];
    return '<div class="inc"><span>'+lab+'</span><div>'+(i===0?'<b>Art. '+esc(c.n)+'.</b> ':'')+esc(p)+'</div></div>'}).join('');
}
function answerHTML(c){
  return '<div class="ans">'+(c.k==='a'?artHTML(c):md(c.a))+'</div>'+
    (c.note?'<div class="note"><b>Ojo:</b> '+inl(c.note)+'</div>':'')+
    '<div class="src">Fuente: '+esc(c.src)+'</div>';
}
function stageChip(id){
  const s=st(id);
  if(!s||s.i==null)return '<span class="st-dot" title="Nueva"></span>';
  const cls=s.l>0&&s.s<=1?'bad':s.s>=3?'s3':s.s>=2?'s2':'s1';
  return '<span class="st-dot '+cls+'" title="Etapa '+s.s+' · próximo repaso '+fmt(s.d)+'"></span>';
}
function unitStats(uid){
  const cs=CARDS.filter(c=>!uid||c.u===uid);let seen=0,solid=0,weak=0;
  for(const c of cs){const s=st(c.id);if(s&&s.i!=null){seen++;if(s.s>=3)solid++;if(s.l>0&&s.s<=1)weak++}}
  return {n:cs.length,seen,solid,weak};
}
const progBar=(a,b,n)=>'<div class="prog" role="img" aria-label="'+a+' consolidadas y '+(b-a)+' en curso de '+n+'"><i class="p1" style="width:'+(n?a/n*100:0)+'%"></i><i class="p2" style="width:'+(n?(b-a)/n*100:0)+'%"></i></div>';

/* ======================= VISTAS ======================= */
let view='hoy', S=null; // S = sesión activa
const app=document.getElementById('app');
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.v)}));
function go(v){if(S&&v!=='estudio'){S=null}view=v;
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  render();window.scrollTo(0,0)}
function render(){
  const T=today();const n=ST.exam-ST.start;
  document.getElementById('topsub').textContent='Día '+Math.min(Math.max(T-ST.start+1,1),n)+' de '+n+' · prueba el '+fmt(ST.exam);
  if(view==='estudio'&&S)return renderStudy();
  if(view==='libre')return renderLibre('libre');
  if(view==='arts')return renderLibre('arts');
  if(view==='indice')return renderIndice();
  if(view==='ajustes')return renderAjustes();
  view='hoy';renderHoy();
}

function forecast(){
  const T=today(),L=lastDay();const out=[];
  let R=remainingNew().length;
  for(let d=ST.start;d<=L;d++){
    const o={d,rev:0,nw:0,done:0};
    if(d<T){const lg=ST.log['d'+d];o.done=lg?lg.n+lg.r:0}
    out.push(o);
  }
  for(const c of CARDS){const s=st(c.id);if(!s||s.i==null)continue;const dd=Math.max(s.d,T);const o=out[dd-ST.start];if(o&&dd>=T)o.rev++}
  // nuevas proyectadas
  let rem=R;
  for(let d=T;d<=L;d++){const o=out[d-ST.start];if(!o)continue;
    if(d===T){o.nw=newLeftToday();rem-=o.nw;continue}
    const left=introEnd()-d+1; if(left<=0||rem<=0)continue;
    const q=Math.ceil(rem/left);o.nw=q;rem-=q}
  return out;
}
function renderHoy(){
  const T=today(),n=ST.exam-ST.start,dn=T-ST.start+1;
  const due=dueToday(),nl=newLeftToday(),lg=logT();
  const all=unitStats();
  const nextNew=remainingNew().slice(0,nl);
  const uToday=[...new Set(nextNew.map(c=>c.u))];
  const fc=forecast();const mx=Math.max(1,...fc.map(o=>o.rev+o.nw+o.done));
  const before=T<ST.start, after=T>=ST.exam;
  const total=due.length+nl;
  let h='<div class="stack">';
  h+='<section class="today-hero"><div><div class="eyebrow">'+esc(fmtLong(T))+'</div><div class="dayno">'+(before?'Antes del plan':after?'Día de la prueba':'Día '+dn+' <small>de '+n+'</small>')+'</div>'+
     '<div class="muted" style="margin-top:6px">Prueba oral el <b>'+esc(fmtLong(ST.exam))+'</b> · '+(ST.exam-T>0?'faltan '+(ST.exam-T)+' días':'¡hoy!')+'</div></div></section>';
  h+='<section class="stats"><div class="stat"><b>'+due.length+'</b><span>'+(due.length===1?'repaso pendiente':'repasos pendientes')+'</span></div><div class="stat"><b>'+nl+'</b><span>'+(nl===1?'tarjeta nueva para hoy':'tarjetas nuevas para hoy')+'</span></div><div class="stat"><b>'+(lg.n+lg.r)+'</b><span>respondidas hoy</span></div></section>';
