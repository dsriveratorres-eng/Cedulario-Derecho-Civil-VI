  h+='<section class="panel stack" style="gap:12px">';
  if(total>0){
    h+='<div class="row" style="justify-content:space-between"><div><h2>Sesión de hoy</h2><div class="muted">'+due.length+(due.length===1?' repaso':' repasos')+(nl?' + '+nl+(nl===1?' nueva':' nuevas'):'')+'. Primero lo que toca repasar, intercalado con materia nueva.</div></div>'+
       '<button class="btn primary" id="go-hoy">Estudiar '+total+' tarjetas</button></div>';
    if(uToday.length)h+='<div><div class="eyebrow" style="margin-bottom:6px">Materia nueva de hoy</div><div class="units-today">'+uToday.map(u=>'<span class="chip">'+esc(UNIT[u].n)+' <span class="mono muted">'+esc(UNIT[u].p)+'</span></span>').join('')+'</div></div>';
  }else{
    h+='<div><h2>Meta de hoy cumplida</h2><div class="muted">Puedes seguir sumando repasos: las tarjetas adelantadas no se te desordenan, y si fallas una vuelve a repasarse antes.</div></div>'+
       '<div class="row"><button class="btn primary" id="go-extra">Adelantar 20 tarjetas</button><button class="btn" id="go-weak">Repasar las que fallé</button>'+(remainingNew().length?'<button class="btn" id="go-more">Adelantar 15 nuevas</button>':'')+'</div>';
  }
  h+='</section>';
  // plan
  h+='<section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Plan de '+n+' días</h3><div class="legend"><span><i style="background:var(--accent)"></i>repasos programados</span><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>nuevas previstas</span><span><i style="background:var(--line)"></i>hechas</span></div></div>';
  h+='<div class="plan" style="--n:'+fc.length+'">'+fc.map(o=>{const tot=o.rev+o.nw+o.done;
      return '<div class="pcol'+(o.d===T?' today':'')+'" title="'+esc(fmt(o.d))+': '+(o.d<T?o.done+' respondidas':o.rev+' repasos, '+o.nw+' nuevas')+'">'+
      (o.nw?'<div class="pbar new" style="height:'+(o.nw/mx*100)+'%"></div>':'')+
      (o.rev?'<div class="pbar rev" style="height:'+(o.rev/mx*100)+'%"></div>':'')+
      (o.done?'<div class="pbar done" style="height:'+(o.done/mx*100)+'%"></div>':'')+'</div>'}).join('')+'</div>';
  h+='<div class="plabels" style="--n:'+fc.length+'">'+fc.map(o=>'<span>'+(o.d-ST.start+1)+'</span>').join('')+'</div>';
  h+='<div class="muted" style="font-size:12.5px;margin-top:8px">Materia nueva hasta el día '+(introEnd()-ST.start+1)+'; después, solo repaso. Las tarjetas que vencerían después de la prueba se reparten en los tres últimos días para el repaso final.</div></section>';
  // progreso
  h+='<section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>Avance por unidad del programa</h3><span class="muted mono" style="font-size:12.5px">'+all.seen+'/'+all.n+' vistas · '+all.solid+' consolidadas</span></div>';
  h+=UNITS.map(u=>{const s=unitStats(u.id);return '<div class="unitrow"><div class="nm">'+esc(u.n)+'<small>'+esc(u.p)+(s.weak?' · '+s.weak+' con fallos':'')+'</small></div>'+progBar(s.solid,s.seen,s.n)+'<span class="mono muted" style="font-size:12px;text-align:right">'+s.seen+'/'+s.n+'</span></div>'}).join('');
  h+='</section><div class="sync" id="syncline">'+syncHTML()+'</div></div>';
  app.innerHTML=h;
  const b=id=>document.getElementById(id);
  if(b('go-hoy'))b('go-hoy').onclick=()=>startSession('hoy');
  if(b('go-extra'))b('go-extra').onclick=()=>startSession('extra');
  if(b('go-weak'))b('go-weak').onclick=()=>startSession('weak');
  if(b('go-more'))b('go-more').onclick=()=>startSession('more');
}

/* ======================= SESIÓN ======================= */
function startSession(kind,ids,title){
  const T=today();let q=[],t='';
  if(kind==='hoy'){
    const due=dueToday().sort((a,b)=>(st(a.id).d-st(b.id).d)||(st(a.id).s-st(b.id).s)||(a.o-b.o)).map(c=>c.id);
    const nw=remainingNew().slice(0,newLeftToday()).map(c=>c.id);
    let ni=0;due.forEach((id,i)=>{q.push(id);if(i%2===1&&ni<nw.length)q.push(nw[ni++])});
    while(ni<nw.length)q.push(nw[ni++]);t='Sesión de hoy';
  }else if(kind==='extra'){
    q=CARDS.filter(c=>introduced(c.id)&&st(c.id).d>T).sort((a,b)=>(st(a.id).s-st(b.id).s)||(st(b.id).l-st(a.id).l)||(st(a.id).d-st(b.id).d)).slice(0,20).map(c=>c.id);t='Repaso adelantado';
  }else if(kind==='weak'){
    q=CARDS.filter(c=>introduced(c.id)&&st(c.id).l>0).sort((a,b)=>(st(b.id).l-st(a.id).l)||(st(a.id).s-st(b.id).s)).slice(0,30).map(c=>c.id);t='Las que fallé';
  }else if(kind==='more'){
    q=remainingNew().slice(0,15).map(c=>c.id);t='Nuevas adelantadas';
  }else{q=ids.slice();t=title||'Repaso'}
  if(kind!=='libre')backView='hoy';
  if(!q.length){toastEmpty();return}
  S={kind,title:t,q,pos:0,shown:false,total:q.length,done:0,again:0};
  view='estudio';render();window.scrollTo(0,0);
}
function toastEmpty(){alertBox('No hay tarjetas que cumplan ese criterio por ahora.')}
function alertBox(msg){const d=document.createElement('div');d.className='panel';d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:90vw';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function renderStudy(){
  if(S.pos>=S.q.length)return renderDone();
  const id=S.q[S.pos],c=BYID[id],u=UNIT[c.u],s=st(id);
  const isNew=!s||s.i==null;
  const left=S.q.length-S.pos;
  let h='<div class="sess-head"><div><div class="eyebrow">'+esc(S.title)+'</div><div class="counts" style="margin-top:4px"><span class="chip mono">'+(S.done)+' hechas</span><span class="chip mono">'+left+' en cola</span>'+(isNew?'<span class="chip on">Nueva</span>':'<span class="chip">Etapa '+s.s+(s.l?' · '+s.l+' fallo'+(s.l>1?'s':''):'')+'</span>')+'</div></div><button class="btn small" id="quit">Terminar</button></div>';
  h+='<div class="sess-prog"><i style="width:'+(S.done/(S.done+left)*100)+'%"></i></div>';
  h+='<article class="card"><div class="card-h"><span>'+esc(u.n)+'</span><span class="ref">'+(c.k==='a'?'Art. '+esc(c.n):esc(c.id))+' · '+esc(u.p)+'</span></div>';
  if(c.k==='a')h+='<div class="card-q"><span class="artno">ARTÍCULO '+esc(c.n)+' · CÓDIGO CIVIL'+(c.inc?' · '+esc(c.inc):'')+'</span>'+esc(c.t)+'<span class="hint">Recítalo de memoria, en voz alta, y luego compara palabra por palabra.</span></div>';
  else h+='<div class="card-q">'+inl(c.q)+'</div>';
  if(S.shown)h+='<div class="card-a">'+answerHTML(c)+'</div>';
  h+='</article><div class="actbar">';
  if(!S.shown)h+='<button class="btn primary showbtn" id="show">Mostrar respuesta <span class="kbd" style="color:inherit;border-color:currentColor">espacio</span></button>';
  else h+='<div class="rate">'+['Otra vez','Difícil','Bien','Fácil'].map((l,g)=>'<button class="r'+g+'" data-g="'+g+'"><b>'+l+'</b><small>'+esc(label(id,g))+'</small></button>').join('')+'</div><div class="muted" style="font-size:11.5px;text-align:center;margin-top:6px">Teclas <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> <span class="kbd">4</span> · «Otra vez» si no la recordaste en lo esencial</div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('quit').onclick=()=>{S=null;go(S_back())};
  const sb=document.getElementById('show');if(sb){sb.onclick=reveal;sb.focus({preventScroll:true})}
  app.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>rate(+b.dataset.g));
}
let backView='hoy';
const S_back=()=>backView;
function reveal(){S.shown=true;renderStudy()}
function rate(g){
  const id=S.q[S.pos];const r=apply(id,g);
  S.done++;if(g===0)S.again++;
  if(r.requeue){const at=Math.min(S.q.length,S.pos+5);S.q.splice(at,0,id)}
  S.pos++;S.shown=false;renderStudy();window.scrollTo(0,0);
}
function renderDone(){
  const due=dueToday().length,nl=newLeftToday();
  let h='<div class="panel stack done-box"><div class="eyebrow">'+esc(S.title)+'</div><h2>Sesión terminada</h2><div class="muted">'+S.done+' respuestas'+(S.again?', '+S.again+' marcadas «Otra vez» (ya volvieron a aparecer y quedaron programadas)':'')+'.</div>';
  h+='<div class="row">'+(due+nl?'<button class="btn primary" id="d-hoy">Seguir con lo de hoy ('+(due+nl)+')</button>':'<button class="btn primary" id="d-extra">Adelantar 20 tarjetas</button>')+'<button class="btn" id="d-weak">Repasar las que fallé</button><button class="btn" id="d-home">Volver</button></div></div>';
  app.innerHTML=h;const b=id=>document.getElementById(id);
  if(b('d-hoy'))b('d-hoy').onclick=()=>startSession('hoy');
  if(b('d-extra'))b('d-extra').onclick=()=>startSession('extra');
  b('d-weak').onclick=()=>startSession('weak');
  b('d-home').onclick=()=>{S=null;go(backView)};
}
document.addEventListener('keydown',e=>{
  if(view!=='estudio'||!S||S.pos>=S.q.length)return;
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  if(!S.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal();return}
  if(S.shown&&/^[1-4]$/.test(e.key)){e.preventDefault();rate(+e.key-1)}
});

/* ======================= REPASO LIBRE / ARTÍCULOS ======================= */
const F={libre:{units:new Set(),estado:'todas',tipo:'todas',orden:'programa',cant:'30'},arts:{units:new Set(),estado:'todas',tipo:'art',orden:'programa',cant:'todas'}};
try{const sv=JSON.parse(localStorage.getItem(LS+'-f')||'null');if(sv)for(const k of ['libre','arts'])if(sv[k]){Object.assign(F[k],sv[k]);F[k].units=new Set(sv[k].units||[])}}catch(e){}
function saveF(){try{localStorage.setItem(LS+'-f',JSON.stringify({libre:{...F.libre,units:[...F.libre.units]},arts:{...F.arts,units:[...F.arts.units]}}))}catch(e){}}
function pick(mode){
  const f=F[mode];const T=today();
  let cs=CARDS.filter(c=>(!f.units.size||f.units.has(c.u)));
  const tipo=mode==='arts'?'art':f.tipo;
  if(tipo==='art')cs=cs.filter(c=>c.k==='a');else if(tipo==='q')cs=cs.filter(c=>c.k==='q');
  if(f.estado==='nuevas')cs=cs.filter(c=>!introduced(c.id));
  else if(f.estado==='vistas')cs=cs.filter(c=>introduced(c.id));
  else if(f.estado==='dificiles')cs=cs.filter(c=>introduced(c.id)&&(st(c.id).l>0||st(c.id).s<=1));
  else if(f.estado==='vencidas')cs=cs.filter(c=>introduced(c.id)&&st(c.id).d<=T);
  if(f.orden==='azar'){cs=cs.slice();for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]]}}
  else if(f.orden==='debiles')cs=cs.slice().sort((a,b)=>{const A=st(a.id),B=st(b.id);return ((A?A.s:-1)-(B?B.s:-1))||((B?B.l:0)-(A?A.l:0))});
  return cs;
}
function seg(name,opts,val){return '<div class="seg" role="group" data-k="'+name+'">'+opts.map(([v,l])=>'<button data-val="'+v+'" aria-pressed="'+(v===val)+'">'+l+'</button>').join('')+'</div>'}
function renderLibre(mode){
  const f=F[mode];const cs=pick(mode);const n=f.cant==='todas'?cs.length:Math.min(cs.length,+f.cant);
  const isA=mode==='arts';
  let h='<div class="stack">';
  h+='<div><div class="eyebrow">'+(isA?'Texto literal del Código Civil':'Elige qué repasar')+'</div><h2>'+(isA?'Artículos de memoria':'Repaso libre')+'</h2><div class="muted" style="margin-top:4px">'+(isA?'Los '+CARDS.filter(c=>c.k==='a').length+' artículos que conviene saber de memoria para la oral, con su texto vigente. Los que aún no has visto se integran al plan diario; aquí puedes practicarlos cuando quieras.':'Repasa cualquier parte de la materia. Lo que respondas aquí también cuenta para el plan: si fallas, la tarjeta vuelve antes; si es nueva, queda incorporada.')+'</div></div>';
  h+='<section class="panel filters">';
  h+='<div><div class="eyebrow" style="margin-bottom:6px">Unidades '+(f.units.size?'('+f.units.size+')':'(todas)')+'</div><div class="chips" id="uchips">'+UNITS.map(u=>{const cnt=CARDS.filter(c=>c.u===u.id&&(!isA||c.k==='a')).length;if(!cnt)return '';return '<button data-u="'+u.id+'" aria-pressed="'+f.units.has(u.id)+'">'+esc(u.n)+' <span class="mono" style="opacity:.7">'+cnt+'</span></button>'}).join('')+'</div>'+(f.units.size?'<button class="link" id="uclear" style="margin-top:6px;font-size:13px">Quitar filtro de unidades</button>':'')+'</div>';
  h+='<div class="row" style="gap:16px;align-items:flex-start"><div><div class="eyebrow" style="margin-bottom:6px">Estado</div>'+seg('estado',[['todas','Todas'],['vencidas','Pendientes hoy'],['dificiles','Difíciles'],['nuevas','No vistas'],['vistas','Vistas']],f.estado)+'</div>';
  if(!isA)h+='<div><div class="eyebrow" style="margin-bottom:6px">Tipo</div>'+seg('tipo',[['todas','Todo'],['q','Preguntas'],['art','Artículos']],f.tipo)+'</div>';
  h+='<div><div class="eyebrow" style="margin-bottom:6px">Orden</div>'+seg('orden',[['programa','Programa'],['azar','Al azar'],['debiles','Más débiles primero']],f.orden)+'</div>';
  h+='<div><div class="eyebrow" style="margin-bottom:6px">Cantidad</div>'+seg('cant',[['20','20'],['30','30'],['50','50'],['todas','Todas']],f.cant)+'</div></div>';
  h+='<div class="row" style="justify-content:space-between"><span class="muted">'+cs.length+' tarjetas cumplen el filtro</span><button class="btn primary" id="lgo" '+(n?'':'disabled')+'>Practicar '+n+'</button></div></section>';
  if(isA){
    h+='<section class="panel"><h3 style="margin-bottom:8px">Lista de artículos</h3>'+cs.map(c=>'<details class="qitem" data-id="'+c.id+'"><summary><span class="id">'+esc(c.n)+'</span><span class="qq">'+esc(c.t)+(c.inc?' <span class="muted">('+esc(c.inc)+')</span>':'')+'</span><span class="st">'+stageChip(c.id)+'</span></summary><div class="body"></div></details>').join('')+(cs.length?'':'<div class="muted">Ningún artículo con ese filtro.</div>')+'</section>';
  }
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('#uchips button').forEach(b=>b.onclick=()=>{const u=b.dataset.u;f.units.has(u)?f.units.delete(u):f.units.add(u);saveF();renderLibre(mode)});
  const uc=document.getElementById('uclear');if(uc)uc.onclick=()=>{f.units.clear();saveF();renderLibre(mode)};
  app.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{f[sg.dataset.k]=b.dataset.val;saveF();renderLibre(mode)}));
  document.getElementById('lgo').onclick=()=>{backView=mode;startSession('libre',cs.slice(0,n).map(c=>c.id),isA?'Artículos de memoria':'Repaso libre')};
  bindLazy();
}
function bindLazy(){app.querySelectorAll('details.qitem').forEach(d=>d.addEventListener('toggle',()=>{const b=d.querySelector('.body');if(d.open&&!b.innerHTML)b.innerHTML=answerHTML(BYID[d.dataset.id])}))}

/* ======================= ÍNDICE ======================= */
let qtext='';
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderIndice(){
  let h='<div class="stack"><div><div class="eyebrow">Toda la materia, en el orden del programa</div><h2>Índice y buscador</h2><div class="muted" style="margin-top:4px">'+CARDS.length+' tarjetas: '+CARDS.filter(c=>c.k==='q').length+' preguntas de examen y '+CARDS.filter(c=>c.k==='a').length+' artículos literales. Abre cualquiera para leer la respuesta.</div></div>';
  h+='<label class="f" for="qs">Buscar en preguntas y respuestas<input type="search" id="qs" placeholder="Ej.: preterición, 1182, acción de reforma" value="'+esc(qtext)+'"></label><div id="ires"></div></div>';
  app.innerHTML=h;
  const inp=document.getElementById('qs');let tm=null;
  inp.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{qtext=inp.value;fillIndice()},180)});
  fillIndice();
}
function qItem(c){return '<details class="qitem" data-id="'+c.id+'"><summary><span class="id">'+(c.k==='a'?esc(c.n):esc(c.id))+'</span><span class="qq">'+(c.k==='a'?'<span class="chip art" style="padding:0 7px;font-size:11px">Art.</span> '+esc(c.t):inl(c.q))+'</span><span class="st">'+stageChip(c.id)+'</span></summary><div class="body"></div></details>'}
function fillIndice(){
  const box=document.getElementById('ires');const q=fold(qtext.trim());
  if(q){
    const terms=q.split(/\s+/);
    const hits=CARDS.filter(c=>{const t=fold(c.q+' '+c.a+' '+(c.t||'')+' '+(c.n||'')+' '+c.src);return terms.every(x=>t.includes(x))});
    box.innerHTML='<section class="panel"><div class="muted" style="margin-bottom:8px">'+hits.length+' resultado'+(hits.length===1?'':'s')+(hits.length>80?' (se muestran 80)':'')+'</div>'+hits.slice(0,80).map(c=>'<div class="eyebrow" style="margin:8px 0 4px;font-size:10.5px">'+esc(UNIT[c.u].n)+'</div>'+qItem(c)).join('')+'</section>';
  }else{
    box.innerHTML='<section class="panel">'+UNITS.map(u=>{const s=unitStats(u.id);return '<details class="unit" data-u="'+u.id+'"><summary><span class="t">'+esc(u.n)+'<small class="mono">'+esc(u.p)+' · '+s.n+'</small></span>'+progBar(s.solid,s.seen,s.n)+'</summary><div class="ulist" style="padding-bottom:10px"></div></details>'}).join('')+'</section>';
    box.querySelectorAll('details.unit').forEach(d=>d.addEventListener('toggle',()=>{const l=d.querySelector('.ulist');if(d.open&&!l.innerHTML){l.innerHTML=CARDS.filter(c=>c.u===d.dataset.u).map(qItem).join('')+'<button class="btn small" data-pu="'+d.dataset.u+'">Practicar esta unidad</button>';bindLazy();l.querySelector('[data-pu]').onclick=()=>{backView='indice';startSession('libre',CARDS.filter(c=>c.u===d.dataset.u).map(c=>c.id),UNIT[d.dataset.u].n)}}}));
  }
  bindLazy();
}

/* ======================= AJUSTES ======================= */
let confirmReset=false;
function renderAjustes(){
  const n=ST.exam-ST.start;
  let h='<div class="stack"><div><div class="eyebrow">Plan de estudio</div><h2>Plan y ajustes</h2></div>';
  h+='<section class="panel stack" style="gap:12px"><div class="row" style="align-items:flex-end;gap:12px">'+
     '<label class="f" for="f-start" style="flex:1;min-width:140px">Primer día del plan<input type="date" id="f-start" value="'+iso(ST.start)+'"></label>'+
     '<label class="f" for="f-exam" style="flex:1;min-width:140px">Fecha de la prueba oral<input type="date" id="f-exam" value="'+iso(ST.exam)+'"></label>'+
     '<label class="f" for="f-nd" style="width:150px">Días con materia nueva<input type="number" id="f-nd" min="3" max="30" value="'+ST.newDays+'"></label></div>'+
     '<div class="row"><button class="btn primary" id="f-save">Guardar plan</button><span class="muted" id="f-msg">'+n+' días de estudio; materia nueva hasta el día '+(introEnd()-ST.start+1)+'.</span></div></section>';
  h+='<section class="panel howto"><h3>Cómo se reparte el estudio</h3><ol>'+
     '<li>Las '+CARDS.length+' tarjetas entran en el orden del programa del curso (de generalidades a partición), repartidas en partes iguales entre los días con materia nueva. Cada unidad cierra con sus artículos de memoria.</li>'+
     '<li>Cada tarjeta que respondes con «Bien» vuelve a los 1, 2, 4, 7 y 12 días: el intervalo crece justo cuando empezarías a olvidarla. «Fácil» salta una etapa; «Difícil» la repite mañana; «Otra vez» la devuelve a la misma sesión, cinco tarjetas después, y reinicia sus intervalos.</li>'+
     '<li>Ningún repaso queda para después de la prueba: lo que vencería más tarde se reparte entre los tres últimos días, que funcionan como repaso general.</li>'+
     '<li>Si un día no estudias, lo pendiente se acumula y la materia nueva restante se redistribuye entre los días que quedan.</li>'+
     '<li>Cuando terminas lo del día, puedes adelantar tarjetas: un acierto adelantado no altera su programación; un fallo la trae de vuelta antes.</li></ol></section>';
  h+='<section class="panel stack" style="gap:10px"><h3>Fuentes</h3><div class="muted" style="font-size:13.5px">Respuestas basadas en el manual <i>Derecho Sucesorio</i> de Maricruz Gómez de la Torre (prima en caso de discrepancia), el apunte «Sucesorio» de Naranjo (Somarriva y Meza Barros) y el Código Civil vigente (DFL 1 de 2000, versión de agosto de 2025). Cuando las fuentes discrepan, la tarjeta lo dice y señala la posición de la profesora.</div></section>';
  h+='<section class="panel stack" style="gap:10px"><h3>Tu progreso</h3><div class="sync" id="syncline">'+syncHTML()+'</div>'+
     (confirmReset?'<div class="confirm"><span>Se borrará el avance de las '+CARDS.length+' tarjetas y el plan empezará hoy.</span><button class="btn danger" id="r-yes">Sí, borrar todo</button><button class="btn" id="r-no">Cancelar</button></div>':'<div><button class="btn danger" id="r-ask">Reiniciar progreso</button></div>')+'</section></div>';
  app.innerHTML=h;
  const b=id=>document.getElementById(id);
  b('f-save').onclick=()=>{
    const s=fromIso(b('f-start').value),e=fromIso(b('f-exam').value),nd=Math.round(+b('f-nd').value);
    if(s==null||e==null){b('f-msg').textContent='Revisa las fechas: falta una de ellas.';return}
    if(e-s<4){b('f-msg').textContent='La prueba debe quedar al menos 4 días después del inicio.';return}
    if(!(nd>=3&&nd<=30)){b('f-msg').textContent='Los días con materia nueva van de 3 a 30.';return}
    ST.start=s;ST.exam=e;ST.newDays=nd;delete ST.plan['d'+today()];
    const L=lastDay();for(const k in ST.cards){const c=ST.cards[k];if(c.d>L&&today()<L)c.d=Math.max(today()+1,L-(hash(k)%3))}
    touch();renderAjustes();b('f-msg').textContent='Plan guardado.';
  };
  if(b('r-ask'))b('r-ask').onclick=()=>{confirmReset=true;renderAjustes()};
  if(b('r-no'))b('r-no').onclick=()=>{confirmReset=false;renderAjustes()};
  if(b('r-yes'))b('r-yes').onclick=()=>{confirmReset=false;ST=freshState();touch();go('hoy')};
}

render();
initRemote();
</script>
</body>
